packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# One version per dependency across the workspace (CLAUDE.md §3 closed stack list).
catalog:
  react: 18.3.1
  react-dom: 18.3.1
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
  antd: ^5.29.3
  # Ant Design 5's own date library; direct use approved in D-035.
  dayjs: ^1.11.23
  # Rich-text editor (D-036, D-040, D-051): MIT, no Tiptap Pro. One pinned version for all parts.
  '@tiptap/core': 3.34.0
  '@tiptap/pm': 3.34.0
  '@tiptap/react': 3.34.0
  '@tiptap/starter-kit': 3.34.0
  '@tiptap/extension-link': 3.34.0
  '@tiptap/extension-table': 3.34.0
  '@tiptap/extension-placeholder': 3.34.0
  '@tiptap/extensions': 3.34.0
  '@tiptap/extension-mention': 3.34.0
  '@tiptap/extension-image': 3.34.0
  '@tiptap/suggestion': 3.34.0
  '@tanstack/react-query': ^5.107.1
  # The workflow designer's canvas (§3 "React Flow (xyflow)", WP-048b S4; MIT). Pinned to a
  # release over two weeks old; its companions are listed in the S4 PR.
  '@xyflow/react': 12.12.1
  typescript: ~5.9.3
  vite: ^8.3.8
  '@vitejs/plugin-react': ^6.3.0
  vitest: ^5.1.0
  jsdom: ^30.1.3
  '@testing-library/react': ^16.3.0
  '@testing-library/dom': ^10.4.0

# Install scripts of dependencies run only when listed here (pnpm refuses unlisted ones in CI).
# protobufjs (via centrifuge, D-030): its postinstall only prints a version notice; not needed.
allowBuilds:
  protobufjs: false

# minimatch 7.x to 11.0.0 (GHSA-g3hv-75wg-m249, moderate): lifted to the patched 11.0.1+, the
# same package already in the tree (openapi-typescript's), not a new dependency.
overrides:
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1

# D-174 (Haider, 2026-11-17): the one accepted advisory, for dev and build tools only.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf, high, ReDoS): dev/build tools only, patterns from
    # our own config, not in any shipped image or bundle (make not-shipped-check and the
    # cluster SBOM step prove it). Expires 2026-12-01 (audit-frontend fails after it); re-checked
    # every Monday; removed as soon as a fixed picomatch is released.
    - GHSA-fc5q-39xc-vjpf
