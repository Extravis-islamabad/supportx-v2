packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# One version per dependency across the workspace (CLAUDE.md §3 closed stack list).
catalog:
  react: 18.3.1
  react-dom: 18.3.1
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
  antd: ^5.29.3
  # Ant Design 5's own date library; direct use approved in D-035.
  dayjs: ^1.11.23
  # Rich-text editor (D-036, D-040, D-051): MIT, no Tiptap Pro. One pinned version for all parts.
  '@tiptap/core': 3.32.2
  '@tiptap/pm': 3.32.2
  '@tiptap/react': 3.32.2
  '@tiptap/starter-kit': 3.32.2
  '@tiptap/extension-link': 3.32.2
  '@tiptap/extension-table': 3.32.2
  '@tiptap/extension-placeholder': 3.32.2
  '@tiptap/extensions': 3.32.2
  '@tiptap/extension-mention': 3.32.2
  '@tiptap/extension-image': 3.32.2
  '@tiptap/suggestion': 3.32.2
  '@tanstack/react-query': ^5.105.0
  # The workflow designer's canvas (§3 "React Flow (xyflow)", WP-048b S4; MIT). Pinned to a
  # release over two weeks old; its companions are listed in the S4 PR.
  '@xyflow/react': 12.12.0
  typescript: ~5.9.3
  vite: ^8.3.5
  '@vitejs/plugin-react': ^6.0.0
  vitest: ^5.0.5
  jsdom: ^30.1.3
  '@testing-library/react': ^16.3.0
  '@testing-library/dom': ^10.4.0

# Install scripts of dependencies run only when listed here (pnpm refuses unlisted ones in CI).
# protobufjs (via centrifuge, D-030): its postinstall only prints a version notice; not needed.
allowBuilds:
  protobufjs: false
