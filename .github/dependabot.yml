# Weekly dependency updates (WP-003). Minor and patch bumps arrive as one grouped PR per ecosystem.
# Until the MVP, majors for npm and uv are not proposed (coordinator for the product owner,
# 2026-11-02): they get a planned upgrade after the pilot. `ignore` applies to version updates
# only, so security updates, majors included, still come through. Every PR must pass CI and
# Security.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*" # no majors until after the pilot (security updates still come)
        update-types: [version-update:semver-major]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    # Majors pinned by recorded decisions; upgrading them needs a product-owner decision first.
    ignore:
      - dependency-name: "*" # no majors until after the pilot (security updates still come)
        update-types: [version-update:semver-major]
      # Also pinned by recorded decisions, after the pilot too:
      - dependency-name: typescript # D-014: latest typescript-eslint supports (5.9.x)
        update-types: [version-update:semver-major]
      - dependency-name: antd # ADR-002: Ant Design 5
        update-types: [version-update:semver-major]
      - dependency-name: "@ant-design/*"
        update-types: [version-update:semver-major]
      - dependency-name: react # CLAUDE.md §3: React 18
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
