name: Set up backend
description: >-
  uv and Python (exact versions) with the uv cache keyed on backend/uv.lock, then
  `uv sync --frozen`.
  Shared by every workflow so the toolchain is identical everywhere.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.12.19"
        # Exact and equal to backend/.python-version (backend/tests/test_tool_pins.py): never
        # the runner's system Python, which changes with the runner image. The newest 3.12 the
        # pinned uv can install; the image's Python (3.12.15) lines up when uv is next bumped.
        python-version: "3.12.14"
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Install backend dependencies (lockfile only)
      shell: bash
      working-directory: backend
      run: uv sync --frozen
