name: Changes
description: >-
  Whether this run needs a job's heavy work. Workflows with required checks trigger on every PR
  (a required check that never reports blocks the merge forever); this first step decides, from
  the changed files, whether to do the work or finish at once with a stated reason. Pull
  requests: the PR's files. Merge queue: the group's files against main. Anything else
  (nightly, manual): always run. In the queue, a group that was already dropped (its temporary
  branch is gone) finishes at once, so a superseded group frees its runners. Heavy jobs are not
  decided here: in speed mode (D-122) their job-level `if:` runs them nightly, manually and on
  PRs labelled full-ci only.
inputs:
  light:
    description: Paths that never need the heavy work (ERE on each changed file's path).
    default: '^(docs/|.*\.(md|mdx)$)'
  needs:
    description: Paths that need it (ERE); empty means any path that is not light.
    default: ""
  skipped:
    description: The reason shown when the heavy work is not needed.
    default: "skipped: docs-only change"
outputs:
  run:
    description: '"true" when the heavy work is needed, else "false".'
    value: ${{ steps.decide.outputs.run }}
runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        REPO: ${{ github.repository }}
        LIGHT: ${{ inputs.light }}
        NEEDS: ${{ inputs.needs }}
        SKIPPED: ${{ inputs.skipped }}
      run: |
        set -euo pipefail
        finish() {
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=${GITHUB_JOB}::$1"
          { echo "### $1"; echo; echo "$2"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        }
        if [ "$EVENT" = "merge_group" ]; then
          # Only a definite "not found" counts: any other error runs the work, so a flaky API
          # can never let an untested group merge (the full suite gates every merge).
          if ! answer=$(gh api "repos/$REPO/git/ref/${QUEUE_REF#refs/}" 2>&1); then
            if grep -q "HTTP 404" <<< "$answer"; then
              finish "skipped: merge group superseded" \
                "The queue dropped this group (its branch is gone), so its work would test nothing."
            fi
            echo "Could not check the queue branch; running the work: $answer"
          fi
        fi
        # Both names of a renamed file count. The APIs list at most so many files (pull request:
        # 3000; compare: 300): a change that big always runs.
        case "$EVENT" in
          pull_request)
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            limit=3000
            ;;
          merge_group)
            files=$(gh api "repos/$REPO/compare/$QUEUE_BASE...$QUEUE_HEAD" \
              --jq '.files[] | .filename, (.previous_filename // empty)')
            limit=300
            ;;
          *)
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        count=$(printf '%s\n' "$files" | grep -c . || true)
        run=false
        reason="$SKIPPED"
        if [ "$count" -ge "$limit" ]; then
          run=true
          reason="$limit or more changed files"
        else
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [[ "$file" =~ $LIGHT ]] && continue
            if [ -z "$NEEDS" ] || [[ "$file" =~ $NEEDS ]]; then
              run=true
              reason="$file"
              break
            fi
          done <<< "$files"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
        if [ "$run" = "true" ]; then
          echo "Heavy work needed ($count changed files; first that needs it: $reason)"
        else
          echo "::notice title=${GITHUB_JOB}::$SKIPPED"
          {
            echo "### $SKIPPED"
            echo
            echo "None of the $count changed files needs this job's work, so it finished at once."
          } >> "$GITHUB_STEP_SUMMARY"
        fi
