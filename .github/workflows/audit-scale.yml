# The audit log at 10 million entries (WP-018, D-076 item 11): sealing, full verification, the
# retention job (archive to S3, cut-off, partition drop), the screen's search and tamper
# detection, with timings in the job summary. Too slow for every PR
# (CI runs the same test with 100k entries); nightly and on demand.
name: Audit scale

on:
  schedule:
    - cron: "53 1 * * *" # nightly 01:53 UTC
  workflow_dispatch:
    inputs:
      rows:
        description: Number of audit entries (0 skips the audit volume test)
        default: "10000000"
      asset_import_rows:
        description: Rows for the asset import timing (WP-049b S4b; 0 skips it, target 20000)
        default: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  audit-scale:
    name: audit scale
    runs-on: ubuntu-24.04
    # A 2-vCPU runner needs more than 2 hours for 10M entries with retention (the first run was
    # cut off at 120 minutes); hosted runners allow up to 6 hours.
    timeout-minutes: 300
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      SUPPORTX_TEST_ADMIN_URL: postgresql://postgres:ci-admin-${{ github.run_id }}@127.0.0.1:5432/postgres
      SUPPORTX_TEST_APP_PASSWORD: ci-app-${{ github.run_id }}
      SUPPORTX_TEST_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}
      SUPPORTX_TEST_RELAY_PASSWORD: ci-relay-${{ github.run_id }}
      SUPPORTX_REQUIRE_DB_TESTS: "1"
      SUPPORTX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      SUPPORTX_REQUIRE_S3_TESTS: "1"
      SUPPORTX_AUDIT_SCALE_ROWS: ${{ inputs.rows || '10000000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start SeaweedFS (S3 API; same image as the Helm chart)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:4.48 \
            server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333 && break
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:8333 # fail the job if never up
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/generated
      - name: Volume test
        if: ${{ (inputs.rows || '10000000') != '0' }}
        working-directory: backend
        env:
          SUPPORTX_AUDIT_SCALE_REPORT: ${{ runner.temp }}/audit-scale.json
        run: uv run pytest --no-cov -q -s -m scale tests/db/test_audit_scale.py
      # By hand only (the coordinator, 2026-11-11): a large asset import's dry run and real run on
      # a CI runner, so its figure is not a loaded laptop's.
      # The incident test world needs Valkey (sessions); the audit volume test does not, so it
      # starts here only (the same image as ci.yml). The world skips without it, so the step
      # fails unless the timing really ran (a skip must never look like a figure).
      - name: Asset import timing
        if: ${{ (inputs.asset_import_rows || '0') != '0' }}
        working-directory: backend
        env:
          SUPPORTX_ASSET_IMPORT_SCALE_ROWS: ${{ inputs.asset_import_rows }}
          SUPPORTX_ASSET_IMPORT_SCALE_REPORT: ${{ runner.temp }}/asset-import-scale.json
          SUPPORTX_TEST_VALKEY_URL: valkey://127.0.0.1:6379/0
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:9.1.2-alpine
          for _ in $(seq 1 30); do
            docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          set -o pipefail
          uv run pytest --no-cov -q -s -rs -m scale tests/db/test_asset_import_scale.py | tee "$RUNNER_TEMP/asset-import-scale.log"
          grep -q "1 passed" "$RUNNER_TEMP/asset-import-scale.log" || {
            echo "::error::the asset import timing did not run (skipped?)"; exit 1; }
      - name: Timings (job summary)
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/audit-scale.json" ]; then
            { echo '### Audit log at volume'; echo '```json'; cat "$RUNNER_TEMP/audit-scale.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/asset-import-scale.json" ]; then
            { echo '### Asset import at volume'; echo '```json'; cat "$RUNNER_TEMP/asset-import-scale.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
