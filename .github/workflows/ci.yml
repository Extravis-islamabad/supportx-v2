# Quality gates (architecture.md §16.2, WP-003). Every step calls the same Makefile target a
# developer runs locally (`make check`, `make build`, `make precommit`), so CI and local cannot drift.
name: CI

on:
  # labeled: adding the full-ci label runs the heavy jobs on this PR (speed mode, D-122).
  pull_request:
    # ready_for_review: a draft runs only the fast set (below); marking it ready runs everything.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # The merge queue: each queued group is tested on top of main before it merges.
  merge_group:
  # No run on push to main (D-122): the merge queue tested that exact merge commit.
  schedule:
    - cron: "07 2 * * *" # nightly 02:07 UTC: the heavy jobs, and what changes outside a PR
  workflow_dispatch:

permissions:
  contents: read

# One group per PR: a new push cancels that PR's outdated run, freeing runners for every lane.
# A queue group gets one group per temporary branch (a re-run replaces the old one); a group the
# queue dropped finishes at once in its first step (.github/actions/changes). Nightly and manual
# runs each get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('queue-{0}', github.event.merge_group.head_ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  FORCE_COLOR: "1"

jobs:
  # The backend gate runs as three jobs (product owner, 2026-10-27: under 15 minutes; one job
  # reached 38). `backend-checks` lints, type-checks and migrates; `backend-tests` runs the suite
  # in SHARDS (8) parallel jobs, each with its own services and pytest-xdist inside
  # (tooling/pytest_shards.py balances the files); `backend` (the required check) combines their
  # coverage and enforces the threshold. Opt-in slow tests (the audit volume test) run nightly
  # only (audit-scale.yml).
  backend-checks:
    name: backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      SUPPORTX_TEST_ADMIN_URL: postgresql://postgres:ci-admin-${{ github.run_id }}@127.0.0.1:5432/postgres
      SUPPORTX_TEST_APP_PASSWORD: ci-app-${{ github.run_id }}
      SUPPORTX_TEST_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}
      SUPPORTX_TEST_RELAY_PASSWORD: ci-relay-${{ github.run_id }}
      SUPPORTX_MIGRATION_DATABASE_URL: postgresql://supportx_migrator:ci-migrator-${{ github.run_id }}@127.0.0.1:5432/supportx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the event schema check compares with the target branch
      - name: Changes (docs-only PRs skip)
        id: changes
        uses: ./.github/actions/changes
        with:
          # The mobile app has its own job (`mobile`): a mobile-only PR skips this one.
          light: '^(docs/|mobile/|.*\.(md|mdx)$)'
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run == 'true' }}
      - name: Lint (ruff check, ruff format --check, import-linter, OpenAPI + event schema drift)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make backend-lint
      - name: Event schemas have no breaking change against the target branch
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          base_file="$RUNNER_TEMP/event-schemas.base.json"
          if git show "origin/${base_ref}:docs/architecture/event-schemas.json" > "$base_file" 2>/dev/null; then
            make events-check base="$base_file"
          else
            echo "origin/${base_ref} has no event-schemas.json yet: nothing to compare against."
          fi
      - name: OpenAPI has no breaking change against the target branch
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          base_file="$RUNNER_TEMP/openapi.base.json"
          committed="origin/${base_ref}:frontend/packages/api-client/openapi.json"
          if git cat-file -e "$committed" 2>/dev/null; then
            git show "$committed" > "$base_file"  # a target branch from before D-127
          else
            # Generated, never committed (D-127): export the target branch's contract from its code.
            git worktree add --detach "$RUNNER_TEMP/base" "origin/${base_ref}"
            (cd "$RUNNER_TEMP/base/backend" && uv sync --frozen \
              && uv run python -m tooling.export_openapi "$base_file")
          fi
          make openapi-diff base="$base_file"
      - name: Type-check (mypy --strict)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make backend-typecheck
      - name: Create roles and database (same code as the test fixtures)
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: uv run python -m tooling.db_bootstrap --database supportx
      - name: Migrate to head, then check tenant isolation (RLS guard)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make db-migrate db-current db-guard

  worker-resilience:
    # Must-fix before the pilot (2026-10-28): PostgreSQL and NATS restart under running workers
    # (relay, consumers) and every event is published and applied once afterwards; a worker
    # whose database stays away exits non-zero. The test runs its own containers.
    name: worker resilience
    # Speed mode (D-122): heavy, not a required check. Runs nightly, manually, and on a PR
    # labelled full-ci; never in the merge queue. Skipped here, it takes no runner.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/generated
      - name: Restart PostgreSQL and NATS under running workers
        working-directory: backend
        env:
          SUPPORTX_RESILIENCE_TESTS: "1"
          SUPPORTX_RESILIENCE_LOGS: ${{ runner.temp }}
        run: uv run pytest tests/resilience --no-cov -p no:cacheprovider -v
      - name: Worker logs on failure
        if: ${{ failure() }}
        run: tail -n 200 "$RUNNER_TEMP"/resilience-*.log || true

  ldap-federation:
    # AD/LDAP end to end (WP-040, D-130): a throwaway Keycloak (the stack's version, dev realm) and
    # a test-only OpenLDAP built from Debian's slapd. SupportX's component and mappers are
    # accepted and synced, people come back mapped, and only supportx-federation may federate.
    # The test runs its own containers.
    name: ldap federation
    # Speed mode (D-122): heavy, not a required check. Runs nightly, manually, and on a PR
    # labelled full-ci; never in the merge queue. Skipped here, it takes no runner.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/generated
      - name: Keycloak and OpenLDAP, end to end
        working-directory: backend
        env:
          SUPPORTX_LDAP_FEDERATION_TESTS: "1"
          SUPPORTX_LDAP_FEDERATION_LOGS: ${{ runner.temp }}
        run: uv run pytest tests/federation --no-cov -p no:cacheprovider -v
      - name: Keycloak and OpenLDAP logs on failure
        if: ${{ failure() }}
        run: tail -n 300 "$RUNNER_TEMP"/ldap-federation-*.log || true

  valkey-failover:
    # HA Valkey (WP-014b, ADR-038): the chart's own Valkey and Sentinel scripts, run as three
    # containers. Sentinel promotes a replica when the master stops, data survives, and the old
    # master rejoins as a replica (no split brain). The test runs its own containers.
    name: valkey failover
    # Not a required check. Runs nightly, manually, and on a PR that touches deployment or
    # Valkey (the changes step below decides; other PRs finish at once), never in the merge
    # queue. Not tied to the full-ci label (coordinator, 2026-11-05): a migration PR needs the
    # core profile and e2e, not the HA cluster.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only deployment and Valkey changes need this job)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(deploy/|Makefile$|\.github/workflows/(ci|cluster)\.yml$|\.github/actions/|backend/app/core/valkey\.py$|backend/tests/ha/)'
          skipped: "skipped: no deployment or Valkey change"
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          version: v4.3.1
      - name: Helm chart dependencies (cached by Chart.lock)
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/helm/supportx/charts/*.tgz
          key: helm-chart-deps-${{ hashFiles('deploy/helm/supportx/Chart.lock') }}
      - name: Chart dependencies (the test renders the chart's own scripts)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make chart-deps
      - name: Valkey and Sentinel fail over
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: backend
        env:
          SUPPORTX_HA_TESTS: "1"
        run: uv run pytest tests/ha --no-cov -p no:cacheprovider -v

  shard-weights:
    # The newest nightly's file timings (its `backend-shard-weights` artifact), resolved once per
    # run so all shards balance on the same numbers and split the files the same way. The
    # weights refresh every night without a commit; when none can be fetched the shards fall
    # back to backend/tests/shard_weights.json. Never fails: a missing artifact only means the
    # committed weights are used.
    name: shard weights
    # Drafts run the fast set only (coordinator, 2026-11-06: runners were starved by every draft
    # and queue entry fanning out ~15 jobs): lint, type checks, migrations, Vitest, build, secret
    # scan. The DB shards wait for ready_for_review, and the queue always runs them.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # list the nightly runs and download their artifact
    steps:
      - name: The newest nightly's shard weights
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p weights
          run=$(gh run list --repo "$REPO" --workflow ci.yml --event schedule --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run" ] && gh run download "$run" --repo "$REPO" -n backend-shard-weights -D weights; then
            if jq -e 'type == "object" and length > 0' weights/shard_weights.json > /dev/null; then
              echo "Shard weights from nightly run $run ($(jq length weights/shard_weights.json) files)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          rm -rf weights
          echo "No nightly shard weights: the shards use backend/tests/shard_weights.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-weights
          path: weights/shard_weights.json
          retention-days: 1
          if-no-files-found: ignore

  backend-tests:
    name: backend tests ${{ matrix.shard }}/8
    needs: [shard-weights]
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }} # drafts: the fast set only (see shard-weights)
    runs-on: ubuntu-24.04
    # Eight shards and a 35-minute backstop since 2026-11-10 (Haider, via the coordinator): six
    # shards had grown to 20-25 min on slow runners and cancelled #307 three times. The backstop
    # only stops a hung shard; the aim stays about 12 min a shard (the suite profile follows).
    timeout-minutes: 35
    strategy:
      fail-fast: false # every shard reports its failures in one run
      matrix:
        # Six since 2026-11-05 (coordinator): with four, shards ran 17-20 min of the 20 min
        # limit as the suite grew (WP-044, 049, 058); four since 2026-11-04, three before.
        shard: [1, 2, 3, 4, 5, 6, 7, 8] # keep in step with SUPPORTX_TEST_SHARD below
    # Real PostgreSQL (same pgvector image as the dev stack) and PgBouncer in transaction mode, so
    # the RLS, migration and tenant-isolation tests run on every PR and can never be skipped.
    # NATS JetStream is started as a step below (service containers cannot pass `-js`).
    # Passwords are throwaway values unique to this run; the containers die with the job.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: supportx_app
          DB_PASSWORD: ci-app-${{ github.run_id }}
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          LISTEN_PORT: "6432"
          # Four test workers share it (pytest-xdist).
          DEFAULT_POOL_SIZE: "20"
          # 0 = PgBouncer does NOT track prepared statements (like older or third-party poolers),
          # which proves our asyncpg settings work without that feature (app/core/database.py).
          MAX_PREPARED_STATEMENTS: "0"
        ports: ["6432:6432"]
      # Rate limiting (WP-008) runs against real Valkey; no password on this throwaway container.
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      SUPPORTX_TEST_SHARD: ${{ matrix.shard }}/8
      SUPPORTX_TEST_ADMIN_URL: postgresql://postgres:ci-admin-${{ github.run_id }}@127.0.0.1:5432/postgres
      SUPPORTX_TEST_APP_PASSWORD: ci-app-${{ github.run_id }}
      SUPPORTX_TEST_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}
      SUPPORTX_TEST_RELAY_PASSWORD: ci-relay-${{ github.run_id }}
      SUPPORTX_TEST_PGBOUNCER: 127.0.0.1:6432
      SUPPORTX_REQUIRE_DB_TESTS: "1"
      # Outbox relay, consumers, DLQ and latency/throughput tests (WP-007) cannot be skipped.
      SUPPORTX_TEST_NATS_URL: nats://127.0.0.1:4222
      SUPPORTX_REQUIRE_NATS_TESTS: "1"
      SUPPORTX_TEST_VALKEY_URL: valkey://127.0.0.1:6379/0
      SUPPORTX_REQUIRE_VALKEY_TESTS: "1"
      # Audit exports (WP-018) on SeaweedFS, the on-prem object store (ADR-012); started below.
      SUPPORTX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      SUPPORTX_REQUIRE_S3_TESTS: "1"
      SUPPORTX_MIGRATION_DATABASE_URL: postgresql://supportx_migrator:ci-migrator-${{ github.run_id }}@127.0.0.1:5432/supportx
      COVERAGE_FILE: ${{ github.workspace }}/backend/.coverage.shard${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (docs-only PRs skip)
        id: changes
        uses: ./.github/actions/changes
        with:
          # The mobile app has its own job (`mobile`): a mobile-only PR skips this one.
          light: '^(docs/|mobile/|.*\.(md|mdx)$)'
      - name: Start NATS JetStream (same image as the dev stack)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.15.1-alpine -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && break
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' # fail the job if never up
      - name: Start SeaweedFS (S3 API; same image as the Helm chart)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:4.48 \
            server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333 && break
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:8333 # fail the job if never up
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run == 'true' }}
      - name: Create roles and database (same code as the test fixtures)
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: uv run python -m tooling.db_bootstrap --database supportx
      # Temporal's time-skipping test server, downloaded once per temporalio version: fetching it
      # on every run hit the download host's rate limit (429) and failed unrelated PRs.
      - name: Temporal test-server version
        id: temporal
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: echo "version=$(grep -A1 '^name = "temporalio"$' backend/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Temporal test-server cache
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ steps.temporal.outputs.version }}
      - name: The run's shard weights (the newest nightly's; none means the committed ones)
        if: ${{ steps.changes.outputs.run == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-weights
          path: ${{ runner.temp }}/shard-weights
      - name: Test this shard (4 workers; coverage combined and checked by the backend job)
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: backend
        env:
          # tooling/pytest_shards.py falls back to tests/shard_weights.json when this is missing.
          SUPPORTX_TEST_WEIGHTS: ${{ runner.temp }}/shard-weights/shard_weights.json
          SUPPORTX_PERF_REPORT: ${{ runner.temp }}/event-perf.json
          # Each file's seconds, to refresh tests/shard_weights.json from CI (tooling/pytest_shards.py).
          SUPPORTX_TEST_TIMINGS: ${{ runner.temp }}/timings.json
          SUPPORTX_TEMPORAL_TEST_SERVER_DIR: ${{ runner.temp }}/temporal-test-server  # cached above
        run: uv run pytest -n 4 --dist loadfile --cov-report= --cov-fail-under=0 --durations=15
      - name: Event bus latency and throughput (job summary)
        if: ${{ steps.changes.outputs.run == 'true' && (!cancelled()) }}
        run: |
          if [ -f "$RUNNER_TEMP/event-perf.json" ]; then
            { echo '### Event bus performance'; echo '```json'; cat "$RUNNER_TEMP/event-perf.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/event-perf.json"
          fi
      - name: Keep this shard's coverage for the backend job
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: backend/.coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Keep this shard's file timings (to refresh tests/shard_weights.json)
        if: ${{ steps.changes.outputs.run == 'true' && (!cancelled()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
          retention-days: 14
          if-no-files-found: warn
      - name: NATS logs on failure
        if: ${{ steps.changes.outputs.run == 'true' && (failure()) }}
        run: docker logs --tail 200 nats

  backend:
    name: backend
    # pdf: the PDF tests in the worker image (D-100 D8) gate merges through this required check.
    needs: [backend-checks, backend-tests, pdf]
    # Always runs, so a failed or cancelled shard fails this required check instead of skipping it
    # (a skipped required check would count as passed).
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every backend job passed
        env:
          CHECKS: ${{ needs.backend-checks.result }}
          TESTS: ${{ needs.backend-tests.result }}
          PDF: ${{ needs.pdf.result }}
          DRAFT: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) }}
        run: |
          echo "backend checks: $CHECKS, backend tests: $TESTS, pdf: $PDF, draft: $DRAFT"
          # pdf is skipped outside nightly, manual and full-ci runs (speed mode, D-122).
          # The shards are skipped only on a draft; anywhere else a skipped shard fails here.
          [ "$CHECKS" = "success" ] &&
            { [ "$TESTS" = "success" ] || { [ "$DRAFT" = "true" ] && [ "$TESTS" = "skipped" ]; }; } &&
            { [ "$PDF" = "success" ] || [ "$PDF" = "skipped" ]; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (docs-only PRs skip)
        id: changes
        uses: ./.github/actions/changes
        with:
          # The mobile app has its own job (`mobile`): a mobile-only PR skips this one.
          light: '^(docs/|mobile/|.*\.(md|mdx)$)'
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      # A draft runs the fast set only (#262): no shard ran, so there is no coverage to combine.
      # The gate above already passed or failed on the shards' results; here it says why there
      # is nothing to check, instead of failing on missing files (coordinator, 2026-11-10).
      - name: Draft (fast set only)
        if: ${{ needs.backend-tests.result == 'skipped' }}
        run: 'echo "::notice title=backend::skipped: draft (fast set only)"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.changes.outputs.run == 'true' && needs.backend-tests.result == 'success' }}
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true
      - name: Coverage of all shards together (threshold from pyproject.toml)
        if: ${{ steps.changes.outputs.run == 'true' && needs.backend-tests.result == 'success' }}
        working-directory: backend
        run: |
          uv run coverage combine .coverage.shard*
          uv run coverage report --skip-covered --sort=cover
      # Fresh shard weights every night: every shard's file timings in one file, ready to commit
      # as backend/tests/shard_weights.json (`make backend-shard-weights RUN=<this run>`). A
      # test file without a weight counts as a heavy one (90th percentile of its kind), is dealt
      # round-robin across the shards, and every shard's summary names it, so it gets a weight.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ github.event_name == 'schedule' && steps.changes.outputs.run == 'true' }}
        with:
          pattern: backend-timings-*
          path: timings
      - name: Combine the shards' file timings
        if: ${{ github.event_name == 'schedule' && steps.changes.outputs.run == 'true' }}
        run: jq -s 'add | to_entries | sort_by(.key) | from_entries' timings/*/timings.json > shard_weights.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'schedule' && steps.changes.outputs.run == 'true' }}
        with:
          name: backend-shard-weights
          path: shard_weights.json
          retention-days: 14

  mobile:
    # The Extravis mobile app (React Native, `mobile/`, #236; ADR-044). It runs only for the app
    # and the shared packages it links (`frontend/packages/`); backend and frontend changes never
    # run it. Not a required check itself: the required `frontend` check fails when this job
    # fails and passes when it is skipped, so no ruleset change is needed.
    name: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only the app and the packages it links)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(mobile/|frontend/packages/|frontend/pnpm-lock\.yaml$|\.github/workflows/ci\.yml$|\.github/actions/)'
          skipped: "skipped: no mobile change"
      - name: The app is here (it lands with #236)
        id: app
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          if [ -f mobile/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice title=mobile::no mobile/ yet"; fi
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run == 'true' && steps.app.outputs.present == 'true' }}
      - name: Install mobile dependencies (lockfile only)
        if: ${{ steps.changes.outputs.run == 'true' && steps.app.outputs.present == 'true' }}
        run: make mobile-install-check
      - name: Lint (ESLint, Prettier check)
        if: ${{ steps.changes.outputs.run == 'true' && steps.app.outputs.present == 'true' }}
        run: make mobile-lint
      - name: Type-check (tsc strict)
        if: ${{ steps.changes.outputs.run == 'true' && steps.app.outputs.present == 'true' }}
        run: make mobile-typecheck
      - name: Test (Jest, jest-expo)
        if: ${{ steps.changes.outputs.run == 'true' && steps.app.outputs.present == 'true' }}
        run: make mobile-test

  frontend:
    name: frontend
    # Waits for `mobile` and carries its result: the one required check for both (see mobile).
    needs: [mobile]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # Lint, types and Vitest take about 15 min now (Vitest alone about 9.5 min, run 42951809015),
    # so 15 cut off the production builds twice on #378; splitting Vitest into shards is the follow-up.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The mobile job passed or was skipped
        env:
          MOBILE: ${{ needs.mobile.result }}
        run: |
          echo "mobile: $MOBILE"
          case "$MOBILE" in success|skipped) ;; *) echo "::error title=mobile::the mobile job $MOBILE"; exit 1 ;; esac
      - name: Changes (docs-only PRs skip)
        id: changes
        uses: ./.github/actions/changes
        with:
          # The mobile app has its own job (`mobile`): a mobile-only PR skips this one.
          light: '^(docs/|mobile/|.*\.(md|mdx)$)'
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - name: Lint (ESLint, Prettier check)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make frontend-lint
      - name: Type-check (tsc strict)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make frontend-typecheck
      - name: Test (Vitest)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make frontend-test
      - name: Production builds (console, portal)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make build

  # Report PDFs (D-100 D8): WeasyPrint and Pango exist only in the worker image, so the PDF tests run
  # inside that image (its `worker-test` target), the real production setup. The sharded backend
  # tests skip them (no Pango there); here SUPPORTX_REQUIRE_PDF_TESTS=1 makes a skip a failure.
  pdf:
    name: pdf (worker image)
    # Speed mode (D-122): heavy, not a required check. Runs nightly, manually, and on a PR
    # labelled full-ci; never in the merge queue. Skipped here, it takes no runner.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/generated
      - name: Build the worker image with its test tools
        run: docker build -f deploy/images/backend.Dockerfile --target worker-test -t supportx-worker-test:ci .
      - name: PDF tests inside the worker image
        run: docker run --rm supportx-worker-test:ci

  chart:
    # Every PR (WP-014): the Helm chart lints, renders and validates for every profile, and the
    # production render matches the reviewed golden file (deploy/scripts/chart-lint.sh).
    name: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (docs-only PRs skip)
        id: changes
        uses: ./.github/actions/changes
        with:
          # The mobile app has its own job (`mobile`): a mobile-only PR skips this one.
          light: '^(docs/|mobile/|.*\.(md|mdx)$)'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          version: v4.3.1
      - name: Helm chart dependencies (cached by Chart.lock)
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/helm/supportx/charts/*.tgz
          key: helm-chart-deps-${{ hashFiles('deploy/helm/supportx/Chart.lock') }}
      - name: Install kubeconform (pinned, checksum-verified)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Lint, render and validate every profile
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make chart-lint
      # The chart's own tests (tests/test_chart_*.py: D-151's guards, the mobile links), which need
      # the fetched dependencies above and so skip in the backend shards.
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - name: Chart guard tests
        if: ${{ steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: uv run pytest tests/test_chart_*.py --no-cov -p no:cacheprovider -q

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (docs-only PRs skip)
        id: changes
        uses: ./.github/actions/changes
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          frontend: "true"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: All pre-commit hooks on all files
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make precommit
