# Quality gates (architecture.md §16.2, WP-003). Every step calls the same Makefile target a
# developer runs locally (`make check`, `make build`, `make precommit`), so CI and local cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Real PostgreSQL (same pgvector image as the dev stack) and PgBouncer in transaction mode, so
    # the RLS, migration and tenant-isolation tests run on every PR and can never be skipped.
    # NATS JetStream is started as a step below (service containers cannot pass `-js`).
    # Passwords are throwaway values unique to this run; the containers die with the job.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: supportx_app
          DB_PASSWORD: ci-app-${{ github.run_id }}
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          LISTEN_PORT: "6432"
          DEFAULT_POOL_SIZE: "5"
          # 0 = PgBouncer does NOT track prepared statements (like older or third-party poolers),
          # which proves our asyncpg settings work without that feature (app/core/database.py).
          MAX_PREPARED_STATEMENTS: "0"
        ports: ["6432:6432"]
      # Rate limiting (WP-008) runs against real Valkey; no password on this throwaway container.
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      SUPPORTX_TEST_ADMIN_URL: postgresql://postgres:ci-admin-${{ github.run_id }}@127.0.0.1:5432/postgres
      SUPPORTX_TEST_APP_PASSWORD: ci-app-${{ github.run_id }}
      SUPPORTX_TEST_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}
      SUPPORTX_TEST_RELAY_PASSWORD: ci-relay-${{ github.run_id }}
      SUPPORTX_TEST_PGBOUNCER: 127.0.0.1:6432
      SUPPORTX_REQUIRE_DB_TESTS: "1"
      # Outbox relay, consumers, DLQ and latency/throughput tests (WP-007) cannot be skipped.
      SUPPORTX_TEST_NATS_URL: nats://127.0.0.1:4222
      SUPPORTX_REQUIRE_NATS_TESTS: "1"
      SUPPORTX_TEST_VALKEY_URL: valkey://127.0.0.1:6379/0
      SUPPORTX_REQUIRE_VALKEY_TESTS: "1"
      # Audit exports (WP-018) on SeaweedFS, the on-prem object store (ADR-012); started below.
      SUPPORTX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      SUPPORTX_REQUIRE_S3_TESTS: "1"
      # Audit log volume test (WP-018, D-075 item 11): 100k entries here, 10M nightly
      # (audit-scale.yml).
      SUPPORTX_AUDIT_SCALE_ROWS: "100000"
      SUPPORTX_MIGRATION_DATABASE_URL: postgresql://supportx_migrator:ci-migrator-${{ github.run_id }}@127.0.0.1:5432/supportx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the event schema check compares with the target branch
      - name: Start NATS JetStream (same image as the dev stack)
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.15.1-alpine -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && break
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' # fail the job if never up
      - name: Start SeaweedFS (S3 API; same image as the Helm chart)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs:4.48 \
            server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333 && break
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:8333 # fail the job if never up
      - uses: ./.github/actions/setup-backend
      - name: Lint (ruff check, ruff format --check, import-linter, OpenAPI + event schema drift)
        run: make backend-lint
      - name: Event schemas have no breaking change against the target branch
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          base_file="$RUNNER_TEMP/event-schemas.base.json"
          if git show "origin/${base_ref}:docs/architecture/event-schemas.json" > "$base_file" 2>/dev/null; then
            make events-check base="$base_file"
          else
            echo "origin/${base_ref} has no event-schemas.json yet: nothing to compare against."
          fi
      - name: OpenAPI has no breaking change against the target branch
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          base_file="$RUNNER_TEMP/openapi.base.json"
          git show "origin/${base_ref}:frontend/packages/api-client/openapi.json" > "$base_file"
          make openapi-diff base="$base_file"
      - name: Type-check (mypy --strict)
        run: make backend-typecheck
      - name: Create roles and database (same code as the test fixtures)
        working-directory: backend
        run: uv run python -m tooling.db_bootstrap --database supportx
      - name: Migrate to head, then check tenant isolation (RLS guard)
        run: make db-migrate db-current db-guard
      - name: Test (pytest incl. database + event bus tests, coverage threshold from pyproject.toml)
        env:
          SUPPORTX_PERF_REPORT: ${{ runner.temp }}/event-perf.json
        run: make backend-test
      - name: Event bus latency and throughput (job summary)
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/event-perf.json" ]; then
            { echo '### Event bus performance'; echo '```json'; cat "$RUNNER_TEMP/event-perf.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/event-perf.json"
          fi
      - name: NATS logs on failure
        if: ${{ failure() }}
        run: docker logs --tail 200 nats

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Lint (ESLint, Prettier check)
        run: make frontend-lint
      - name: Type-check (tsc strict)
        run: make frontend-typecheck
      - name: Test (Vitest)
        run: make frontend-test
      - name: Production builds (console, portal)
        run: make build

  chart:
    # Every PR (WP-014): the Helm chart lints, renders and validates for every profile, and the
    # production render matches the reviewed golden file (deploy/scripts/chart-lint.sh).
    name: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install kubeconform (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Lint, render and validate every profile
        run: make chart-lint

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: All pre-commit hooks on all files
        run: make precommit
