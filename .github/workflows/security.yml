# Security gates (architecture.md §11.4, §16.2; WP-003). Each scan reports every finding and fails
# only on what must block a merge: any leaked secret, or a high/critical vulnerability.
name: Security

on:
  pull_request:
  # The merge queue: each queued group is tested on top of main before it merges.
  merge_group:
  # No run on push to main (D-122): the merge queue tested that exact merge commit.
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC: catches advisories published after a merge (no push run)
  workflow_dispatch:

permissions:
  contents: read

# One group per PR: a new push cancels that PR's outdated run, freeing runners for every lane.
# A queue group gets one group per temporary branch (a re-run replaces the old one); a group the
# queue dropped finishes at once in its first step (.github/actions/changes). Nightly and manual
# runs each get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('queue-{0}', github.event.merge_group.head_ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole history: a secret removed later is still leaked
          persist-credentials: false
      # The gitleaks CLI image (MIT) is used directly: gitleaks-action needs a paid licence for
      # organisation accounts, which would break once the repo moves to an Extravis org (D-015).
      # A PR or queue group scans only its own commits, so a finding on one branch never blocks
      # every other lane's PR. The nightly and manual runs scan every commit of every branch
      # (product owner, 2026-11-03). Known false positives are listed by exact fingerprint in
      # .gitleaksignore (read by gitleaks from the repo root); no rule is ever turned off.
      - name: Choose the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            merge_group) range="$QUEUE_BASE..$QUEUE_HEAD" ;;
            *) range="--all" ;;
          esac
          echo "log-opts=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning: $range"
      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: |
          # safe.directory: the checkout is owned by the runner user, not the container user.
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact --verbose --exit-code 1 --log-opts="$LOG_OPTS"
      # D-128: the repo's own rule must catch a SupportX API key. A made-up key (valid in shape,
      # never issued) goes into a temporary folder; gitleaks has to report it under that rule.
      - name: The SupportX key rule catches a key
        run: |
          sample="$RUNNER_TEMP/leak-sample"
          mkdir -p "$sample"
          chmod 777 "$sample"  # the container's own user writes the report here
          printf 'SUPPORTX_TOKEN=sxk_%s_%s_%s\n' "$(printf '0%.0s' $(seq 26))" \
            "$(printf '1%.0s' $(seq 26))" "$(printf 'a%.0s' $(seq 43))" > "$sample/config.env"
          set +e
          docker run --rm -v "$PWD:/repo" -v "$sample:/sample" "$GITLEAKS_IMAGE" \
            dir /sample/config.env --config /repo/.gitleaks.toml --no-banner --redact \
            --exit-code 1 --report-format json --report-path /sample/report.json
          found=$?
          set -e
          test "$found" -eq 1 || { echo "gitleaks found nothing in the sample key"; exit 1; }
          # Caught by the SupportX rule itself, not by a default rule that happens to match.
          jq -e 'any(.[]; .RuleID == "supportx-api-key")' "$sample/report.json" > /dev/null \
            || { echo "the supportx-api-key rule did not catch the sample key"; exit 1; }

  dependency-audit:
    name: dependency audit (pip-audit, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - name: Backend (pip-audit + severity gate)
        # The token only raises the GitHub advisory API rate limit for severity lookups.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make audit-backend
      - name: Frontend (pnpm audit)
        if: ${{ !cancelled() }}
        run: make audit-frontend
      - name: Licences (frontend, mobile when present; CLAUDE.md §3, ADR-012)
        if: ${{ !cancelled() }}
        run: make licence-check

  trivy:
    name: filesystem scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report all findings
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            fs --scanners vuln,secret,misconfig --ignorefile /repo/.trivyignore.yaml --exit-code 0 /repo
      - name: Fail on high/critical
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            fs --scanners vuln,secret,misconfig --ignorefile /repo/.trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 /repo
