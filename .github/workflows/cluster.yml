# The Kubernetes deployment (WP-014, ADR-025) on a real k3d cluster with the pinned k3s:
#   PRs touching deploy/ (chart, Dockerfiles, k3d, scripts), the Makefile or this workflow:
#   build the images, scan them, install the dev profile and run the smoke test (helm test +
#   every public route through the gateway). Other PRs: each job reports at once, skipped.
#   Nightly and on demand: the same, then every Playwright journey against the cluster.
# Images are built for this runner (amd64) and imported into k3d. Nothing is pushed: the repo is
# public for now and images may only go to a PRIVATE registry (D6, D-038). Signing with cosign
# needs a registry, so it starts with the release pipeline (WP-014c).
name: Cluster

on:
  # Every PR, so its jobs always report (and could become required checks): the first step of
  # each job decides whether this PR touches the deployment; if not, the job finishes at once.
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the changes step reads the PR's file list

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0

jobs:
  images:
    name: images (build, Trivy, SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only deployment changes need this job)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(deploy/|Makefile$|\.github/workflows/cluster\.yml$|\.github/actions/)'
          skipped: "skipped: no deployment change"
      - name: Build backend and web (INTERNAL/DEV images, not pushed)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make images
      - name: Sizes
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          {
            echo "### Image sizes (uncompressed, linux/amd64)"
            docker image ls --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |' | grep -E 'supportx-(backend|worker|web)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy - report every finding
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          for image in supportx-backend:dev supportx-worker:dev supportx-web:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
              image --scanners vuln,secret --exit-code 0 "$image"
          done
      - name: Trivy - fail on high/critical with a fix available
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          for image in supportx-backend:dev supportx-worker:dev supportx-web:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
              image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: SBOM (CycloneDX)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          mkdir -p sbom
          for image in supportx-backend supportx-worker supportx-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/sbom:/sbom" "$TRIVY_IMAGE" \
              image --format cyclonedx --output "/sbom/$image.cdx.json" "$image:dev"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  smoke:
    name: k3d install and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only deployment changes need this job)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(deploy/|Makefile$|\.github/workflows/cluster\.yml$|\.github/actions/)'
          skipped: "skipped: no deployment change"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: ${{ steps.changes.outputs.run != 'false' }}
        with:
          version: v4.3.1
      - &install-k3d
        if: ${{ steps.changes.outputs.run != 'false' }}
        name: Install k3d (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          # Browsers resolve *.localhost themselves; tools on the runner get it from /etc/hosts.
          echo "127.0.0.1 supportx.localhost" | sudo tee -a /etc/hosts
      - &cluster-up
        if: ${{ steps.changes.outputs.run != 'false' }}
        name: Cluster (k3s v1.36.5) and prerequisites (CloudNativePG)
        run: make cluster-up
      - &deploy
        if: ${{ steps.changes.outputs.run != 'false' }}
        name: Build, import and install the dev profile; helm test
        run: make deploy-dev
      - name: Public routes through the gateway
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: |
          base=http://supportx.localhost:8080
          for path in /api/v1/ready / /portal/ /auth/realms/supportx/.well-known/openid-configuration; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          curl -fsS "$base/api/v1/ready"
      - &diagnostics
        name: Diagnostics on failure
        if: ${{ failure() && steps.changes.outputs.run != 'false' }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n supportx describe pods | tail -n 200 || true
          for d in api relay consumers fanout keycloak centrifugo web; do
            echo "== $d"; kubectl -n supportx logs "deploy/supportx-$d" --all-containers --tail=100 || true
          done
          kubectl -n supportx logs -l app.kubernetes.io/component=migrate --tail=100 || true
          kubectl -n supportx get events --sort-by=.lastTimestamp | tail -n 50 || true

  e2e:
    name: Playwright on k3d (nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - *install-k3d
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - *cluster-up
      - *deploy
      - name: Playwright journeys against the cluster
        # Nightly: timing expectations at their real targets (frontend/e2e/stack.ts timingLimit).
        env:
          SUPPORTX_PERF_STRICT: "1"
        run: |
          (cd frontend && pnpm --filter @supportx/e2e exec playwright install --with-deps chromium)
          make cluster-e2e
      - *diagnostics
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-k3d
          path: frontend/e2e/playwright-report
          retention-days: 7
