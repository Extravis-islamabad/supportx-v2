# The Kubernetes deployment (WP-014, ADR-025) on a real k3d cluster with the pinned k3s:
#   PRs touching deploy/ (chart, Dockerfiles, k3d, scripts), the Makefile or this workflow:
#   build the images, scan them, install the dev profile and run the smoke test (helm test +
#   every public route through the gateway). Other PRs: each job reports at once, skipped.
#   Nightly and on demand: the same, then every Playwright journey against the cluster.
# Images are built for this runner (amd64) and imported into k3d. Nothing is pushed: the repo is
# public for now and images may only go to a PRIVATE registry (D6, D-038). Signing with cosign
# needs a registry, so it starts with the release pipeline (WP-014c).
name: Cluster

on:
  # Every PR, so its jobs always report (and could become required checks): the first step of
  # each job decides whether this PR touches the deployment; if not, the job finishes at once.
  # labeled: adding the full-ci label runs the heavy jobs on this PR (speed mode, D-122).
  pull_request:
    # ready_for_review: a draft runs only the fast set (below); marking it ready runs everything.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the changes step reads the PR's file list

# One group per PR: a new push cancels that PR's outdated run, freeing runners for every lane.
# A queue group gets one group per temporary branch (a re-run replaces the old one); a group the
# queue dropped finishes at once in its first step (.github/actions/changes). Nightly and manual
# runs each get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('queue-{0}', github.event.merge_group.head_ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  FORCE_COLOR: "1"
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0

jobs:
  images:
    name: images (build, Trivy, SBOM)
    # Speed mode (D-122): heavy, not a required check. Runs nightly, manually, and on a PR
    # labelled full-ci; never in the merge queue. Skipped here, it takes no runner.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only deployment changes need this job)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(deploy/|Makefile$|\.github/workflows/cluster\.yml$|\.github/actions/)'
          skipped: "skipped: no deployment change"
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          frontend: "true"
      - name: Build backend and web (INTERNAL/DEV images, not pushed)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make images
      - name: Sizes
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          {
            echo "### Image sizes (uncompressed, linux/amd64)"
            docker image ls --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |' | grep -E 'supportx-(backend|worker|web)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy - report every finding
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          for image in supportx-backend:dev supportx-worker:dev supportx-web:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
              image --scanners vuln,secret --exit-code 0 "$image"
          done
      - name: Trivy - fail on high/critical with a fix available
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          for image in supportx-backend:dev supportx-worker:dev supportx-web:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
              image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: SBOM (CycloneDX)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          mkdir -p sbom
          for image in supportx-backend supportx-worker supportx-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/sbom:/sbom" "$TRIVY_IMAGE" \
              image --format cyclonedx --output "/sbom/$image.cdx.json" "$image:dev"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  smoke:
    name: k3d install and smoke test
    # Speed mode (D-122): heavy, not a required check. Runs nightly, manually, and on a PR
    # labelled full-ci; never in the merge queue. Skipped here, it takes no runner.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only deployment changes need this job)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(deploy/|Makefile$|\.github/workflows/cluster\.yml$|\.github/actions/)'
          skipped: "skipped: no deployment change"
      # deploy-dev builds the images, which need the generated files (D-127).
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run != 'false' }}
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run != 'false' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run != 'false' }}
        with:
          frontend: "true"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: ${{ steps.changes.outputs.run != 'false' }}
        with:
          version: v4.3.1
      - name: Helm chart dependencies (cached by Chart.lock)
        if: ${{ steps.changes.outputs.run != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/helm/supportx/charts/*.tgz
          key: helm-chart-deps-${{ hashFiles('deploy/helm/supportx/Chart.lock') }}
      # The images, the cluster and the e2e browsers fill the runner's disk: k3s then evicts
      # pods for low ephemeral storage (Valkey, 2026-11-04). Unused toolchains go first.
      - &free-disk
        name: Free disk space (unused preinstalled toolchains)
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - &install-k3d
        if: ${{ steps.changes.outputs.run != 'false' }}
        name: Install k3d (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          # Browsers resolve *.localhost themselves; tools on the runner get it from /etc/hosts.
          echo "127.0.0.1 supportx.localhost" | sudo tee -a /etc/hosts
      - &cluster-up
        if: ${{ steps.changes.outputs.run != 'false' }}
        name: Cluster (k3s v1.36.5) and prerequisites (CloudNativePG)
        run: make cluster-up
      - &deploy
        if: ${{ steps.changes.outputs.run != 'false' }}
        name: Build, import and install the dev profile; helm test
        run: make deploy-dev
      - name: Public routes through the gateway
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: |
          base=http://supportx.localhost:8080
          for path in /api/v1/ready / /portal/ /auth/realms/supportx/.well-known/openid-configuration; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          curl -fsS "$base/api/v1/ready"
      - &diagnostics
        name: Diagnostics on failure
        if: ${{ failure() && steps.changes.outputs.run != 'false' }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n supportx describe pods | tail -n 200 || true
          for d in api relay consumers fanout keycloak centrifugo web; do
            echo "== $d"; kubectl -n supportx logs "deploy/supportx-$d" --all-containers --tail=100 || true
          done
          kubectl -n supportx logs -l app.kubernetes.io/component=migrate --tail=100 || true
          kubectl -n supportx get events --sort-by=.lastTimestamp | tail -n 50 || true

  ha-smoke:
    # WP-014b, ADR-038: the HA profile (values-ha.yaml with small requests, values-ha-ci.yaml) on a
    # four-node k3d cluster. The Valkey master dies, Sentinel promotes a replica, a signed-in
    # person's session keeps working, and the restarted pod comes back as a replica (one master).
    name: k3d HA smoke (Valkey failover)
    # Not a required check. Runs nightly, manually, and on a PR that touches deployment or
    # Valkey (the changes step below decides; other PRs finish at once), never in the merge
    # queue. Not tied to the full-ci label (coordinator, 2026-11-05): a migration PR needs the
    # core profile and e2e, not the HA cluster.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (only deployment changes need this job)
        id: changes
        uses: ./.github/actions/changes
        with:
          needs: '^(deploy/|Makefile$|\.github/workflows/(ci|cluster)\.yml$|\.github/actions/|backend/app/core/valkey\.py$|backend/tests/ha/)'
          skipped: "skipped: no deployment change"
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run != 'false' }}
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run != 'false' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run != 'false' }}
        with:
          frontend: "true"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: ${{ steps.changes.outputs.run != 'false' }}
        with:
          version: v4.3.1
      - name: Helm chart dependencies (cached by Chart.lock)
        if: ${{ steps.changes.outputs.run != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/helm/supportx/charts/*.tgz
          key: helm-chart-deps-${{ hashFiles('deploy/helm/supportx/Chart.lock') }}
      # Four k3d nodes each hold their own copy of the images: the runner's disk ran out
      # (evictions at "low on resource: ephemeral-storage"). Toolchains this job never uses go.
      - *free-disk
      - *install-k3d
      - name: Four-node cluster (k3s v1.36.5) and prerequisites
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-up-ha
      - name: Build, import and install the HA profile; helm test
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make deploy-ha
      # The preflight again, now with the release in: NATS, PostgreSQL and SeaweedFS's masters and
      # volume servers on distinct nodes, SeaweedFS's replication, and the single-copy workers' fast
      # eviction.
      - name: HA preflight on the installed release (strict)
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-preflight
      - name: Egress allow-list (values-ha-ci turns it on) keeps the outside out
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-egress
      - name: Valkey failover keeps a signed-in session (no split brain)
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-smoke
      # After ha-smoke's failover: the node with the (promoted) Valkey master is stopped; Sentinel
      # promotes again within 60 s and the session keeps writing; the node returns as a replica.
      # It leaves the cluster settled (Sentinel, database, DNS) for the node-loss test below.
      - name: Losing the node with the Valkey master (after a failover) keeps a signed-in session writing
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-valkey-node-loss
      # The worst case on purpose (Cluster run 43148329223): the stopped node holds the Valkey
      # master and a CoreDNS copy, placed so by the test itself, never by chance.
      - name: Losing the node with the Valkey master and a CoreDNS copy keeps a signed-in session writing
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-valkey-node-loss-dns
      - name: Losing the node with PostgreSQL's primary keeps a signed-in session writing
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-node-loss
      # HA SeaweedFS (D-166): the node with the raft leader and a volume server (placed so by the
      # test, never by chance) is stopped; 20 attachments still download intact and 5 new ones
      # upload within 60 s; after the return every volume has its two copies again.
      - name: Losing the node with the SeaweedFS leader and a volume server keeps every attachment
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-objects-node-loss
      # k3s re-applies its packaged coredns.yaml at every start: prove it keeps the two copies and
      # the anti-affinity deploy/k3s/cluster-dns-ha.sh gave it (fails if k3s reset them).
      - name: Cluster DNS keeps two copies on two nodes through a k3s server restart
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-dns-restart
      - name: Restore drill (a backup restored to a chosen moment)
        if: ${{ steps.changes.outputs.run != 'false' }}
        run: make cluster-ha-restore
      - name: Diagnostics on failure
        if: ${{ failure() && steps.changes.outputs.run != 'false' }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n supportx describe pods | tail -n 200 || true
          echo "== cluster DNS"; kubectl -n kube-system get pods -o wide -l k8s-app=kube-dns || true
          # Each sentinel's view. The password stays in the pod (REDISCLI_AUTH from its own env).
          for pod in supportx-valkey-0 supportx-valkey-1 supportx-valkey-2; do
            for q in master replicas; do
              echo "== $pod: SENTINEL $q supportx"
              # shellcheck disable=SC2016 # expanded inside the container
              kubectl -n supportx exec --request-timeout=15s "$pod" -c sentinel -- sh -c \
                'REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -p 26379 --no-auth-warning SENTINEL "$0" supportx' "$q" \
                | paste -sd' ' | sed 's/ name /\nname /g' || true
            done
          done
          for pod in supportx-valkey-0 supportx-valkey-1 supportx-valkey-2; do
            for c in valkey sentinel; do
              echo "== $pod/$c"; kubectl -n supportx logs "$pod" -c "$c" --since=15m || true
            done
          done
          for d in api centrifugo keycloak; do
            echo "== $d"; kubectl -n supportx logs "deploy/supportx-$d" --all-containers --tail=80 || true
          done
          echo "== migrate"; kubectl -n supportx logs -l app.kubernetes.io/component=migrate --tail=150 --prefix || true
          for c in seaweedfs-master seaweedfs-volume seaweedfs-filer; do
            echo "== $c"; kubectl -n supportx logs -l "app.kubernetes.io/component=$c" --tail=60 --prefix || true
          done
          echo "== database"; kubectl -n supportx get clusters.postgresql.cnpg.io -o wide || true
          kubectl -n supportx describe clusters.postgresql.cnpg.io | tail -n 60 || true
          kubectl -n supportx get events --sort-by=.lastTimestamp | tail -n 50 || true

  e2e:
    name: Playwright on k3d (nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ~2 GB Playwright image joins the cluster's images on this disk (k3s evicts pods for
      # low ephemeral storage, 2026-11-04): the unused toolchains go first, as in the smoke jobs.
      - *free-disk
      # The journeys run in the official Playwright image (Chromium and its system libraries baked
      # in), so the job installs nothing with apt: an Ubuntu mirror outage broke the browser
      # install (2026-11-11). Pulled before the cluster starts, so a registry hiccup fails early.
      - name: Playwright image (version checked, pulled, retried)
        uses: ./.github/actions/playwright-in-image
        with:
          part: pull
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Helm chart dependencies (cached by Chart.lock)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/helm/supportx/charts/*.tgz
          key: helm-chart-deps-${{ hashFiles('deploy/helm/supportx/Chart.lock') }}
      - *install-k3d
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/generated
        with:
          frontend: "true"
      - *cluster-up
      - *deploy
      - name: Playwright journeys against the cluster
        # Nightly: timing expectations at their real targets (frontend/e2e/stack.ts timingLimit).
        env:
          SUPPORTX_PERF_STRICT: "1"
        # deploy/k3d/e2e.sh stays the one place that gathers the cluster's addresses and dev
        # secrets; it ends with `pnpm --filter @supportx/e2e exec playwright test "$@"`. A pnpm
        # shim on PATH for this step only turns exactly that call into the Playwright image
        # (.github/actions/playwright-in-image/run.sh), with every SUPPORTX_* variable e2e.sh
        # exported passed by name. Any other pnpm call, or a changed last line, fails loudly
        # instead of running on the host without browsers. The public URL is plain http on
        # supportx.localhost:8080 (values-dev.yaml): no TLS, so no CA to trust. Chromium resolves
        # *.localhost itself, but Node and Python in the container (Keycloak admin API through
        # the gateway) use /etc/hosts, so the name is added there too; the database and the mail
        # catcher are on 127.0.0.1, shared through --network host.
        run: |
          shim="$RUNNER_TEMP/playwright-pnpm-shim"
          mkdir -p "$shim"
          cat > "$shim/pnpm" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -lt 5 || "$1 $2 $3 $4 $5" != "--filter @supportx/e2e exec playwright test" ]]; then
            echo "::error::pnpm shim: expected e2e.sh's 'pnpm --filter @supportx/e2e exec playwright test ...', got 'pnpm $*'" >&2
            exit 1
          fi
          shift 5
          PLAYWRIGHT_ENV_NAMES="$(compgen -e | grep '^SUPPORTX_' || true)"
          PLAYWRIGHT_ADD_HOSTS="supportx.localhost:127.0.0.1"
          export PLAYWRIGHT_ENV_NAMES PLAYWRIGHT_ADD_HOSTS
          exec bash "$GITHUB_WORKSPACE/.github/actions/playwright-in-image/run.sh" test "$@"
          SHIM
          chmod +x "$shim/pnpm"
          PATH="$shim:$PATH" make cluster-e2e
      - *diagnostics
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-k3d
          path: frontend/e2e/playwright-report
          retention-days: 7
