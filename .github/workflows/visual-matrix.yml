# The daily visual review (product owner, 2026-11-04): every console and portal screen in every
# navigation layout, theme, language and width, as JPEG screenshots with automatic visual checks
# recorded as warnings in index.json (frontend/e2e/tests/visual-matrix.spec.ts). The coordinator
# downloads the artifact each evening.
#
# Never a required check, never on PRs: nightly and on demand only. Warnings never fail the job;
# only a crash of the spec turns it red. Six shards, each on its own stack (one sixth of the
# screens), merged into one artifact kept 7 days.
name: Visual matrix

on:
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC, after the stack smoke
  workflow_dispatch:
    inputs:
      screens:
        description: >-
          Only these screens (comma-separated keys from visual-matrix.spec.ts; a trailing *
          matches a prefix, e.g. "incidents,incident,admin-*"). Empty: every screen. A filtered
          run uses one shard, so a template PR shoots only what it migrates (D-147).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  shots:
    name: screens ${{ matrix.shard }}/${{ inputs.screens != '' && 1 || 6 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.screens != '' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    env:
      # The screens step's image, pinned by digest (the multi-arch index of v1.64.1-noble). The
      # "Playwright version" step fails when its tag and @playwright/test differ.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the screenshot step runs in the official Playwright image, which has Chromium and its
      # system libraries baked in: GitHub's runners could not fetch Ubuntu apt packages (runs
      # 43036727839, 43042363216 and 43049547288; azure.archive.ubuntu.com did not resolve and
      # the public archive failed too), so the job installs nothing with apt. Pulled before the
      # stack starts, so a registry hiccup fails in a minute, not after the seeds.
      - name: Playwright image (pulled, retried)
        run: |
          wait_s=15
          for attempt in 1 2 3; do
            docker pull "$PLAYWRIGHT_IMAGE" && exit 0
            if (( attempt < 3 )); then
              echo "::warning::pulling the Playwright image, attempt $attempt of 3 failed; trying again in ${wait_s}s"
              sleep "$wait_s"
              wait_s=$(( wait_s * 2 ))
            fi
          done
          echo "::error::the Playwright image could not be pulled after 3 attempts"
          exit 1
      - name: Generate throwaway .env (with a showcase password for this run only)
        run: |
          make dev-init
          password="$(openssl rand -hex 16)Aa1!"
          sed -i "s/^SHOWCASE_PASSWORD=.*/SHOWCASE_PASSWORD=${password}/" deploy/compose/.env
          echo "::add-mask::$password"
          grep -E '^[A-Z_]+=[0-9a-f]{32}$' deploy/compose/.env | cut -d= -f2 |
            while read -r secret; do echo "::add-mask::$secret"; done
      - name: Start core profile (incl. Keycloak with the supportx realm)
        run: make dev-up
      - uses: ./.github/actions/setup-backend
      - name: Keycloak identity service account
        run: make keycloak-identity
      - uses: ./.github/actions/setup-frontend
      # The image's Playwright must be the one in package.json, so a bump of either can never
      # run a test runner against browsers built for another version.
      - name: Playwright version (frontend/e2e/package.json against the image)
        run: |
          version="$(node -p "require('./frontend/e2e/package.json').devDependencies['@playwright/test']")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::@playwright/test must be an exact version, got '$version'"; exit 1; }
          [[ "$PLAYWRIGHT_IMAGE" =~ /playwright:v([0-9]+\.[0-9]+\.[0-9]+)-[a-z]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::PLAYWRIGHT_IMAGE must be playwright:v<version>-<distro>@sha256:<digest>"; exit 1; }
          if [[ "${BASH_REMATCH[1]}" != "$version" ]]; then
            echo "::error::@playwright/test is $version but the image is v${BASH_REMATCH[1]}; bump both together"
            exit 1
          fi
      - uses: ./.github/actions/generated
        with:
          frontend: "true"
      - name: Configure, migrate and seed (dev tenants and the showcase)
        run: make backend-env db-migrate db-seed showcase-seed
      - name: Start the API, the event workers, the console and the portal
        run: |
          (cd backend && nohup uv run uvicorn app.main:create_app --factory \
            --host 127.0.0.1 --port 8000 --no-access-log > ../api.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.outbox_relay > ../relay.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.consumers > ../consumers.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.realtime_fanout > ../fanout.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/console dev > ../console.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/portal dev > ../portal.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5173/api/v1/ready >/dev/null &&
              curl -fsS http://localhost:5174/api/v1/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:5173/api/v1/ready
          curl -fsS http://localhost:5174/api/v1/ready
      # In the Playwright image, on the host's network: the stack, Keycloak's issuer
      # (http://localhost:28080) and the Vite servers stay on the runner's localhost (GitHub
      # refuses --network host for job containers, so this is a plain `docker run`). The repo is
      # mounted at its own path, so the absolute paths in backend/.venv and the e2e package's
      # REPO resolve unchanged. Node and the browsers are the image's (/ms-playwright); the
      # test runner and node_modules are the host's pnpm install (setup-frontend). The
      # global setup and teardown also run backend tools (`uv run python -m tooling.…`, `make
      # dev-subscription`), which the image lacks: the host's uv and make binaries (same Ubuntu
      # 24.04 glibc) are mounted read-only on /opt/host-tools, and the venv's Python install at
      # its own path, with uv told not to sync (the host already did). The image's Node is
      # newer than .nvmrc's; Playwright transpiles the e2e TypeScript itself.
      - name: Screens (this shard)
        timeout-minutes: 75
        env:
          VISUAL_SCREENS: ${{ inputs.screens }} # through env, never into the script text
          VISUAL_SHARD: ${{ matrix.shard }}/${{ inputs.screens != '' && 1 || 6 }}
        run: |
          SUPPORTX_SHOWCASE_PASSWORD="$(grep '^SHOWCASE_PASSWORD=' deploy/compose/.env | cut -d= -f2-)"
          export SUPPORTX_SHOWCASE_PASSWORD
          export VISUAL_MATRIX=1 VISUAL_OUT="$GITHUB_WORKSPACE/frontend/e2e/visual-matrix"
          export SUPPORTX_CONSOLE_URL=http://localhost:5173 SUPPORTX_PORTAL_URL=http://localhost:5174
          # Only the uv-managed Python install (setup-backend), never a system prefix like /usr.
          python_home="$(dirname "$(dirname "$(readlink -f backend/.venv/bin/python)")")"
          case "$python_home" in
            /|/usr|/usr/local) echo "::error::backend/.venv uses a system Python ($python_home)"; exit 1 ;;
          esac
          home="$RUNNER_TEMP/playwright-home"
          mkdir -p "$home" frontend/e2e/visual-matrix
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/frontend/e2e" \
            -v "$home:$home" -e HOME="$home" \
            -v "$(command -v uv):/opt/host-tools/uv:ro" -v "$(command -v make):/opt/host-tools/make:ro" \
            -v "$python_home:$python_home:ro" \
            -e PATH="/opt/host-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e UV_NO_SYNC=1 -e UV_FROZEN=1 -e UV_CACHE_DIR="$home/uv-cache" -e UV_PYTHON_DOWNLOADS=never \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright -e CI \
            -e SUPPORTX_SHOWCASE_PASSWORD -e VISUAL_MATRIX -e VISUAL_OUT -e VISUAL_SHARD -e VISUAL_SCREENS \
            -e SUPPORTX_CONSOLE_URL -e SUPPORTX_PORTAL_URL \
            "$PLAYWRIGHT_IMAGE" \
            node node_modules/@playwright/test/cli.js test tests/visual-matrix.spec.ts
      - name: Diagnostics on failure
        if: ${{ failure() }}
        run: |
          make dev-ps
          tail -n 120 api.log consumers.log console.log portal.log || true
      - name: Upload this shard's screens
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-shard-${{ matrix.shard }}
          path: frontend/e2e/visual-matrix
          if-no-files-found: ignore
          retention-days: 1
      - name: Tear down
        if: ${{ always() }}
        run: make dev-down

  merge:
    name: one artifact
    needs: shots
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A shard that failed in setup uploads nothing; the next step names it and the last
        # step fails the run, so a download problem is never hidden.
        continue-on-error: true
        with:
          pattern: visual-shard-*
          path: visual-matrix
          merge-multiple: true
      - name: One index.json for the day
        id: index
        env:
          # Through env, never into the script text.
          SHARDS: ${{ inputs.screens != '' && 1 || 6 }}
        run: |
          mkdir -p visual-matrix
          python3 - <<'EOF'
          import glob, json, os
          expected = int(os.environ["SHARDS"])
          shots, skipped, shards, seen = [], set(), [], set()
          for path in sorted(glob.glob("visual-matrix/index-*.json")):
              part = json.load(open(path))
              shards.append(part["shard"])
              seen.add(int(part["shard"].split("/")[0]))
              shots += part["shots"]
              skipped |= set(part["skipped"])
              os.remove(path)
          shots.sort(key=lambda s: s["file"])
          missing = [n for n in range(1, expected + 1) if n not in seen]
          # Additive only (lane C's QA tooling reads this shape): a shard without an index file
          # is named here instead of silently shrinking the day's set.
          notes = [f"no shots from shard {n}/{expected} (setup failed)" for n in missing]
          if not shots:
              notes.append("no shots at all in this run")
          summary = {
              "shards": shards,
              "shots": len(shots),
              "errors": sum(1 for s in shots if s.get("error")),
              "with_warnings": sum(1 for s in shots if s["warnings"]),
              "with_axe": sum(1 for s in shots if s["axe"]),
              "missing_shards": missing,
          }
          json.dump({"summary": summary, "skipped": sorted(skipped), "shots": shots,
                     "notes": notes},
                    open("visual-matrix/index.json", "w"), indent=2)
          print(json.dumps(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Visual matrix\n\n{len(shots)} shots from {len(seen)} of "
                        f"{expected} shards.\n\n")
              for note in notes:
                  out.write(f"- **{note}**\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"missing={' '.join(str(n) for n in missing)}\n")
              out.write(f"shots={len(shots)}\n")
          EOF
          du -sh visual-matrix
      - name: Upload the visual matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-matrix
          path: visual-matrix
          retention-days: 7
      # The partial set is uploaded first (still useful), then the run turns red: a failed or
      # missing shard is never hidden behind a green merge.
      - name: Every shard delivered
        env:
          MISSING: ${{ steps.index.outputs.missing }}
          SHOTS: ${{ steps.index.outputs.shots }}
          SHOTS_RESULT: ${{ needs.shots.result }}
        run: |
          failed=0
          if [[ -n "$MISSING" ]]; then
            for n in $MISSING; do
              echo "::error::no shots from shard $n (setup failed; see the 'screens $n' job)"
            done
            failed=1
          fi
          if [[ "${SHOTS:-0}" == "0" ]]; then
            echo "::error::the merged visual matrix has no shots at all"
            failed=1
          fi
          if [[ "$SHOTS_RESULT" != "success" ]]; then
            echo "::error::screens jobs finished '$SHOTS_RESULT'; see the failed shards above"
            failed=1
          fi
          exit "$failed"
