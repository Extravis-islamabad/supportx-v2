# The daily visual review (product owner, 2026-11-04): every console and portal screen in every
# navigation layout, theme, language and width, as JPEG screenshots with automatic visual checks
# recorded as warnings in index.json (frontend/e2e/tests/visual-matrix.spec.ts). The coordinator
# downloads the artifact each evening.
#
# Never a required check, never on PRs: nightly and on demand only. Warnings never fail the job;
# only a crash of the spec turns it red. Six shards, each on its own stack (one sixth of the
# screens), merged into one artifact kept 7 days.
name: Visual matrix

on:
  schedule:
    - cron: "17 3 * * *" # nightly 03:17 UTC, after the stack smoke
  workflow_dispatch:
    inputs:
      screens:
        description: >-
          Only these screens (comma-separated keys from visual-matrix.spec.ts; a trailing *
          matches a prefix, e.g. "incidents,incident,admin-*"). Empty: every screen. A filtered
          run uses one shard, so a template PR shoots only what it migrates (D-147).
        required: false
        default: ""
      langs:
        description: >-
          Languages to shoot (comma-separated: en, ar, ur). Empty: en and ar. Use "ur" or
          "en,ar,ur" for a PR's Urdu shots.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  shots:
    name: screens ${{ matrix.shard }}/${{ inputs.screens != '' && 1 || 6 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.screens != '' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the screenshot step runs in the official Playwright image, which has Chromium and its
      # system libraries baked in, so the job installs nothing with apt (the image, its digest and
      # the version check against @playwright/test live in the action). Pulled before the stack
      # starts, so a registry hiccup fails in a minute, not after the seeds.
      - name: Playwright image (version checked, pulled, retried)
        uses: ./.github/actions/playwright-in-image
        with:
          part: pull
      - name: Generate throwaway .env (with a showcase password for this run only)
        run: |
          make dev-init
          password="$(openssl rand -hex 16)Aa1!"
          sed -i "s/^SHOWCASE_PASSWORD=.*/SHOWCASE_PASSWORD=${password}/" deploy/compose/.env
          echo "::add-mask::$password"
          grep -E '^[A-Z_]+=[0-9a-f]{32}$' deploy/compose/.env | cut -d= -f2 |
            while read -r secret; do echo "::add-mask::$secret"; done
      - name: Start core profile (incl. Keycloak with the supportx realm)
        run: make dev-up
      - uses: ./.github/actions/setup-backend
      - name: Keycloak identity service account
        run: make keycloak-identity
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/generated
        with:
          frontend: "true"
      - name: Configure, migrate and seed (dev tenants and the showcase)
        run: make backend-env db-migrate db-seed showcase-seed
      - name: Start the API, the event workers, the console and the portal
        run: |
          (cd backend && nohup uv run uvicorn app.main:create_app --factory \
            --host 127.0.0.1 --port 8000 --no-access-log > ../api.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.outbox_relay > ../relay.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.consumers > ../consumers.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.realtime_fanout > ../fanout.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/console dev > ../console.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/portal dev > ../portal.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5173/api/v1/ready >/dev/null &&
              curl -fsS http://localhost:5174/api/v1/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:5173/api/v1/ready
          curl -fsS http://localhost:5174/api/v1/ready
      - name: Screens settings (this shard)
        run: |
          # Masked when the .env was generated; through GITHUB_ENV so the image gets it by name.
          echo "SUPPORTX_SHOWCASE_PASSWORD=$(grep '^SHOWCASE_PASSWORD=' deploy/compose/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          mkdir -p frontend/e2e/visual-matrix
      # In the Playwright image, on the host's network (.github/actions/playwright-in-image/run.sh
      # says what is mounted and why).
      - name: Screens (this shard)
        timeout-minutes: 75
        uses: ./.github/actions/playwright-in-image
        env:
          VISUAL_SCREENS: ${{ inputs.screens }} # through env, never into the script text
          VISUAL_LANGS: ${{ inputs.langs }}
          VISUAL_SHARD: ${{ matrix.shard }}/${{ inputs.screens != '' && 1 || 6 }}
          VISUAL_MATRIX: "1"
          VISUAL_OUT: ${{ github.workspace }}/frontend/e2e/visual-matrix
          SUPPORTX_CONSOLE_URL: http://localhost:5173
          SUPPORTX_PORTAL_URL: http://localhost:5174
        with:
          part: run
          args: |
            test
            tests/visual-matrix.spec.ts
          env: |
            SUPPORTX_SHOWCASE_PASSWORD
            VISUAL_MATRIX
            VISUAL_OUT
            VISUAL_SHARD
            VISUAL_SCREENS
            VISUAL_LANGS
            SUPPORTX_CONSOLE_URL
            SUPPORTX_PORTAL_URL
      - name: Diagnostics on failure
        if: ${{ failure() }}
        run: |
          make dev-ps
          tail -n 120 api.log consumers.log console.log portal.log || true
      - name: Upload this shard's screens
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-shard-${{ matrix.shard }}
          path: frontend/e2e/visual-matrix
          if-no-files-found: ignore
          retention-days: 1
      - name: Tear down
        if: ${{ always() }}
        run: make dev-down

  merge:
    name: one artifact
    needs: shots
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A shard that failed in setup uploads nothing; the next step names it and the last
        # step fails the run, so a download problem is never hidden.
        continue-on-error: true
        with:
          pattern: visual-shard-*
          path: visual-matrix
          merge-multiple: true
      - name: One index.json for the day
        id: index
        env:
          # Through env, never into the script text.
          SHARDS: ${{ inputs.screens != '' && 1 || 6 }}
        run: |
          mkdir -p visual-matrix
          python3 - <<'EOF'
          import glob, json, os
          expected = int(os.environ["SHARDS"])
          shots, skipped, shards, seen = [], set(), [], set()
          for path in sorted(glob.glob("visual-matrix/index-*.json")):
              part = json.load(open(path))
              shards.append(part["shard"])
              seen.add(int(part["shard"].split("/")[0]))
              shots += part["shots"]
              skipped |= set(part["skipped"])
              os.remove(path)
          shots.sort(key=lambda s: s["file"])
          missing = [n for n in range(1, expected + 1) if n not in seen]
          # Additive only (lane C's QA tooling reads this shape): a shard without an index file
          # is named here instead of silently shrinking the day's set.
          notes = [f"no shots from shard {n}/{expected} (setup failed)" for n in missing]
          if not shots:
              notes.append("no shots at all in this run")
          summary = {
              "shards": shards,
              "shots": len(shots),
              "errors": sum(1 for s in shots if s.get("error")),
              "with_warnings": sum(1 for s in shots if s["warnings"]),
              "with_axe": sum(1 for s in shots if s["axe"]),
              "missing_shards": missing,
          }
          json.dump({"summary": summary, "skipped": sorted(skipped), "shots": shots,
                     "notes": notes},
                    open("visual-matrix/index.json", "w"), indent=2)
          print(json.dumps(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Visual matrix\n\n{len(shots)} shots from {len(seen)} of "
                        f"{expected} shards.\n\n")
              for note in notes:
                  out.write(f"- **{note}**\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"missing={' '.join(str(n) for n in missing)}\n")
              out.write(f"shots={len(shots)}\n")
          EOF
          du -sh visual-matrix
      - name: Upload the visual matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-matrix
          path: visual-matrix
          retention-days: 7
      # The partial set is uploaded first (still useful), then the run turns red: a failed or
      # missing shard is never hidden behind a green merge.
      - name: Every shard delivered
        env:
          MISSING: ${{ steps.index.outputs.missing }}
          SHOTS: ${{ steps.index.outputs.shots }}
          SHOTS_RESULT: ${{ needs.shots.result }}
        run: |
          failed=0
          if [[ -n "$MISSING" ]]; then
            for n in $MISSING; do
              echo "::error::no shots from shard $n (setup failed; see the 'screens $n' job)"
            done
            failed=1
          fi
          if [[ "${SHOTS:-0}" == "0" ]]; then
            echo "::error::the merged visual matrix has no shots at all"
            failed=1
          fi
          if [[ "$SHOTS_RESULT" != "success" ]]; then
            echo "::error::screens jobs finished '$SHOTS_RESULT'; see the failed shards above"
            failed=1
          fi
          exit "$failed"
