# Starts the local dev stack (core profile, which includes Keycloak) exactly as a developer does,
# then proves it end to end: `make dev-check`, migrations + RLS guard, the backend integration
# tests against the real Keycloak/Valkey/PgBouncer, and the Playwright journeys (login, shell,
# users, profile conflicts, read-only mode, axe accessibility) in a real browser (WP-002/006/010). The .env is generated per run by `make dev-init` with throwaway random
# secrets; nothing secret is stored in the repo or in GitHub.
# The `smoke` job runs only the `@smoke` journeys (~5 min), nightly and on a manual run with
# suite=smoke; it is not a required check.
name: Stack smoke

on:
  # Every PR: this job is a required check, and a check that never reports blocks the merge.
  # Its first step decides whether the stack is needed (docs-only changes are not).
  # labeled: adding the full-ci label runs the heavy jobs on this PR (speed mode, D-122).
  pull_request:
    # ready_for_review: a draft runs only the fast set (below); marking it ready runs everything.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: "41 2 * * *" # nightly 02:41 UTC: catches upstream image or registry breakage
  workflow_dispatch:
    inputs:
      suite:
        description: "full: the three e2e shards (core); smoke: only the @smoke journeys (~5 min)"
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read
  pull-requests: read # the changes step reads the PR's file list

# One group per PR: a new push cancels that PR's outdated run, freeing runners for every lane.
# A queue group gets one group per temporary branch (a re-run replaces the old one); a group the
# queue dropped finishes at once in its first step (.github/actions/changes). Nightly and manual
# runs each get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('queue-{0}', github.event.merge_group.head_ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  core:
    name: core profile, integration and e2e ${{ matrix.shard }}/3
    # Speed mode (D-122): heavy, not a required check. Runs nightly, manually, and on a PR
    # labelled full-ci; never in the merge queue. Skipped here, it takes no runner.
    # A manual run with suite=smoke runs only the smoke job below.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'smoke') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    # The Playwright suite outgrew one job: 85 journeys took ~45 min even when green, so the job hit
    # its limit before any error or report was printed. Three shards, each on its own stack (the
    # suite shares one Keycloak and dev DB per stack, so one worker per shard as before), balanced
    # by measured time (frontend/e2e/shards.ts; Playwright's own --shard splits by count, which
    # left one shard at 35 min and another at 10). The Playwright step has its own limit, so a
    # stuck run still prints diagnostics and uploads its report; the job's 60 min is only the
    # backstop.
    timeout-minutes: 60
    env:
      # The e2e journeys check the AI features against the fake's own answers (QA6-AI-01: off by
      # default, so a real installation without a model never shows them).
      SUPPORTX_AI_FAKE_ECHO: "true"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changes (docs-only PRs skip the stack)
        id: changes
        uses: ./.github/actions/changes
      # The journeys run in the official Playwright image (Chromium and its system libraries baked
      # in), so the job installs nothing with apt: an Ubuntu mirror outage broke the browser
      # install (2026-11-11). Pulled before the stack starts, so a registry hiccup fails early.
      - name: Playwright image (version checked, pulled, retried)
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: ./.github/actions/playwright-in-image
        with:
          part: pull
      - name: Generate throwaway .env
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          make dev-init
          # Mask every generated secret so it can never appear in the job log.
          grep -E '^[A-Z_]+=[0-9a-f]{32}$' deploy/compose/.env | cut -d= -f2 |
            while read -r secret; do echo "::add-mask::$secret"; done
      - name: Start core profile (incl. Keycloak with the supportx realm)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make dev-up
      - name: dev-check
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make dev-check
      # The files journey scans with the real ClamAV (D-082 D9). Signatures are cached for a week:
      # downloading ~300 MB on every run would hit ClamAV's mirror rate limits.
      - name: ClamAV signature cache key (ISO week)
        if: ${{ steps.changes.outputs.run == 'true' }}
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          path: ~/clamav-db
          key: clamav-db-${{ steps.week.outputs.week }}
          restore-keys: clamav-db-
      - name: Start ClamAV (real scanner for the files journey)
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          mkdir -p ~/clamav-db && chmod 777 ~/clamav-db
          docker run -d --name clamav -p 127.0.0.1:23310:3310 -v ~/clamav-db:/var/lib/clamav \
            -e CLAMD_CONF_StreamMaxLength=101M clamav/clamav:1.5.4-debian
          for _ in $(seq 1 120); do
            docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec clamav clamdcheck.sh
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.changes.outputs.run == 'true' }}
      # The service account SupportX manages SSO and sessions with (WP-039, ADR-036); needs uv.
      - name: Keycloak identity service account
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make keycloak-identity
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.changes.outputs.run == 'true' }}
      - uses: ./.github/actions/generated
        if: ${{ steps.changes.outputs.run == 'true' }}
        with:
          frontend: "true"
      - name: Configure, migrate and seed the dev database; RLS guard
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: make backend-env db-migrate db-seed db-guard
      - name: Backend integration tests (real Keycloak, Valkey, PgBouncer)
        # Once per run, not per shard: they don't depend on the Playwright split.
        if: ${{ steps.changes.outputs.run == 'true' && matrix.shard == 1 }}
        working-directory: backend
        run: uv run pytest -m integration --no-cov -q
      - name: Start the API, the event workers and the console
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: |
          (cd backend && nohup uv run uvicorn app.main:create_app --factory \
            --host 127.0.0.1 --port 8000 --no-access-log > ../api.log 2>&1 &)
          # Plan changes (read-only journey) reach the API's entitlement cache through the
          # outbox relay and the consumer worker (WP-009).
          (cd backend && nohup uv run python -m workers.outbox_relay > ../relay.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.consumers > ../consumers.log 2>&1 &)
          # Live screens (WP-011): domain events → Centrifugo through the fan-out worker.
          (cd backend && nohup uv run python -m workers.realtime_fanout > ../fanout.log 2>&1 &)
          # Custom field indexes on request (D-088): the index worker, as the migrator role.
          (cd backend && nohup uv run python -m workers.custom_field_indexes > ../indexes.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/console dev > ../console.log 2>&1 &)
          # The portal (WP-012: requesters' announcements and banners) on its own port.
          (cd frontend && nohup pnpm --filter @supportx/portal dev > ../portal.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5173/api/v1/ready >/dev/null &&
              curl -fsS http://localhost:5174/api/v1/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:5173/api/v1/ready
          curl -fsS http://localhost:5174/api/v1/ready
      - name: This shard's spec files
        if: ${{ steps.changes.outputs.run == 'true' }}
        id: specs
        working-directory: frontend
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # The same split in every shard (shard-weights.json). Paths are relative to
          # frontend/e2e (tests/…), where the image runs Playwright.
          mapfile -t specs < <(node e2e/shards.ts "$SHARD/3")
          echo "Shard $SHARD/3: ${specs[*]}"
          (( ${#specs[@]} > 0 )) || { echo "::error::shard $SHARD/3 has no spec files"; exit 1; }
          {
            echo "args<<SPECS_EOF"
            echo test
            printf '%s\n' "${specs[@]}"
            echo "SPECS_EOF"
          } >> "$GITHUB_OUTPUT"
      # In the Playwright image, on the host's network (.github/actions/playwright-in-image/run.sh
      # says what is mounted and why). The report (frontend/e2e/playwright-report) and the UI
      # screenshots (frontend/e2e/ui-screens) land in the mounted workspace for the uploads below.
      - name: Playwright (console and portal journeys, accessibility, in Chromium)
        if: ${{ steps.changes.outputs.run == 'true' }}
        timeout-minutes: 40
        uses: ./.github/actions/playwright-in-image
        env:
          E2E_GLOBAL_TIMEOUT_MINUTES: "35" # Playwright stops itself first, printing every failure
        with:
          part: run
          args: ${{ steps.specs.outputs.args }}
          # CI (passed by the action), the run limit, and the job's SUPPORTX_AI_FAKE_ECHO for the
          # backend tools the global setup runs. The URLs are the e2e package's defaults.
          env: |
            E2E_GLOBAL_TIMEOUT_MINUTES
            SUPPORTX_AI_FAKE_ECHO
      - name: Diagnostics on failure
        if: ${{ failure() && steps.changes.outputs.run == 'true' }}
        run: |
          make dev-ps
          tail -n 200 api.log relay.log consumers.log fanout.log indexes.log console.log portal.log || true
          # Warnings and errors from the whole run (the tails above only show its end).
          grep -hE '\[(warning|error) ' api.log consumers.log relay.log | tail -n 100 || true
          docker compose --project-directory deploy/compose -f deploy/compose/docker-compose.yml \
            --profile full logs --no-color --tail=200 keycloak postgres pgbouncer centrifugo
          docker logs --tail=100 clamav || true
      - name: Upload Playwright report
        if: ${{ failure() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/e2e/playwright-report
          retention-days: 7
      - name: Upload UI screenshots
        # UI pass 2's views (e2e/tests/ui-pass-2.spec.ts): the PR's before and after images.
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screens-${{ matrix.shard }}
          path: frontend/e2e/ui-screens
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        run: |
          make dev-down
          docker rm -f clamav || true

  smoke:
    name: e2e smoke (@smoke journeys)
    # One journey per critical area (tests titled `@smoke`, frontend/e2e/README.md), ~5 min of
    # tests: a quick nightly signal and a cheap manual run (suite=smoke) after a risky merge.
    # Not a required check and never on pull_request or merge_group (guarded by
    # backend/tests/test_ci_triggers.py). The stack starts exactly as in core above: keep the
    # two in step (actionlint 1.7.7 refuses YAML aliases, so the steps are repeated).
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPPORTX_AI_FAKE_ECHO: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Playwright image (version checked, pulled, retried)
        uses: ./.github/actions/playwright-in-image
        with:
          part: pull
      - name: Generate throwaway .env
        run: |
          make dev-init
          # Mask every generated secret so it can never appear in the job log.
          grep -E '^[A-Z_]+=[0-9a-f]{32}$' deploy/compose/.env | cut -d= -f2 |
            while read -r secret; do echo "::add-mask::$secret"; done
      - name: Start core profile (incl. Keycloak with the supportx realm)
        run: make dev-up
      - name: dev-check
        run: make dev-check
      # The files journey scans with the real ClamAV (D-082 D9); the same weekly cache as core.
      - name: ClamAV signature cache key (ISO week)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/clamav-db
          key: clamav-db-${{ steps.week.outputs.week }}
          restore-keys: clamav-db-
      - name: Start ClamAV (real scanner for the files journey)
        run: |
          mkdir -p ~/clamav-db && chmod 777 ~/clamav-db
          docker run -d --name clamav -p 127.0.0.1:23310:3310 -v ~/clamav-db:/var/lib/clamav \
            -e CLAMD_CONF_StreamMaxLength=101M clamav/clamav:1.5.4-debian
          for _ in $(seq 1 120); do
            docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec clamav clamdcheck.sh
      - uses: ./.github/actions/setup-backend
      - name: Keycloak identity service account
        run: make keycloak-identity
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/generated
        with:
          frontend: "true"
      - name: Configure, migrate and seed the dev database; RLS guard
        run: make backend-env db-migrate db-seed db-guard
      - name: Start the API, the event workers and the console
        run: |
          (cd backend && nohup uv run uvicorn app.main:create_app --factory \
            --host 127.0.0.1 --port 8000 --no-access-log > ../api.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.outbox_relay > ../relay.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.consumers > ../consumers.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.realtime_fanout > ../fanout.log 2>&1 &)
          (cd backend && nohup uv run python -m workers.custom_field_indexes > ../indexes.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/console dev > ../console.log 2>&1 &)
          (cd frontend && nohup pnpm --filter @supportx/portal dev > ../portal.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5173/api/v1/ready >/dev/null &&
              curl -fsS http://localhost:5174/api/v1/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:5173/api/v1/ready
          curl -fsS http://localhost:5174/api/v1/ready
      # The same command as `make e2e-smoke`, in the pinned image. The JSON report feeds the job
      # summary; it is written beside playwright-report/, which the HTML reporter empties first.
      - name: Playwright (@smoke journeys, in Chromium)
        timeout-minutes: 12
        uses: ./.github/actions/playwright-in-image
        env:
          E2E_GLOBAL_TIMEOUT_MINUTES: "10" # Playwright stops itself first, printing every failure
          PLAYWRIGHT_JSON_OUTPUT_FILE: smoke-results.json
        with:
          part: run
          args: |
            test
            --grep
            @smoke
            --reporter=list,html,json
          env: |
            E2E_GLOBAL_TIMEOUT_MINUTES
            PLAYWRIGHT_JSON_OUTPUT_FILE
            SUPPORTX_AI_FAKE_ECHO
      - name: Summary (total and per-test time)
        if: ${{ always() }}
        working-directory: frontend/e2e
        run: |
          if [ ! -f smoke-results.json ]; then
            echo "### Smoke: no results (the run did not finish)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            .stats as $s
            | "### Smoke: \(($s.duration / 1000) | floor) s in total",
              "",
              "Passed \($s.expected), failed \($s.unexpected), flaky \($s.flaky), skipped \($s.skipped).",
              "",
              "| Test | Result | Seconds |",
              "|---|---|---|",
              ( [.. | objects | select(has("specs")) | .specs[]] | .[]
                | "| \(.file): \(.title) | \(.tests[0].status) | \(([.tests[0].results[].duration] | add // 0) / 1000 | floor) |" )
          ' smoke-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics on failure
        if: ${{ failure() }}
        run: |
          make dev-ps
          tail -n 200 api.log relay.log consumers.log fanout.log indexes.log console.log portal.log || true
          grep -hE '\[(warning|error) ' api.log consumers.log relay.log | tail -n 100 || true
          docker compose --project-directory deploy/compose -f deploy/compose/docker-compose.yml \
            --profile full logs --no-color --tail=200 keycloak postgres pgbouncer centrifugo
          docker logs --tail=100 clamav || true
      # Always, not only on failure: the report shows each journey's time, so the suite's size
      # stays visible.
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/smoke-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: ${{ always() }}
        run: |
          make dev-down
          docker rm -f clamav || true
