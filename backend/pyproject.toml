[project]
name = "supportx-backend"
version = "0.1.0"
description = "SupportX v2 Core API (modular monolith) and workers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.160.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "nats-py>=2.16.0",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=12",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uuid-utils>=1.1.0",
    "uvicorn>=0.54.0",
    "valkey>=6.2.0",
]

[tool.uv]
# Not an installable distribution yet; tests import from the backend/ root (see pytest pythonpath).
package = false

[dependency-groups]
# PDF exports (D-100 D8): WeasyPrint and its companions, installed ONLY in the worker image and on
# developer machines (`uv sync --group pdf`, needs Pango). Never in the API image.
pdf = ["weasyprint>=66.0"]
dev = [
    # test helper: reads the text back out of generated PDFs (BSD-3, D-012)
    "pypdf>=6.0",
    "asyncpg-stubs>=0.32.0",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.1",
    "types-aioboto3[s3]>=15.5.0",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Strict: every rule family, minus the few that conflict with each other or with the formatter.
select = ["ALL"]
ignore = [
    "COM812", # conflicts with ruff format
    "ISC001", # conflicts with ruff format
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on first line)
    "D100",   # module docstrings: optional, package layout carries the meaning
    "D104",   # package docstrings: empty __init__.py files are intentional
    "CPY001", # copyright headers: not adopted (no licence-header policy yet)
    "D107",   # __init__ docstrings: the class docstring documents construction
    "D401",   # imperative mood: descriptive summaries ("Current time, UTC.") read better
    "N818",   # API error classes are named for the HTTP outcome (NotFound, Conflict), WP-004 spec
]

[tool.ruff.lint.per-file-ignores]
# PLR0913/PLR0917: pytest injects fixtures as arguments, so end-to-end tests naturally take many.
"tests/**" = ["S101", "S105", "S106", "D", "PLR2004", "FBT001", "PLR0913", "PLR0917"]
"**/tests/**" = ["S101", "S105", "S106", "D", "PLR2004", "FBT001", "PLR0913", "PLR0917"]
"conftest.py" = ["D"]
"migrations/versions/*" = ["D", "INP001", "E501"]  # generated-style scripts; long DDL lines read best unwrapped
"migrations/*" = ["INP001"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "workers", "tests", "tooling", "migrations", "conftest.py"]

[[tool.mypy.overrides]]
# import-linter's Contract base class is untyped where we subclass it.
module = ["tooling.import_contracts"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# WeasyPrint (D-100 D8) is in the worker-only `pdf` group and ships no type hints; CI's default
# install does not have it, the worker image job does.
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    # CI shards and file timings (tooling/pytest_shards.py); inert without its variables.
    "-p",
    "tooling.pytest_shards",
    "--cov=app",
    "--cov=tooling",
    "--cov=workers",
    "--cov-report=term-missing",
]
markers = [
    "integration: needs the local dev stack (make dev-up); skipped automatically otherwise",
    "db: needs PostgreSQL (dev stack or CI service); skipped locally if absent, required in CI",
    "nats: needs NATS JetStream (dev stack or CI container); skipped locally if absent, required in CI",
    "valkey: needs Valkey (dev stack or CI service); skipped locally if absent, required in CI",
    "pdf: needs WeasyPrint and Pango (`uv sync --group pdf`; the worker image in CI); skipped if absent, required with SUPPORTX_REQUIRE_PDF_TESTS=1",
    "scale: volume test, runs only with SUPPORTX_AUDIT_SCALE_ROWS (CI 100k, nightly 10M) or SUPPORTX_REPORT_SCALE_ROWS (nightly 1M)",
    "timing: asserts a speed (tooling/timing.py): 10x the target in PRs, the target nightly (perf.yml)",
]

[tool.coverage.run]
# Measure the code under test, not the tests themselves.
omit = ["*/tests/*", "conftest.py"]
# SQLAlchemy's asyncio layer runs I/O in greenlets; without this, code after an await is missed.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Spec (§16.2) puts the threshold on domain and service layers; revisit once modules exist.
fail_under = 90
skip_empty = true

[tool.importlinter]
root_packages = ["app", "workers", "tooling"]
contract_types = ["module_boundaries: tooling.import_contracts.ModuleBoundariesContract"]
# Third-party packages appear in the graph, so the NATS contract below can name `nats`.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modules import only each other's public surface (package root, events)"
type = "module_boundaries"
container = "app.modules"
public_submodules = ["events"]

[[tool.importlinter.contracts]]
name = "Platform layers: main > modules > shared > core"
type = "layers"
layers = ["app.main", "app.modules", "app.shared", "app.core"]

[[tool.importlinter.contracts]]
# CLAUDE.md §4 / architecture.md §6.3: api → service → domain inside a module; infra (tables,
# adapters) sits under service. Every new module adds its own copy (docs/architecture/
# module-template.md); older modules get theirs when they are next touched.
name = "announcements layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.announcements"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "knowledge layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.knowledge"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "work_items layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.work_items"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "audit layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.audit"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "metadata layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.metadata"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "automation layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.automation"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "integrations layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.integrations"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
name = "notifications layers: api > service > infra > domain"
type = "layers"
containers = ["app.modules.notifications"]
layers = ["api", "service", "infra", "domain"]

[[tool.importlinter.contracts]]
# CLAUDE.md rule b / architecture.md §6.5: request code writes events to the outbox and never
# publishes to NATS itself. Only workers/ (relay, consumers) may use the NATS client. The single
# exception is the system module's readiness probes, which open a connection to ping NATS and
# read worker heartbeats (read-only); keep it that way when touching that file.
name = "Only workers talk to NATS; the API writes events to the outbox"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["nats"]
allow_indirect_imports = true
ignore_imports = [
    "app.modules.system.infra.probes -> nats",
]

[[tool.importlinter.contracts]]
# CLAUDE.md rule f / WP-009: nothing outside the licensing module may reach the entitlement
# providers, the licence file reader or the subscription table; everyone goes through the
# entitlement interface (app.modules.licensing). The module-boundary contract already covers other
# modules; this one also covers core, shared, main, workers and tooling.
name = "Only the licensing module touches entitlement providers"
type = "forbidden"
source_modules = ["app", "workers", "tooling"]
forbidden_modules = ["app.modules.licensing.infra"]
allow_indirect_imports = true
ignore_imports = [
    "app.modules.licensing -> app.modules.licensing.infra.**",
    "app.modules.licensing.** -> app.modules.licensing.infra.**",
]
