# Static console (/) and portal (/portal/) for the supportx-web image (WP-014).
# /api, /connection and /emulation never reach this server: the gateway routes them to the API
# and Centrifugo on the same host (D3: one host with paths).
server_tokens off;

map $uri $supportx_cache {
    ~^/(portal/)?assets/  "public, max-age=31536000, immutable";
    default               "no-cache";
}

server {
    listen 8080;
    server_name _;
    # Redirects stay relative: the gateway, not this pod, knows the public host and port.
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same rules as the API's security headers (architecture.md §11.4). Ant Design writes its
    # styles at run time, hence 'unsafe-inline' for styles only; scripts are same-origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS as the API's (backend/app/core/middleware.py), on the HTML and assets too (audit row
    # 15): otherwise the first page of a visit could be stripped to http before any API call
    # sets it. Always on, unlike the API's production-only header: a browser ignores HSTS over
    # plain http, so local http dev (localhost) is unaffected.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control $supportx_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The web app manifest (branding.md) is not in nginx's default mime.types. Only types and
    # try_files here: an add_header in a location would drop the security headers above.
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The mobile app's verified links (ADR-044 item 3), from the chart's mobile values (a
    # ConfigMap mounted here); 404 when the installation names no app. Never the app pages.
    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        log_not_found off;
        alias /etc/nginx/well-known/apple-app-site-association;
    }
    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;
        log_not_found off;
        alias /etc/nginx/well-known/assetlinks.json;
    }

    # Keycloak's admin console and admin API never reach the public host. In Ingress mode the
    # Ingress sends /auth/admin here, its longest prefix, and it ends here (WP-014b). The Gateway
    # redirects it before it gets this far.
    location /auth/admin {
        default_type text/plain;
        return 404 "not found\n";
    }

    # Single-page apps: unknown paths load the app, which shows its own "not found" page. Files
    # only, never `$uri/`: an app route named like a build folder (the console's /assets list
    # beside Vite's /assets/ bundle folder) must load the app, not get nginx's directory
    # redirect and a 403 (nightly asset-loans e2e, 2026-11-11).
    location /portal/ {
        try_files $uri /portal/index.html;
    }
    location = /portal {
        return 301 /portal/;
    }
    location / {
        try_files $uri /index.html;
    }
}
