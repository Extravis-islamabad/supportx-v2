# Static console (/) and portal (/portal/) for the supportx-web image (WP-014).
# /api, /connection and /emulation never reach this server: the gateway routes them to the API
# and Centrifugo on the same host (D3: one host with paths).
server_tokens off;

map $uri $supportx_cache {
    ~^/(portal/)?assets/  "public, max-age=31536000, immutable";
    default               "no-cache";
}

server {
    listen 8080;
    server_name _;
    # Redirects stay relative: the gateway, not this pod, knows the public host and port.
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same rules as the API's security headers (architecture.md §11.4). Ant Design writes its
    # styles at run time, hence 'unsafe-inline' for styles only; scripts are same-origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $supportx_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The web app manifest (branding.md) is not in nginx's default mime.types. Only types and
    # try_files here: an add_header in a location would drop the security headers above.
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Single-page apps: unknown paths load the app, which shows its own "not found" page.
    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }
    location = /portal {
        return 301 /portal/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
