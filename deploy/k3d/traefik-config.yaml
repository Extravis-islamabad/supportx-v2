# k3s's bundled Traefik with the Gateway API provider on (D2). The chart creates its own
# Gateway per release (routing.gateway.create), so Traefik's default Gateway stays off.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    ports:
      # WebSocket and HTTP-streaming connections stay open (realtime, WP-011) on both entry
      # points: HTTPS (websecure) carries every route once routing.tls is on (audit row 5), and
      # Traefik's default would cut a realtime connection after 60 s.
      web:
        transport:
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 3600s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 3600s
