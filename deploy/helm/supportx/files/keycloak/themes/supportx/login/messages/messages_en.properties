# SupportX sign-in texts that differ from Keycloak's (WP-039 session 2, REQ-SEC-005 AC3).
invalidPasswordBlacklistedMessage=This password is too common or has appeared in a data breach. Choose another.
# One text for every failed sign-in, locked or not, known account or not (REQ-SEC-005 AC2,
# D-104): it says when to try again and never whether the account exists or is locked.
invalidUserMessage=Invalid username or password. After several failed attempts, sign-in pauses: wait at least 15 minutes, then try again.
accountTemporarilyDisabledMessage=Invalid username or password. After several failed attempts, sign-in pauses: wait at least 15 minutes, then try again.
accountPermanentlyDisabledMessage=Invalid username or password. After several failed attempts, sign-in pauses: wait at least 15 minutes, then try again.
