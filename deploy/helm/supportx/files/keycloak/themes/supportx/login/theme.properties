# SupportX login theme (docs/architecture/branding.md): Keycloak's own keycloak.v2 pages with the
# SupportX logo, favicon and colours. resources/ is generated by `make brand-assets`.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/supportx.css
darkMode=true
# Where the tenant's sign-in stylesheet comes from (WP-017): the public branding route of the
# SupportX API. Kubernetes serves Keycloak and the API on one host (D-038), so the default path
# works there; Compose points it at the console's dev server, which proxies /api.
supportxBrandingUrl=${env.SUPPORTX_BRANDING_URL:/api/v1/public/branding}
