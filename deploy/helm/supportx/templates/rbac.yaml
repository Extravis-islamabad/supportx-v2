# Service accounts. Only the API and workers read the Kubernetes API, and only to see whether
# this release's migrate Job is done (tooling/wait_for_job.py).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workload
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "rbac") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "rbac") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-read-jobs
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "rbac") | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-workload-read-jobs
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "rbac") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-read-jobs
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-workload
    namespace: {{ .Release.Namespace }}
