{{- $c := dict "root" . "component" "smoke-test" -}}
# `helm test <release>`: the installed release answers on every internal route (WP-014), and
# Valkey enforces authentication (WP-020). Run it with
#   helm test <release> --filter '!name=<release>-valkey-test-auth-existing'
# The upstream Valkey chart's own test pod pings without a password from a pod our
# NetworkPolicy does not admit: the refused connection then counts as "auth enforced", so it
# would pass even with auth off. This pod carries our labels, so it reaches Valkey and tells a
# NOAUTH answer apart from a connection that never happened.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke-test
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- include "supportx.pullSecrets" . | nindent 2 }}
  {{- include "supportx.podSecurityContext" . | nindent 2 }}
  containers:
    - name: smoke
      image: {{ include "supportx.image" (dict "root" . "name" "backend") }}
      imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
      env:
        - name: VALKEY_PASSWORD
          valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: valkey-password}}
      command: ["python", "-c"]
      args:
        - |
          import os, sys, httpx, valkey
          from valkey.exceptions import AuthenticationError, ConnectionError, ResponseError
          from valkey.exceptions import TimeoutError as ValkeyTimeout
          rel = {{ .Release.Name | quote }}
          checks = [
              ("API ready", f"http://{rel}-api:8000/api/v1/ready", 200),
              ("API live", f"http://{rel}-api:8000/api/v1/health", 200),
              ("web", f"http://{rel}-web:8080/healthz", 200),
              ("portal", f"http://{rel}-web:8080/portal/", 200),
              ("realtime", f"http://{rel}-centrifugo:8000/health", 200),
              ("identity", f"http://{rel}-keycloak:8080/auth/realms/supportx/.well-known/openid-configuration", 200),
          ]
          failed = 0
          for name, url, want in checks:
              try:
                  got = httpx.get(url, timeout=10).status_code
              except httpx.HTTPError as exc:
                  got = type(exc).__name__
              ok = got == want
              failed += not ok
              print(f"{'ok  ' if ok else 'FAIL'} {name}: {got}")
          targets = []
          {{- if .Values.valkey.enabled }}
          targets.append(("valkey", f"{rel}-valkey", 6379))
          {{- end }}
          {{- if .Values.valkeyHa.enabled }}
          # HA (ADR-038): a server and a sentinel each refuse without the password. By the name
          # the app uses (<pod>.<headless>.<namespace>.svc): with TLS on, the certificate names
          # it, and a wildcard never covers the one-label "<headless>" suffix.
          pod0 = f"{rel}-valkey-0.{rel}-valkey-headless.{{ .Release.Namespace }}.svc"
          targets.append(("valkey", pod0, 6379))
          targets.append(("sentinel", pod0, 26379))
          {{- end }}
          tls = {}
          {{- if eq (include "supportx.valkeyTls" .) "true" }}
          # TLS only (audit row 5): every check below over TLS, the certificate checked against
          # the internal CA and the pod's name; and a plaintext client gets no answer at all.
          tls = {"ssl": True, "ssl_ca_certs": "/etc/supportx/tls/internal-ca/ca.crt",
                 "ssl_cert_reqs": "required", "ssl_check_hostname": True}
          for label, host, port in targets:
              try:
                  valkey.Valkey(host=host, port=port, socket_timeout=5,
                                password=os.environ["VALKEY_PASSWORD"]).ping()
                  got = "answered in plaintext"
              except (ConnectionError, ValkeyTimeout, ResponseError):
                  got = "refused"
              ok = got == "refused"
              failed += not ok
              print(f"{'ok  ' if ok else 'FAIL'} {label} plaintext: {got}")
          {{- end }}
          for label, host, port in targets:
              # Without a password: it must answer, and answer NOAUTH (an unreachable one fails).
              try:
                  valkey.Valkey(host=host, port=port, socket_timeout=5, **tls).ping()
                  got = "PONG without a password"
              except (AuthenticationError, ResponseError) as exc:
                  got = "NOAUTH" if "auth" in str(exc).lower() else f"error {exc}"
              except ConnectionError as exc:
                  got = f"unreachable ({exc})"
              ok = got == "NOAUTH"
              failed += not ok
              print(f"{'ok  ' if ok else 'FAIL'} {label} auth without password: {got}")
              # With the password: PONG.
              try:
                  pong = valkey.Valkey(
                      host=host, port=port, password=os.environ["VALKEY_PASSWORD"], socket_timeout=5,
                      **tls,
                  ).ping()
                  got = "PONG" if pong else "no PONG"
              except Exception as exc:  # noqa: BLE001 - every failure is a test failure here
                  got = f"{type(exc).__name__}"
              ok = got == "PONG"
              failed += not ok
              print(f"{'ok  ' if ok else 'FAIL'} {label} auth with password: {got}")
          sys.exit(1 if failed else 0)
      {{- include "supportx.containerSecurityContext" . | nindent 6 }}
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
      {{- with include "supportx.internalCaMount" . | trim }}
      volumeMounts:
        {{- . | nindent 8 }}
      {{- end }}
  {{- with include "supportx.internalCaVolume" . | trim }}
  volumes:
    {{- . | nindent 4 }}
  {{- end }}
