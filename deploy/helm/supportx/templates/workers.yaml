{{- /* The workers (ADR-019, ADR-023; index worker D-088): one Deployment each, same image. */ -}}
{{- $workers := list
  (dict "component" "relay" "module" "workers.outbox_relay" "replicas" .Values.relay.replicas "resources" .Values.relay.resources)
  (dict "component" "consumers" "module" "workers.consumers" "replicas" .Values.consumers.replicas "resources" .Values.consumers.resources)
  (dict "component" "fanout" "module" "workers.realtime_fanout" "replicas" 1 "resources" .Values.fanout.resources)
  (dict "component" "indexes" "module" "workers.custom_field_indexes" "replicas" 1 "resources" .Values.indexWorker.resources)
-}}
{{- range $w := $workers }}
{{- $c := dict "root" $ "component" $w.component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supportx.name" $c }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  replicas: {{ $w.replicas }}
  selector:
    matchLabels:
      {{- include "supportx.selector" $c | nindent 6 }}
  strategy:
    # Surge before stopping: the fan-out's single consumer is never absent for long (ADR-023).
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        {{- include "supportx.labels" $c | nindent 8 }}
      annotations:
        {{- include "supportx.configChecksum" $ | nindent 8 }}
        {{- include "supportx.metricsAnnotations" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-workload
      automountServiceAccountToken: true
      {{- include "supportx.pullSecrets" $ | nindent 6 }}
      {{- include "supportx.podSecurityContext" $ | nindent 6 }}
      terminationGracePeriodSeconds: 30
      initContainers:
        {{- include "supportx.waitForMigrate" $ | nindent 8 }}
      containers:
        - name: {{ $w.component }}
          {{- /* Report PDFs are built by the consumers worker: its image has Pango and WeasyPrint. */}}
          {{- $image := ternary "worker" "backend" (eq $w.component "consumers") }}
          image: {{ include "supportx.image" (dict "root" $ "name" $image) }}
          imagePullPolicy: {{ (index $.Values.images $image).pullPolicy }}
          command: ["python", "-m", {{ $w.module | quote }}]
          {{- include "supportx.backendEnvFrom" $ | nindent 10 }}
          env:
            {{- include "supportx.secretEnv" $ | nindent 12 }}
            - name: SUPPORTX_SERVICE_NAME
              value: {{ printf "supportx-%s" $w.component | quote }}
            {{- if eq $w.component "relay" }}
            # The relay reads the outbox as supportx_relay, straight to PostgreSQL (LISTEN/NOTIFY).
            - name: SUPPORTX_SECRET_RELAY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.secrets.app }}, key: relay-db-password}}
            - name: SUPPORTX_RELAY_DATABASE_URL
              value: "postgresql://supportx_relay:$(SUPPORTX_SECRET_RELAY_DB_PASSWORD)@{{ include "supportx.dbHost" $ }}:{{ include "supportx.dbPort" $ }}/{{ $.Values.postgresql.database }}"
            {{- end }}
            {{- if eq $w.component "indexes" }}
            # Builds custom field indexes (D-088): only the table owner may, so this worker alone
            # gets the migrator role, straight to PostgreSQL (CREATE INDEX CONCURRENTLY).
            - name: SUPPORTX_SECRET_MIGRATOR_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.secrets.app }}, key: migrator-db-password}}
            - name: SUPPORTX_MIGRATION_DATABASE_URL
              value: "postgresql://supportx_migrator:$(SUPPORTX_SECRET_MIGRATOR_DB_PASSWORD)@{{ include "supportx.dbHost" $ }}:{{ include "supportx.dbPort" $ }}/{{ $.Values.postgresql.database }}"
            {{- end }}
            {{- if eq $w.component "consumers" }}
            # Signs the audit log's anchors (ADR-027); only this worker holds the key.
            - name: SUPPORTX_AUDIT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.secrets.app }}, key: audit-signing-key}}
            # Decrypts new files to scan them and writes thumbnails (WP-022).
            {{- include "supportx.filesEnv" $ | nindent 12 }}
            {{- end }}
          ports:
            - {name: metrics, containerPort: 9464}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
          {{- include "supportx.containerSecurityContext" $ | nindent 10 }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
