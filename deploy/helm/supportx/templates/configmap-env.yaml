{{- include "supportx.validate" . -}}
# Non-secret SUPPORTX_* settings shared by the API and the workers (app/core/config.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  SUPPORTX_PROFILE: {{ .Values.app.profile | quote }}
  SUPPORTX_LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  # The browser's URLs (D3): console at /, portal at /portal.
  SUPPORTX_CONSOLE_URL: {{ .Values.publicUrl | quote }}
  SUPPORTX_PORTAL_URL: {{ printf "%s/portal" .Values.publicUrl | quote }}
  # The mobile sign-in's verified return link (ADR-044 item 3), the path mobile-links.yaml lists.
  SUPPORTX_MOBILE_REDIRECT_URI: {{ printf "%s%s" .Values.publicUrl .Values.mobile.returnPath | quote }}
  # Keycloak: public issuer for browsers and token checks; the API itself uses the in-cluster
  # address (back channel).
  SUPPORTX_OIDC_ISSUER: {{ printf "%s/auth/realms/supportx" .Values.publicUrl | quote }}
  SUPPORTX_OIDC_INTERNAL_URL: {{ printf "http://%s-keycloak:8080/auth/realms/supportx" .Release.Name | quote }}
  # uvicorn's own setting: whose X-Forwarded-For counts (never "*").
  FORWARDED_ALLOW_IPS: {{ .Values.api.trustedProxies | quote }}
  SUPPORTX_CENTRIFUGO_API_URL: {{ printf "http://%s-centrifugo:8000" .Release.Name | quote }}
  # As many stream copies as NATS servers (a cluster in values-ha.yaml, WP-014b); else one.
  SUPPORTX_EVENTS_STREAM_REPLICAS: {{ ternary .Values.nats.config.cluster.replicas 1 .Values.nats.config.cluster.enabled | toString | quote }}
  {{- if .Values.valkeyHa.enabled }}
  # Valkey through its sentinels (HA, ADR-038); the URL then gives only the password and database.
  {{- $name := include "supportx.name" (dict "root" . "component" "valkey") }}
  {{- $hosts := list }}
  {{- range $i := until (int .Values.valkeyHa.replicas) }}
  {{- $hosts = append $hosts (printf "%s-%d.%s-headless.%s.svc:26379" $name $i $name $.Release.Namespace) }}
  {{- end }}
  SUPPORTX_VALKEY_SENTINELS: {{ join "," $hosts | quote }}
  SUPPORTX_VALKEY_SENTINEL_MASTER: supportx
  {{- end }}
  {{- if eq (include "supportx.valkeyTls" .) "true" }}
  # TLS only (audit row 5): certificates checked against the internal CA and the pod names.
  SUPPORTX_VALKEY_TLS_CA_FILE: /etc/supportx/tls/internal-ca/ca.crt
  {{- end }}
  {{- if eq (include "supportx.dbTls" .) "true" }}
  # PostgreSQL verify-full (audit row 5): the server's (and PgBouncer's) certificate checked.
  SUPPORTX_DATABASE_SSL_ROOT_CERT: /etc/supportx/tls/postgres/ca.crt
  {{- end }}
  {{- if eq (include "supportx.natsTls" .) "true" }}
  # TLS to NATS (audit row 5): tls:// with the internal CA, the service name checked.
  SUPPORTX_NATS_TLS_CA_FILE: /etc/supportx/tls/internal-ca/ca.crt
  {{- end }}
  # /metrics (and the workers' /healthz, /readyz) on the internal port (WP-014).
  SUPPORTX_METRICS_EXPORTER: prometheus
  SUPPORTX_METRICS_HOST: "0.0.0.0"
  SUPPORTX_METRICS_PORT: "9464"
  SUPPORTX_ENTITLEMENT_PROVIDER: {{ .Values.app.entitlementProvider | quote }}
  # Object storage (S3 API, D-016): the release's SeaweedFS or an external S3 (WP-018).
  {{- if eq .Values.objectStorage.mode "seaweedfs" }}
  SUPPORTX_OBJECT_STORAGE_ENDPOINT: {{ printf "http://%s-seaweedfs:8333" .Release.Name | quote }}
  {{- else }}
  SUPPORTX_OBJECT_STORAGE_ENDPOINT: {{ required "objectStorage.external.endpoint is required" .Values.objectStorage.external.endpoint | quote }}
  {{- end }}
  SUPPORTX_OBJECT_STORAGE_BUCKET: {{ .Values.objectStorage.bucket | quote }}
  SUPPORTX_OBJECT_STORAGE_REGION: {{ .Values.objectStorage.region | quote }}
  SUPPORTX_AUDIT_TRUSTED_KEYS: {{ .Values.audit.trustedKeys | quote }}
  # Files (WP-022): the release's clamd, and whether files wait for it.
  SUPPORTX_FILES_SCAN_REQUIRED: {{ .Values.files.scanRequired | quote }}
  {{- if .Values.clamav.enabled }}
  SUPPORTX_FILES_CLAMD_ADDRESS: {{ printf "%s-clamav:3310" .Release.Name | quote }}
  {{- end }}
  # Without a model, the fake answers only what it has recorded; tests turn its echo on
  # (QA6-AI-01). Never on in a real installation.
  SUPPORTX_AI_FAKE_ECHO: {{ .Values.ai.fakeEcho | quote }}
  {{- if .Values.ai.local.enabled }}
  # Local AI (WP-037): the release's model servers; chat on the GPU node when there is one.
  SUPPORTX_AI_PROVIDER: openai_compatible
  {{- if .Values.ai.gpu.enabled }}
  SUPPORTX_AI_BASE_URL: {{ printf "http://%s-llm-gpu:8000/v1" .Release.Name | quote }}
  SUPPORTX_AI_MODEL: {{ .Values.ai.gpu.model.name | quote }}
  {{- else }}
  SUPPORTX_AI_BASE_URL: {{ printf "http://%s-llm-cpu:8080/v1" .Release.Name | quote }}
  SUPPORTX_AI_MODEL: {{ .Values.ai.local.chat.name | quote }}
  {{- end }}
  SUPPORTX_AI_EMBEDDING_BASE_URL: {{ printf "http://%s-llm-embed:8080/v1" .Release.Name | quote }}
  SUPPORTX_AI_EMBEDDING_MODEL: {{ .Values.ai.local.embeddings.name | quote }}
  {{- end }}
  {{- if eq .Values.app.entitlementProvider "licence_file" }}
  SUPPORTX_LICENCE_FILE: /etc/supportx/licence/licence.json
  {{- end }}
  {{- if include "supportx.temporalAddress" . }}
  # SLA clocks on Temporal (WP-025, ADR-037); unset, the SLA safety net fires everything.
  SUPPORTX_TEMPORAL_ADDRESS: {{ include "supportx.temporalAddress" . | quote }}
  SUPPORTX_TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  SUPPORTX_TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
  SUPPORTX_TEMPORAL_WORKFLOW_TASK_QUEUE: {{ .Values.temporal.workflowTaskQueue | quote }}
  {{- end }}
  {{- range $name, $value := .Values.app.extraEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
