{{- /*
HA Valkey (WP-014b, ADR-038): a StatefulSet of Valkey servers, each with a Sentinel beside it, on
the official image. At start each pod asks the sentinels for the current master and replicates
from it unless it is that master. A pod starts as master only when every peer answered and
none holds data (a fresh set); otherwise it waits and says why, never starting empty. So a restarted former master always rejoins as a replica. The app and
Centrifugo find the master through the sentinels (SUPPORTX_VALKEY_SENTINELS). Passwords come
from the installation secret only, written to files in memory, never on a command line.
*/ -}}
{{- if .Values.valkeyHa.enabled }}
{{- $c := dict "root" . "component" "valkey" }}
{{- $name := include "supportx.name" $c }}
{{- $headless := printf "%s-headless" $name }}
{{- $ha := .Values.valkeyHa }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-scripts
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
data:
  common.sh: |
    # The current master's host, asked of the sentinels; empty when none answers.
    SELF="${HOSTNAME}.{{ $headless }}.{{ .Release.Namespace }}.svc"
    ask_sentinels() {
      for i in $(seq 0 $(({{ $ha.replicas }} - 1))); do
        peer="{{ $name }}-$i.{{ $headless }}.{{ .Release.Namespace }}.svc"
        found=$(REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$peer" -p 26379 \
          --no-auth-warning SENTINEL get-master-addr-by-name supportx 2>/dev/null | head -n 1)
        if [ -n "$found" ]; then echo "$found"; return 0; fi
      done
      return 0
    }
  valkey.sh: |
    set -eu
    . /scripts/common.sh
    # There is no persistence: every server starts empty. A pod that would start as master must
    # therefore know the set holds no data, or the replicas would copy its empty set (data loss,
    # valkey failover job 2026-11-09). It starts as master only on positive evidence:
    #   - fresh: every peer's server answered, holds no key, never replicated (offset 0) and is
    #     not in the middle of a sync;
    #   - otherwise it waits, logging why each time, and never starts empty: while a peer holds
    #     data it asks the sentinels to hand over to that peer; while a peer does not answer,
    #     it cannot tell a fresh set from one holding data, so it asks again.
    # Pods other than 0 never become master by default, so they start at once as replicas; their
    # servers then answer pod 0 (offset 0 on a fresh install), so a first start never deadlocks.
    # Why it waits is also in $WAITING, which the readiness probe prints (kubectl describe).
    WAITING=/run/valkey/waiting
    waiting() {
      echo "valkey: waiting: $1" >&2
      echo "$1" > "$WAITING"
    }
    # "data", "fresh", or "unknown: <peers>": what this pod's peers hold. The replication offset
    # alone is no proof of an empty peer: in Valkey's dual-channel sync a replica can hold the
    # data (and be counted by WAIT) while it still reports offset 0 with its link down (seen
    # 2026-11-09). So a peer holds data when it has any key or a non-zero offset; a peer still
    # syncing or loading is unknown; only a peer that answers with neither is empty.
    set_state() {
      silent=""
      for i in $(seq 0 $(({{ $ha.replicas }} - 1))); do
        peer="{{ $name }}-$i.{{ $headless }}.{{ .Release.Namespace }}.svc"
        [ "$peer" = "$SELF" ] && continue
        info=$(REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$peer" -p 6379 --no-auth-warning \
          info all 2>/dev/null | tr -d '\r')
        keys=$(REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$peer" -p 6379 --no-auth-warning \
          dbsize 2>/dev/null | tr -d '\r')
        offset=$(echo "$info" | sed -n 's/^master_repl_offset://p')
        syncing=$(echo "$info" | sed -n 's/^master_sync_in_progress://p')
        loading=$(echo "$info" | sed -n 's/^loading://p')
        case "$offset:$keys" in
          *[!0-9:]*|:*|*:) silent="$silent ${peer%%.*}"; continue ;;  # no answer
        esac
        if [ "$keys" -gt 0 ] || [ "$offset" -gt 0 ]; then echo data; return 0; fi
        if [ "${syncing:-0}" != 0 ] || [ "${loading:-0}" != 0 ]; then
          silent="$silent ${peer%%.*}(syncing)"
        fi
      done
      if [ -z "$silent" ]; then echo fresh; else echo "unknown:$silent"; fi
    }
    hand_over() {
      for i in $(seq 0 $(({{ $ha.replicas }} - 1))); do
        peer="{{ $name }}-$i.{{ $headless }}.{{ .Release.Namespace }}.svc"
        [ "$peer" = "$SELF" ] && continue
        REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -h "$peer" -p 26379 --no-auth-warning \
          SENTINEL FAILOVER supportx >/dev/null 2>&1 && return 0
      done
      return 0
    }
    pod0="{{ $name }}-0.{{ $headless }}.{{ .Release.Namespace }}.svc"
    tries=0
    while :; do
      master=$(ask_sentinels)
      if [ -n "$master" ] && [ "$master" != "$SELF" ]; then
        break  # replicate the master the sentinels name
      fi
      if [ -z "$master" ] && [ "$SELF" != "$pod0" ]; then
        master="$pod0"  # never master by default: replicating loses nothing
        break
      fi
      # Here this pod would start as master: the sentinels name it, or none answers and it is pod 0.
      state=$(set_state)
      tries=$((tries + 1))
      case "$state" in
        fresh)
          echo "valkey: every peer answered and none holds data (a fresh set); starting as master"
          master="$SELF"
          break
          ;;
        data)
          if [ "$master" = "$SELF" ]; then
            # Back before the sentinels noticed it was gone (inside down-after-milliseconds).
            # A NOGOODSLAVE answer can be momentary, so it is asked again each time.
            hand_over
            waiting "the sentinels still name this pod master but a peer holds the data; asked them to hand over (try $tries)"
          else
            waiting "a peer holds data but no sentinel names a master yet (try $tries)"
          fi
          ;;
        *)
          waiting "peers not answering or still syncing:${state#unknown:}; cannot tell a fresh set from one holding data (try $tries)"
          ;;
      esac
      sleep 2
    done
    rm -f "$WAITING"
    {
      echo "port 6379"
      echo "requirepass $VALKEY_PASSWORD"
      echo "masterauth $VALKEY_PASSWORD"
      echo "replica-announce-ip $SELF"
      echo "maxmemory {{ $ha.maxmemory }}"
      echo "maxmemory-policy noeviction"
      echo "appendonly no"
      if [ "$master" != "$SELF" ]; then echo "replicaof $master 6379"; fi
    } > /run/valkey/valkey.conf
    echo "valkey: starting as $([ "$master" = "$SELF" ] && echo master || echo "replica of $master")"
    exec valkey-server /run/valkey/valkey.conf
  sentinel.sh: |
    set -eu
    . /scripts/common.sh
    # Wait for this pod's own server, then monitor the master it knows (or the sentinels know).
    # As long as it takes: a server that waits to start (valkey.sh) must not leave its sentinel
    # monitoring this pod as master. The server's decision never asks this pod's own sentinel.
    waited=0
    until REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -p 6379 --no-auth-warning ping >/dev/null 2>&1; do
      sleep 1
      waited=$((waited + 1))
      [ $((waited % 30)) -eq 0 ] && echo "sentinel: waiting for this pod's server (${waited}s)" >&2
    done
    master=$(ask_sentinels)
    if [ -z "$master" ]; then
      role=$(REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli -p 6379 --no-auth-warning \
        info replication | tr -d '\r' | sed -n 's/^master_host://p')
      master="${role:-$SELF}"
    fi
    {
      echo "port 26379"
      echo "sentinel resolve-hostnames yes"
      echo "sentinel announce-hostnames yes"
      echo "sentinel announce-ip $SELF"
      echo "requirepass $VALKEY_PASSWORD"
      echo "sentinel monitor supportx $master 6379 {{ $ha.quorum }}"
      echo "sentinel auth-pass supportx $VALKEY_PASSWORD"
      echo "sentinel down-after-milliseconds supportx {{ $ha.downAfterMilliseconds }}"
      echo "sentinel failover-timeout supportx {{ $ha.failoverTimeoutMilliseconds }}"
      echo "sentinel parallel-syncs supportx 1"
    } > /run/sentinel/sentinel.conf
    exec valkey-sentinel /run/sentinel/sentinel.conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $headless }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  clusterIP: None
  # Sentinels and replicas find each other before they are ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "supportx.selector" $c | nindent 4 }}
  ports:
    - {name: valkey, port: 6379}
    - {name: sentinel, port: 26379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $headless }}
  replicas: {{ $ha.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "supportx.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supportx.labels" $c | nindent 8 }}
      annotations:
        # The scripts live in this chart: a change to them ships with a new chart version.
        checksum/scripts: {{ printf "%s-%s" (toJson $ha) .Chart.Version | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "supportx.pullSecrets" . | nindent 6 }}
      {{- include "supportx.podSecurityContext" . | nindent 6 }}
      {{- with include "supportx.scheduling" $c }}{{ . | nindent 6 }}{{- end }}
      containers:
        {{- range $role := list "valkey" "sentinel" }}
        - name: {{ $role }}
          image: {{ include "supportx.thirdPartyImage" (dict "root" $ "image" $.Values.images.valkey) }}
          command: ["/bin/sh", "/scripts/{{ $role }}.sh"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.secrets.app }}, key: valkey-password}}
          ports:
            - {name: {{ $role }}, containerPort: {{ if eq $role "valkey" }}6379{{ else }}26379{{ end }}}
          readinessProbe:
            exec:
              # While the server waits to start, the probe prints why (valkey.sh's $WAITING).
              command: ["/bin/sh", "-c", "{{ if eq $role "valkey" }}if [ -f /run/valkey/waiting ]; then cat /run/valkey/waiting; exit 1; fi; {{ end }}REDISCLI_AUTH=\"$VALKEY_PASSWORD\" valkey-cli -p {{ if eq $role "valkey" }}6379{{ else }}26379{{ end }} --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.valkeyHa.resources | nindent 12 }}
          {{- include "supportx.containerSecurityContext" $ | nindent 10 }}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: run, mountPath: /run/{{ $role }}}
            - {name: data, mountPath: /data}
        {{- end }}
      volumes:
        - name: scripts
          configMap: {name: {{ $name }}-scripts}
        - name: run
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: data
          emptyDir: {}
---
# Its servers and sentinels: SupportX's own pods only (the app, Centrifugo, each other).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-ingress
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "supportx.selector" $c | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: supportx
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 26379, protocol: TCP}
---
# A quorum of sentinels stays up through a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  minAvailable: {{ $ha.quorum }}
  selector:
    matchLabels:
      {{- include "supportx.selector" $c | nindent 6 }}
{{- end }}
