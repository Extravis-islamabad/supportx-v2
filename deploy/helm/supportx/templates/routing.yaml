{{- /*
One host, paths (D3). Same routes as the Vite dev proxy:
  /api/        API (with the BFF, D-009)
  /connection  Centrifugo WebSocket, HTTP-streaming and SSE (WP-011)
  /emulation   Centrifugo's fallback emulation endpoint
  /auth/       Keycloak; /auth/admin only when keycloak.exposeAdmin (dev, e2e)
  /            console, /portal/ portal (web)
Gateway API with Traefik by default (D2); a plain Ingress for clusters that bring their own.
HTTPS by default (routing.tls, audit row 5): the routes above hang off the HTTPS listener, and the
plain HTTP listener only redirects to https, so no session cookie or password crosses it.
*/ -}}
{{- $c := dict "root" . "component" "routing" -}}
{{- $gw := .Values.routing.gateway -}}
{{- $gwName := default .Release.Name $gw.name -}}
{{- $gwNamespace := default .Release.Namespace $gw.namespace -}}
{{- $tls := .Values.routing.tls -}}
{{- $tlsSecret := include "supportx.routingTlsSecret" . -}}
{{- /* The listener the application routes attach to: HTTPS when TLS is on. */ -}}
{{- $appListener := $gw.listenerName -}}
{{- if $tls.enabled }}{{ $appListener = $gw.tlsListenerName }}{{ end -}}
{{- if and $tls.enabled $tls.issuerRef.name (ne .Values.routing.mode "none") }}
# The gateway's certificate from cert-manager (routing.tls.issuerRef), renewed by it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  secretName: {{ $tlsSecret }}
  dnsNames:
    {{- toYaml (include "supportx.publicHosts" . | fromJsonArray) | nindent 4 }}
  issuerRef:
    name: {{ $tls.issuerRef.name }}
    kind: {{ default "Issuer" $tls.issuerRef.kind }}
    group: {{ default "cert-manager.io" $tls.issuerRef.group }}
---
{{- end }}
{{- $backends := list
  (dict "path" "/api" "service" "api" "port" 8000)
  (dict "path" "/connection" "service" "centrifugo" "port" 8000)
  (dict "path" "/emulation" "service" "centrifugo" "port" 8000)
  (dict "path" "/auth" "service" "keycloak" "port" 8080)
  (dict "path" "/" "service" "web" "port" 8080)
-}}
{{- if eq .Values.routing.mode "gateway" }}
{{- if $gw.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className }}
  listeners:
    {{- if $tls.enabled }}
    - name: {{ $gw.tlsListenerName }}
      port: {{ $gw.tlsPort }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $tlsSecret }}
      allowedRoutes:
        namespaces: {from: Same}
    {{- end }}
    {{- if or (not $tls.enabled) $tls.redirectHttp }}
    - name: {{ $gw.listenerName }}
      port: {{ $gw.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
    {{- end }}
---
{{- end }}
{{- if and $tls.enabled $tls.redirectHttp }}
# Plain HTTP: one rule, a permanent redirect to the same host and path on https. No scheme port
# is given, so the redirect goes to 443 (Gateway API: the scheme's well-known port).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https-redirect
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNamespace }}
      sectionName: {{ $gw.listenerName }}
  {{- with .Values.routing.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNamespace }}
      sectionName: {{ $appListener }}
  {{- with .Values.routing.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if not .Values.keycloak.exposeAdmin }}
    # Keycloak's admin console and admin API stay off the public host.
    - matches:
        - path: {type: PathPrefix, value: /auth/admin}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /}
            statusCode: 302
    {{- end }}
    {{- range $backends }}
    - matches:
        - path: {type: PathPrefix, value: {{ .path }}}
      backendRefs:
        - name: {{ printf "%s-%s" $.Release.Name .service }}
          port: {{ .port }}
    {{- end }}
{{- else if eq .Values.routing.mode "ingress" }}
{{- $ing := .Values.routing.ingress -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  {{- if $tls.enabled }}
  tls:
    - secretName: {{ $tlsSecret }}
      {{- with $.Values.routing.hostnames }}
      hosts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  rules:
    {{- $hosts := .Values.routing.hostnames | default (list "") }}
    {{- range $host := $hosts }}
    - {{- if $host }} host: {{ $host }}{{ end }}
      http:
        paths:
          {{- if not $.Values.keycloak.exposeAdmin }}
          # Keycloak's admin console and admin API stay off the public host: the longest prefix
          # wins, so /auth/admin goes to the web server, which answers 404 (deploy/images/nginx.conf).
          - path: /auth/admin
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-web" $.Release.Name }}
                port: {number: 8080}
          {{- end }}
          {{- range $backends }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" $.Release.Name .service }}
                port: {number: {{ .port }}}
          {{- end }}
    {{- end }}
{{- end }}
