{{- /*
Egress allow-list (WP-014b), opt-in: networkPolicies.egress.enabled, off by default.

On, every pod in the release namespace may reach only:
  - DNS (kube-dns in kube-system, and networkPolicies.egress.dnsAddresses: NodeLocal DNSCache);
  - other pods in this namespace (the database, PgBouncer, NATS, Valkey, Keycloak, SeaweedFS,
    clamd: their own ingress policies still decide who gets in);
  - the rules in networkPolicies.egress.extra (every pod) and
    networkPolicies.egress.components.<component> (that component's pods): your SMTP relay,
    proxy, LDAP servers, Microsoft Graph, AI providers, MonetX, webhook targets. NetworkPolicies
    match addresses, not host names, so these are CIDRs, or a forward proxy's address;
  - the Kubernetes API (its real addresses, see below), for the pods that use it only:
    CloudNativePG's instance and pooler pods (their instance manager), and the API and worker
    pods, whose wait-for-migrate init container asks whether this revision's migrate Job is done.
Everything else leaving the namespace is dropped. Off, egress stays open, as before.
*/ -}}
{{- $egress := .Values.networkPolicies.egress }}
{{- if and .Values.networkPolicies.enabled $egress.enabled }}
{{- $rel := .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-egress-base
  labels:
    {{- include "supportx.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        {{- range $egress.dnsAddresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
    {{- with $egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- range $component, $rules := $egress.components }}
{{- if $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-{{ $component }}-egress
  labels:
    {{- include "supportx.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $rel }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Egress]
  egress:
    {{- toYaml $rules | nindent 4 }}
{{- end }}
{{- end }}
{{- with $egress.database }}
---
# The database's own pods only: an external backup target and its port, least privilege (D-166;
# the audit's rule against opening an address to every pod). CloudNativePG's pods carry
# cnpg.io/cluster (not app.kubernetes.io/component); only this release's clusters are selected,
# the chart's <release>-pg and the restore runbook's <release>-pg-restore (docs/runbooks/restore.md),
# never another release's or another team's CloudNativePG cluster in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-database-egress
  labels:
    {{- include "supportx.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: cnpg.io/cluster, operator: In, values: [{{ $rel }}-pg, {{ $rel }}-pg-restore]}
  policyTypes: [Egress]
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- $kubeApiUsers := list
  (dict "name" "cluster" "match" (list (dict "key" "cnpg.io/cluster" "operator" "Exists")))
  (dict "name" "poolername" "match" (list (dict "key" "cnpg.io/poolerName" "operator" "Exists")))
  (dict "name" "backend" "match" (list
    (dict "key" "app.kubernetes.io/instance" "operator" "In" "values" (list $rel))
    (dict "key" "app.kubernetes.io/component" "operator" "In" "values" (list "api" "relay" "consumers" "fanout" "indexes" "sla-timers" "workflow-timers" "temporal"))))
}}
{{- /*
The control plane's addresses as pods reach it (NetworkPolicies see the address after the
kubernetes Service's DNAT): networkPolicies.egress.kubeApiCidrs when set, else the default/kubernetes
EndpointSlice read at install time. `helm template` and GitOps tools can't read the cluster, so
there the CIDRs must be set; the chart refuses to guess (no 0.0.0.0/0).
*/ -}}
{{- $apiCidrs := list }}
{{- $apiPorts := list }}
{{- if $egress.kubeApiCidrs }}
{{- $apiCidrs = $egress.kubeApiCidrs }}
{{- $apiPorts = $egress.kubeApiPorts }}
{{- else }}
{{- $slice := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes" }}
{{- range ($slice.endpoints | default list) }}
{{- range .addresses }}
{{- $apiCidrs = append $apiCidrs (printf "%s/%s" . (ternary "128" "32" (contains ":" .))) }}
{{- end }}
{{- end }}
{{- range ($slice.ports | default list) }}
{{- $apiPorts = append $apiPorts .port }}
{{- end }}
{{- end }}
{{- if or (empty $apiCidrs) (empty $apiPorts) }}
{{- fail "networkPolicies.egress is on, but the Kubernetes API's addresses are unknown (the chart could not read the default/kubernetes EndpointSlice, e.g. under helm template or GitOps). Set networkPolicies.egress.kubeApiCidrs to your control plane's addresses (kubectl get endpointslice -n default kubernetes) and kubeApiPorts to its port (usually 6443)." }}
{{- end }}
{{- range $kubeApiUsers }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rel }}-{{ .name }}-kube-api-egress
  labels:
    {{- include "supportx.labels" (dict "root" $ "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      {{- toYaml .match | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range $apiCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $apiPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- end }}
