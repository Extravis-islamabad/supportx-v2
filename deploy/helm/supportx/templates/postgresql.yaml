{{- if eq .Values.postgresql.mode "cnpg" }}
{{- $c := dict "root" . "component" "postgresql" -}}
{{- $pg := .Values.postgresql.cnpg -}}
# PostgreSQL 16 + pgvector through the CloudNativePG operator (D1, D-037). The bootstrap database
# is Keycloak's; SupportX's own roles and database come from tooling/sql via the migrate Job
# (one source with the dev stack and CI). Backups and replicas: WP-014b.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  instances: {{ $pg.instances }}
  imageName: {{ include "supportx.thirdPartyImage" (dict "root" . "image" .Values.images.postgres) }}
  {{- with .Values.images.pullSecrets }}
  imagePullSecrets:
    {{- range . }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: {{ .Values.secrets.keycloakDb }}
  postgresql:
    parameters:
      {{- range $k, $v := $pg.parameters }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  {{- if eq (include "supportx.dbTls" .) "true" }}
  certificates:
    # The app reaches PostgreSQL through the pooler, and CloudNativePG's PgBouncer serves this
    # cluster's server certificate: it names the pooler's service too, so verify-full (the host
    # name checked, audit row 5) holds on that hop. The operator adds these to its own names.
    serverAltDNSNames:
      - {{ .Release.Name }}-pg-pooler
      - {{ .Release.Name }}-pg-pooler.{{ .Release.Namespace }}
      - {{ .Release.Name }}-pg-pooler.{{ .Release.Namespace }}.svc
      - {{ .Release.Name }}-pg-pooler.{{ .Release.Namespace }}.svc.cluster.local
  {{- end }}
  storage:
    size: {{ $pg.storage.size }}
    {{- with $pg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- if $pg.walStorage.size }}
  walStorage:
    size: {{ $pg.walStorage.size }}
    {{- with $pg.walStorage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- end }}
  resources:
    {{- toYaml $pg.resources | nindent 4 }}
  {{- if .Values.ha.enabled }}
  # HA: CloudNativePG's own anti-affinity, required with ha.antiAffinity hard (its default is
  # preferred, which lets two instances share a node and fall together).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: {{ ternary "required" "preferred" (eq .Values.ha.antiAffinity "hard") }}
    topologyKey: kubernetes.io/hostname
  {{- end }}
  {{- if $pg.backup.enabled }}
  # WAL archiving and base backups through the Barman Cloud plugin (WP-014b).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Release.Name }}-pg-backups
  {{- end }}
  {{- if include "supportx.podMonitorsEnabled" . }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
{{- if $pg.backup.enabled }}
{{- $b := $pg.backup }}
{{- $endpoint := $b.endpointURL }}
{{- if not $endpoint }}
{{- $endpoint = ternary (printf "http://%s-seaweedfs:8333" .Release.Name) .Values.objectStorage.external.endpoint (eq .Values.objectStorage.mode "seaweedfs") }}
{{- end }}
{{- /* In this release's own SeaweedFS (dev, CI) or anywhere else (production): elsewhere it must
be encrypted at rest, by us or by the bucket's stated policy (fails closed). */ -}}
{{- $inCluster := and (not $b.endpointURL) (eq .Values.objectStorage.mode "seaweedfs") }}
{{- if and (not $inCluster) (not $b.encryption) (not $b.encryptionByBucketPolicy) }}
{{- fail "postgresql.cnpg.backup: an external backup target must be encrypted at rest. Set postgresql.cnpg.backup.encryption (AES256 or aws:kms), or postgresql.cnpg.backup.encryptionByBucketPolicy: true if the bucket's own policy encrypts every object." }}
{{- end }}
{{- $secret := $b.credentialsSecret | default .Values.secrets.app }}
{{- $idKey := ternary "ACCESS_KEY_ID" "s3-access-key" (not (empty $b.credentialsSecret)) }}
{{- $keyKey := ternary "ACCESS_SECRET_KEY" "s3-secret-key" (not (empty $b.credentialsSecret)) }}
---
# Where the backups go (the plugin's ObjectStore): WAL continuously, base backups on schedule.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Release.Name }}-pg-backups
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  retentionPolicy: {{ $b.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ $b.destinationPath | default (printf "s3://%s/backups/postgres" .Values.objectStorage.bucket) | quote }}
    {{- with $endpoint }}
    endpointURL: {{ . | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ $secret }}
        key: {{ $idKey }}
      secretAccessKey:
        name: {{ $secret }}
        key: {{ $keyKey }}
    wal:
      compression: {{ $b.walCompression }}
      {{- with $b.encryption }}
      encryption: {{ . }}
      {{- end }}
    data:
      compression: {{ $b.walCompression }}
      {{- with $b.encryption }}
      encryption: {{ . }}
      {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-pg-daily
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  schedule: {{ $b.schedule | quote }}
  backupOwnerReference: self
  immediate: true                     # a first base backup as soon as the cluster is up
  cluster:
    name: {{ .Release.Name }}-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- if $pg.devNodePort }}
---
# DEV ONLY: the primary on a NodePort for the e2e suite's fixture tools (values-dev.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pg-dev
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: {{ .Release.Name }}-pg
    cnpg.io/instanceRole: primary
  ports:
    - {name: postgres, port: 5432, targetPort: 5432, nodePort: {{ $pg.devNodePort }}}
{{- end }}
---
# PgBouncer in transaction mode in front of PostgreSQL (architecture.md §7.3): the API's pool.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Release.Name }}-pg-pooler
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  cluster:
    name: {{ .Release.Name }}-pg
  instances: {{ $pg.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      default_pool_size: {{ $pg.pooler.defaultPoolSize | quote }}
      max_client_conn: {{ $pg.pooler.maxClientConn | quote }}
      {{- with $pg.pooler.tcpUserTimeoutMs }}
      # A server connection to a primary whose node vanished (no reset ever comes) is dropped
      # after this long, not after the kernel's minutes of retries (WP-014b node-loss test).
      tcp_user_timeout: {{ . | quote }}
      {{- end }}
  {{- if and .Values.ha.enabled (gt (int $pg.pooler.instances) 1) }}
  # HA (WP-014b): the copies on different nodes, like every other multi-copy component.
  template:
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          {{- if eq .Values.ha.antiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  cnpg.io/poolerName: {{ .Release.Name }}-pg-pooler
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: {{ .Release.Name }}-pg-pooler
          {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: {{ .Release.Name }}-pg-pooler
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-pg-pooler
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  minAvailable: {{ .Values.ha.minAvailable }}
  selector:
    matchLabels:
      cnpg.io/poolerName: {{ .Release.Name }}-pg-pooler
  {{- end }}
{{- end }}
