{{- $c := dict "root" . "component" "centrifugo" -}}
# Realtime gateway (ADR-005, ADR-023). Same options as the dev stack's config.json; the browser
# reaches it on the public host at /connection and /emulation (D3). Secrets only through env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supportx.name" $c }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
data:
  config.json: |
    {
      "client": {
        "allowed_origins": [{{ .Values.publicUrl | quote }}],
        "token": {"audience": "supportx-realtime", "issuer": "supportx-api"},
        "channel_limit": 256
      },
      "channel": {
        "namespace_boundary": "|",
        "without_namespace": {
          "history_size": 100,
          "history_ttl": "300s",
          "force_recovery": true,
          "allow_presence_for_subscriber": true,
          "presence": true
        }
      },
      "sse": {"enabled": true},
      "http_stream": {"enabled": true},
      "http_api": {},
      "prometheus": {"enabled": true},
      "health": {"enabled": true},
      "log": {"level": "info"}
      {{- if .Values.valkeyHa.enabled }}
      {{- $vk := include "supportx.name" (dict "root" . "component" "valkey") }}
      {{- $sentinels := list }}
      {{- range $i := until (int .Values.valkeyHa.replicas) }}
      {{- $sentinels = append $sentinels (printf "%s-%d.%s-headless.%s.svc:26379" $vk $i $vk $.Release.Namespace) }}
      {{- end }},
      "engine": {
        "type": "redis",
        "redis": {
          "prefix": {{ printf "%s-centrifugo" .Release.Name | quote }},
          "sentinel_address": {{ toJson $sentinels }},
          "sentinel_master_name": "supportx"
          {{- if eq (include "supportx.valkeyTls" .) "true" }},
          "tls": {"enabled": true, "server_ca_pem": "/etc/supportx/tls/internal-ca/ca.crt"},
          "sentinel_tls": {"enabled": true, "server_ca_pem": "/etc/supportx/tls/internal-ca/ca.crt"}
          {{- end }}
        }
      }
      {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supportx.name" $c }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.centrifugo.replicas }}
  selector:
    matchLabels:
      {{- include "supportx.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supportx.labels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.publicUrl | sha256sum }}
        {{- if include "supportx.internalTlsOn" . }}
        # Turning internal TLS on changes the engine settings above: roll the pods with it.
        supportx.io/internal-tls: "on"
        {{- end }}
        {{- if not (include "supportx.podMonitorsEnabled" .) }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "supportx.pullSecrets" . | nindent 6 }}
      {{- include "supportx.podSecurityContext" . | nindent 6 }}
      {{- with include "supportx.scheduling" $c }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: centrifugo
          image: {{ include "supportx.thirdPartyImage" (dict "root" . "image" .Values.images.centrifugo) }}
          command: ["centrifugo", "--config", "/centrifugo/config.json"]
          env:
            {{- if .Values.valkeyHa.enabled }}
            # The Valkey engine through its sentinels (HA, ADR-038): Valkey's own password for both.
            - name: CENTRIFUGO_ENGINE_REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: valkey-password}}
            - name: CENTRIFUGO_ENGINE_REDIS_SENTINEL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: valkey-password}}
            {{- end }}
            - name: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: centrifugo-token-secret}}
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.app }}, key: centrifugo-api-key}}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          {{- include "supportx.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.centrifugo.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /centrifugo, readOnly: true}
            {{- with include "supportx.internalCaMount" . | trim }}{{ . | nindent 12 }}{{ end }}
      volumes:
        - name: config
          configMap: {name: {{ include "supportx.name" $c }}}
        {{- with include "supportx.internalCaVolume" . | trim }}{{ . | nindent 8 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supportx.name" $c }}
  labels:
    {{- include "supportx.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "supportx.selector" $c | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
