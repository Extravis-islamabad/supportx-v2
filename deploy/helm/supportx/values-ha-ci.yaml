# The HA smoke on a standard CI runner (WP-014b, decision 1): the HA topology of values-ha.yaml
# (copies, sentinels, budgets, anti-affinity) with small requests, so it fits a 4 vCPU, 16 GB
# runner. Never for a real install.
api:
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 3, targetCPUPercent: 70}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
keycloak:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
postgresql:
  cnpg:
    # Backups on (WP-014b): the restore drill (deploy/k3d/restore-drill.sh) restores them into a
    # new cluster. The in-cluster SeaweedFS is the target here, fine for CI only.
    backup:
      enabled: true
    resources:
      requests: {cpu: 50m, memory: 256Mi}
    parameters:
      shared_buffers: 64MB
      max_connections: "200"
valkeyHa:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
# The egress allow-list on (opt-in, off by default): every HA test then runs under it, and
# deploy/k3d/egress-check.sh shows that nothing else leaves the namespace.
networkPolicies:
  egress:
    enabled: true
    components:
      # freshclam fetches signatures from ClamAV's CDN (no fixed addresses). A real install with
      # egress on lists its private mirror or forward proxy here instead (clamav.privateMirror).
      clamav:
        - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 80}]

# The HA smoke tests Valkey failover; the bundled Temporal is covered by the core cluster smoke.
temporal:
  bundled:
    enabled: false
