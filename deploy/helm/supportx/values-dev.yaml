# Local k3d cluster (make cluster-up && make deploy-dev). Plain http on supportx.localhost:8080,
# the dev realm with its demo users, demo tenants seeded, images built locally and imported.
publicUrl: http://supportx.localhost:8080

# Plain http on purpose, the local cluster only: the e2e suite and the HA tests (values-ha-ci.yaml
# sits on top of this file) reach supportx.localhost:8080 with no certificate to trust. Every
# other profile serves HTTPS and redirects HTTP (routing.tls, docs/deployment.md).
routing:
  tls:
    enabled: false

images:
  backend: {repository: supportx-backend, tag: dev, pullPolicy: Never}
  worker: {repository: supportx-worker, tag: dev, pullPolicy: Never}
  web: {repository: supportx-web, tag: dev, pullPolicy: Never}

app:
  profile: dev
  logLevel: info
  seedDevData: true

keycloak:
  realmImport: dev
  exposeAdmin: true             # the e2e suite creates its users through the admin API
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}

postgresql:
  cnpg:
    devNodePort: 30432          # 127.0.0.1:25433 on the host (deploy/k3d/cluster.yaml)
    storage: {size: 2Gi}
    parameters:
      shared_buffers: 128MB
      max_connections: "100"
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 768Mi}

nats:
  config:
    jetstream:
      fileStore:
        pvc: {size: 1Gi}

api:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}

objectStorage:
  seaweedfs:
    storage: {size: 1Gi}
    volumeSizeLimitMB: 256

# Every e-mail goes to the in-cluster mail catcher and none leaves (dev only; deploy/k3d/e2e.sh
# reads it on 127.0.0.1:28025).
mailCatcher:
  enabled: true
  devNodePort: 30825          # 127.0.0.1:28025 on the host (deploy/k3d/cluster.yaml)

mail:
  smtpHost: supportx-mailcatcher
  smtpPort: 1025
  smtpSecurity: none
  fromAddress: noreply@supportx.localhost

# The e2e journeys check the AI features against the fake's answers (QA6-AI-01).
ai:
  fakeEcho: true

# Temporal on the dev cluster too, smaller.
temporal:
  bundled:
    enabled: true
    historyShards: 4
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {cpu: "1", memory: 768Mi}
