# SupportX chart defaults: production-shaped and secret-free. Profiles override them:
#   values-dev.yaml          local k3d cluster (make deploy-dev)
#   values-single-node.yaml  one k3s VM (architecture.md §14.2 appliance)
# HA, SaaS and air-gapped profiles follow in WP-014b/c/d (docs/PROGRESS.md).
# Nothing here branches on SaaS vs on-prem (CLAUDE.md rule f): profiles differ only in sizes,
# replicas, routing and which licence provider the licensing module reads.

# --- where users reach it (D3: one host, paths) ---------------------------------------------------
# The browser's origin. Console at /, portal at /portal/, API at /api, realtime at /connection and
# /emulation, Keycloak at /auth. Required.
publicUrl: ""

images:
  registry: ""          # overrides every image's registry (air-gapped mirror, WP-014c)
  pullSecrets: []
  backend:
    repository: ghcr.io/extravis-islamabad/supportx-backend
    tag: ""             # default: .Chart.AppVersion
    digest: ""          # preferred in real installs: sha256:...
    pullPolicy: IfNotPresent
  # The consumers worker with PDF rendering (WeasyPrint + Pango, D-100 D8): the backend image's
  # `worker` target. The API and the other workers keep the backend image.
  worker:
    repository: ghcr.io/extravis-islamabad/supportx-worker
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/extravis-islamabad/supportx-web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Third-party images, pinned (D-037). Digests are added by the release pipeline (WP-014c).
  keycloak: quay.io/keycloak/keycloak:26.8.1
  centrifugo: centrifugo/centrifugo:v6.10.1
  postgres: ghcr.io/cloudnative-pg/postgresql:16.15-202610190958-standard-trixie
  seaweedfs: chrislusf/seaweedfs:4.48
  clamav: clamav/clamav:1.5.4-debian
  mailpit: axllent/mailpit:v1.31.6   # dev profile only (mailCatcher)
  valkey: valkey/valkey:9.1.2        # HA only (valkeyHa, ADR-038); the bundled chart's own otherwise
  # HA on k3s only (D-163): NodeLocal DNSCache, a cluster add-on that deploy/k3s/node-local-dns.sh
  # installs (the chart never deploys it). Listed here so the air-gapped mirror carries it.
  nodeLocalDns: registry.k8s.io/dns/k8s-dns-node-cache:1.27.1@sha256:6748acde83ac08626a27a554da5364e8cac64bc950c6a1b6b939a3d27b364ae7
  # Local AI (WP-037, D-131): pinned by digest; mirrored through Zot like the others (D-038).
  llamaCpp: ghcr.io/ggml-org/llama.cpp:server-b11960@sha256:8052c13edd987de8858f8150031e025ac3d66823f09cf3ec8220899c4abce220
  # Bundled Temporal (temporal.bundled): the server, and admin-tools for its schema Job.
  temporalServer: temporalio/server:1.29.7
  temporalAdminTools: temporalio/admin-tools:1.29.7-tctl-1.18.4-cli-1.7.2
  vllm: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34

# --- secrets (never in values) ---------------------------------------------------------------------
# Created before install by deploy/scripts/secrets.sh (random values, never overwritten), later
# by the installer (WP-014c) or External Secrets (WP-014d). Keys: see deploy/helm/README.md.
secrets:
  app: supportx-app                 # Opaque: app keys, role passwords, NATS/Valkey passwords
  keycloakDb: supportx-db-keycloak  # kubernetes.io/basic-auth for the keycloak database owner
  # kubernetes.io/basic-auth (username seaweedfs_filer) for the HA SeaweedFS filers' metadata
  # database (objectStorage.seaweedfs.ha, D-166); read only with that on.
  seaweedfsFilerDb: supportx-db-seaweedfs-filer
  # Sign-in key ring (D-162, ADR-048; docs/guides/rotating-the-sign-in-key.md), newest first.
  # Each entry names its key ID and the key of `app` holding its secret (hex or base64url, at
  # least 32 characters); never the secret itself. {id: legacy} without `key` is session-secret.
  # Empty: session-secret alone, as before (a one-key ring called "legacy").
  #   sessionKeys:
  #     - {id: "2026-11", key: session-key-2026-11}
  #     - {id: legacy}
  sessionKeys: []

# --- application settings (SUPPORTX_*) ---------------------------------------------------------------
app:
  profile: production
  logLevel: info
  # subscription = plan rows (dev, SaaS); licence_file = signed licence (on-prem, WP-013).
  entitlementProvider: subscription
  licenceSecret: ""                 # Secret with key `licence.json` when licence_file is used
  extraEnv: {}                      # more SUPPORTX_* settings, name: value
  # Dev only: create the two demo tenants that match the dev realm (tooling/seed_dev.py).
  seedDevData: false

api:
  replicas: 1
  # Proxies whose X-Forwarded-For the API trusts, as addresses or CIDRs: the gateway's pods
  # (Traefik on k3s's pod network by default). The client address used for rate limits and the
  # audit log is the last one not in this list, so a client can't choose its own. Set it to your
  # cluster's pod CIDR, or your load balancer's addresses if it sits in front.
  trustedProxies: "10.42.0.0/16"
  # On CPU, between minReplicas and maxReplicas (HA). Replaces `replicas` while enabled.
  autoscaling: {enabled: false, minReplicas: 3, maxReplicas: 6, targetCPUPercent: 70}
  # One uvicorn process per pod; scale with replicas so each pod has one metrics registry.
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {cpu: "2", memory: 1Gi}

relay:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}

consumers:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: "1", memory: 768Mi}  # scans stream; images up to 50 MB are processed whole (WP-022)

# Exactly one copy (ADR-023: merge windows and per-tenant rate limits are in memory). Rollouts
# surge one new pod before the old stops; the durable consumer resumes from its last ack.
fanout:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}

# Custom field index worker (D-088): one copy builds the indexes admins ask for, one at a time
# (an advisory lock keeps a second copy or the migrate Job's fallback pass from building too).
indexWorker:
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {cpu: 250m, memory: 256Mi}

# Temporal (§5; SLA clocks WP-025, ADR-037; workflow timers WP-048b, ADR-043).
# - `bundled.enabled`: this release runs its own Temporal (the official server image, all four
#   services in one Deployment) on the CloudNativePG cluster, in databases `temporal` and
#   `temporal_visibility` owned by the `temporal` role (password: key temporal-db-password of
#   secrets.app). The schema Job creates them, then applies Temporal's versioned schema; it never
#   drops or overwrites anything (rule 5h). `address` then defaults to the bundled frontend.
# - else `address`: the frontend (host:port) of a Temporal the installation runs itself.
# - neither: no Temporal. The SLA safety net fires every warning, breach and escalation up to two
#   minutes late (D-115 D5), and the workflow sweep wakes due timers within a minute.
temporal:
  address: ""
  namespace: supportx
  taskQueue: sla
  workflowTaskQueue: workflows
  # Days a closed workflow's history is kept in Temporal (our own records keep their history).
  retentionDays: 3
  bundled:
    enabled: false
    replicas: 1
    # Fixed at the first start: Temporal cannot change it later. 512 serves thousands of timers a
    # second; raise it only for a new installation.
    historyShards: 512
    logLevel: warn
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}
    schemaResources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# The SLA timers worker: replicas share the task queue; a repeated task is a no-op (sla.fire).
slaTimers:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The workflow timers worker (WP-048b, ADR-043): like the SLA timers, only where Temporal is set.
workflowTimers:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 160Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The mobile app's verified sign-in return link (ADR-044 item 3): the host serves
# apple-app-site-association and assetlinks.json naming the app builds this installation trusts,
# so only those apps receive the return. Empty lists: neither file is served (404). On-prem and
# air-gapped installations put their own app build's IDs here.
mobile:
  returnPath: /mobile/auth  # fixed per installation, never taken from a request
  ios:
    appIds: []  # "<Team ID>.<bundle ID>", e.g. "ABCDE12345.com.extravis.supportx"
  android:
    package: ""  # e.g. "com.extravis.supportx"
    certSha256: []  # the signing certificate's SHA-256 fingerprints, "AB:CD:..."

web:
  replicas: 1
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 96Mi}

migrate:
  # Seconds the API and workers wait for this release's migrate Job before failing.
  waitTimeoutSeconds: 900
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: "1", memory: 512Mi}

# --- PostgreSQL 16 (CloudNativePG, D1) --------------------------------------------------------------
postgresql:
  # cnpg: a Cluster in this release (operator installed cluster-wide first).
  # external: a DBA-managed server; set the host and run tooling/sql once as superuser.
  mode: cnpg
  database: supportx
  # TLS to the database, verified (audit row 5; docs/deployment.md, Transport security): the API,
  # the workers and the migrate Job connect with sslmode verify-full against the server's CA
  # (SUPPORTX_DATABASE_SSL_ROOT_CERT). cnpg: the cluster's own CA (Secret <release>-pg-ca, made
  # by CloudNativePG); its PgBouncer serves the cluster's server certificate, which then also
  # names the pooler. external: your server's CA in external.caSecret. Off: asyncpg's default,
  # encrypted when the server offers TLS but nothing checked.
  tls:
    verify: true
  external:
    host: ""
    port: 5432
    poolerHost: ""                  # PgBouncer in transaction mode, if any (else = host)
    # With tls.verify: a Secret holding the CA your server's (and pooler's) certificate chains
    # to, as `ca.crt`. The host names above must be in that certificate.
    caSecret: ""
  cnpg:
    instances: 1
    storage: {size: 20Gi, storageClass: ""}
    walStorage: {size: "", storageClass: ""}   # empty = WAL on the data volume
    parameters:
      shared_buffers: 512MB
      max_connections: "200"
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    # Dev only (values-dev.yaml): a NodePort on the primary for the e2e suite's tools. Never set
    # it in a real install; empty = off.
    devNodePort: ""
    # Where the operator runs (NetworkPolicies let it reach the instances).
    operatorNamespace: cnpg-system
    pooler:
      instances: 1
      defaultPoolSize: "25"
      maxClientConn: "500"
      tcpUserTimeoutMs: ""          # PgBouncer tcp_user_timeout; values-ha.yaml sets it
    # Backups (WP-014b): WAL archived continuously and a base backup on `schedule`, through
    # CloudNativePG's Barman Cloud plugin (a cluster prerequisite, like the operator), so the
    # database can be restored to any moment in `retentionPolicy` (point-in-time recovery).
    backup:
      enabled: false
      # Empty: this release's object storage (SeaweedFS in this release, or objectStorage.external),
      # in its bucket under backups/postgres. A separate bucket and credentials are safer (the app's
      # keys can then not touch the backups): set destinationPath, endpointURL and credentialsSecret.
      destinationPath: ""             # e.g. s3://supportx-backups/postgres
      endpointURL: ""
      credentialsSecret: ""           # keys ACCESS_KEY_ID and ACCESS_SECRET_KEY; empty: the app Secret's S3 keys
      retentionPolicy: "30d"
      schedule: "0 0 2 * * *"         # CloudNativePG's six fields (seconds first): daily at 02:00
      walCompression: gzip
      # At rest, by the target (S3 server-side encryption): AES256 (SSE-S3) or aws:kms. Empty: the
      # bucket's own policy. Production targets must encrypt, by this or by bucket policy; Barman
      # Cloud has no client-side encryption (the offsite rclone copy adds it, WP-014b).
      encryption: ""
      # A target outside this release must encrypt: set `encryption`, or set this to true to state
      # that the bucket's own policy encrypts every object. Otherwise the chart refuses to render.
      encryptionByBucketPolicy: false

# --- Object storage (S3 API only, D-016; WP-018, reused by WP-022) ---------------------------------------
# seaweedfs: SeaweedFS in this release (on-prem, ADR-012, D-076): one pod by default, or the
#            replicated topology below with objectStorage.seaweedfs.ha (values-ha.yaml, D-166).
# external:  any S3-compatible store (the cloud provider's S3 on SaaS). Credentials always come
#            from the app Secret (keys s3-access-key, s3-secret-key).
objectStorage:
  mode: seaweedfs
  bucket: supportx
  region: us-east-1
  external:
    endpoint: ""                    # e.g. https://s3.eu-central-1.amazonaws.com
  seaweedfs:
    storage: {size: 20Gi, storageClass: ""}
    volumeSizeLimitMB: 1024
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    # HA (D-166, ADR-038 addendum): SeaweedFS's own replication instead of the one pod above.
    # Three masters (raft), volume servers each keeping a copy of every volume on another server,
    # and filers running the S3 gateway behind the same <release>-seaweedfs Service and port, so
    # the app sees no change. Every copy of a component on its own node (required anti-affinity,
    # whatever ha.antiAffinity says): a copy on another server is then a copy on another node.
    # The filers' metadata lives in this release's CloudNativePG cluster (its own database and
    # role, in the same backups). Needs postgresql.mode cnpg. Disk: each file is stored
    # (1 + extra copies) times, so 2x with 001 (docs/deployment.md, Profiles).
    ha:
      enabled: false
      # SeaweedFS replica placement "xyz", extra copies on other servers of the same rack (z):
      # 001 = two copies in all, 002 = three (needs three volume servers up to write).
      replication: "001"
      # Minutes between the leader master's maintenance runs (empty volumes deleted, volumes
      # balanced, missing copies re-made: volume.fix.replication).
      maintenanceMinutes: 17
      master:
        replicas: 3                   # raft: an odd number; 2 of 3 keep the cluster writable
        storage: {size: 1Gi, storageClass: ""}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      volume:
        replicas: 3
        storage: {size: 20Gi, storageClass: ""}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
      filer:
        replicas: 2
        database: seaweedfs_filer     # its own database and role (seaweedfs_filer) in the cluster
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}

# --- Files and malware scanning (WP-022, ADR-028, D-082) -------------------------------------------
files:
  # Files wait as "scanning" until a scanner has checked them. Off only knowingly: files are then
  # stored "not scanned" and administrators are warned (docs/architecture/files.md).
  scanRequired: true
clamav:
  enabled: true
  # Copies of clamd (each with its own signatures volume and freshclam); values-ha.yaml runs two.
  # The consumers worker reaches them through one Service, which balances its connections.
  replicas: 1
  # Signature updates. Default: ClamAV's public mirrors. Air-gapped: a private mirror on the
  # internal network (e.g. http://mirror.internal/clamav), or none at all and the offline bundle
  # loaded with deploy/scripts/clamav-signatures.sh. Signatures older than 7 days raise an alert.
  privateMirror: ""
  checksPerDay: 12
  storage: {size: 2Gi, storageClass: ""}
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

# --- Local AI models (WP-037; REQ-AI-003, 004, 058; D-131) ---------------------------------------
# Off by default here; the installer (WP-014c) switches the local model on for every deployment.
# Each model has its own volume. Before a server starts, every weight file is checked against the
# sha256 pinned below, and a mismatch stops it (fail closed). Weights come from `ai.mirror` when it
# is set and the file is missing. Leave it "" when the installer fills the volume (air-gapped).
# Hugging Face is for connected installs only: its downloads redirect to a CDN on other hosts with
# no fixed addresses, so with networkPolicies.egress on, use an internal mirror or a proxy (never
# Hugging Face's own addresses), listed under networkPolicies.egress.components.llm-cpu /
# llm-embed / llm-gpu. A file failing its check is deleted when a mirror is set (it downloads again
# at the next start); earlier revisions are removed once the current one is verified.
ai:
  mirror: https://huggingface.co
  # The fake provider's echo for unrecorded prompts: CI and dev clusters only (QA6-AI-01).
  fakeEcho: false
  # A CPU-only llama.cpp server for chat and another for embeddings (bge-m3), in every install.
  local:
    enabled: false
    chat:
      name: qwen3-4b                  # SUPPORTX_AI_MODEL
      repo: Qwen/Qwen3-4B-GGUF
      revision: bc640142c66e1fdd12af0bd68f40445458f3869b
      files:
        - {path: Qwen3-4B-Q4_K_M.gguf, sha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5}
      contextSize: 8192
      storage: {size: 5Gi, storageClass: ""}
      resources:
        requests: {cpu: "2", memory: 4Gi}
        limits: {cpu: "4", memory: 6Gi}
    embeddings:
      name: bge-m3                    # SUPPORTX_AI_EMBEDDING_MODEL; 1024 wide (migration 0075)
      repo: gpustack/bge-m3-GGUF
      revision: 2d48f1737679ad900d5c26c5aad5410e9c70fdca
      files:
        - {path: bge-m3-Q8_0.gguf, sha256: 950f4a8e5e19477a6d3c26d2f162233c20002c601f75e4b002e3239997821167}
      contextSize: 8192
      storage: {size: 2Gi, storageClass: ""}
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
    # The weights check and download, before each server starts.
    weightsResources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  # An optional GPU node with vLLM: it answers chat instead of the CPU server (embeddings stay on
  # the CPU server). Qwen3-14B, AWQ-quantised to fit one 24 GB GPU.
  gpu:
    enabled: false
    model:
      name: qwen3-14b
      repo: Qwen/Qwen3-14B-AWQ
      revision: 31c69efc29464b6bb0aee1398b5a7b50a99340c3
      files:
        - {path: config.json, sha256: 5244a80c9acdc63504acff475a9c84044cca0f62cb4f184fe0cf7d1792fafb5a}
        - {path: generation_config.json, sha256: 2325da0f15bb848e018c5ae071b7943332e9f871d6b60e2ed22ca97d4cb993d2}
        - {path: merges.txt, sha256: 8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5}
        - {path: model-00001-of-00002.safetensors, sha256: 668eb0f1356638310db286f4819b223c12e3916934123f1a81b2b2c0e148c6a2}
        - {path: model-00002-of-00002.safetensors, sha256: c3c1625df80fe01211038bfa520629ebde6adf776556aa80cd49696d986d6657}
        - {path: model.safetensors.index.json, sha256: b8243c9f4e592643b48eb2c35f99f5a6c160a2e8a89b01075e05701871851997}
        - {path: tokenizer.json, sha256: aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4}
        - {path: tokenizer_config.json, sha256: d5d09f07b48c3086c508b30d1c9114bd1189145b74e982a265350c923acd8101}
        - {path: vocab.json, sha256: ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910}
    maxModelLen: 8192
    # The GPU resource the cluster's device plugin offers, e.g. nvidia.com/gpu or amd.com/gpu.
    # Required when enabled (nothing vendor-specific is assumed).
    resourceName: ""
    nodeSelector: {}
    tolerations: []
    runtimeClassName: ""              # when the cluster's GPU runtime is a RuntimeClass
    storage: {size: 20Gi, storageClass: ""}
    # The memory limit also covers the 2Gi shared-memory volume (/dev/shm) vLLM uses.
    resources:
      requests: {cpu: "2", memory: 16Gi}
      limits: {cpu: "8", memory: 24Gi}

# --- Audit log (WP-018, ADR-027) ---------------------------------------------------------------------
audit:
  # Public halves of retired anchor-signing keys, "<key id>:<base64>,..." (key rotation). The
  # active key is the app Secret's `audit-signing-key`, mounted into the consumers worker only.
  trustedKeys: ""

# --- NATS JetStream (upstream chart, D-037) ---------------------------------------------------------
nats:
  enabled: true
  config:
    cluster: {enabled: false}
    monitor: {enabled: true}
    jetstream:
      enabled: true
      fileStore:
        pvc: {size: 10Gi}
      memoryStore: {enabled: true, maxSize: 256Mi}
    merge:
      authorization:
        user: supportx
        password: << $SUPPORTX_NATS_PASSWORD >>
      # Notice a peer that went away without closing its connections (a lost node) within about
      # 30 s, not NATS's default 2 min x 2: until then a JetStream leader on the lost server is
      # not replaced and JetStream calls time out (the HA node-loss test's fan-out, run
      # 131684903919). The workers' clients use the same (backend/workers/bus.py).
      ping_interval: "10s"
      ping_max: 3
  container:
    env:
      SUPPORTX_NATS_PASSWORD:
        valueFrom:
          secretKeyRef: {name: supportx-app, key: nats-password}
    merge:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
  natsBox: {enabled: false}
  promExporter:
    enabled: true
    merge:
      securityContext: &restricted
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
  reloader:
    merge:
      securityContext: *restricted
  podTemplate:
    merge:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "7777"
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile: {type: RuntimeDefault}

# --- Valkey (upstream chart): sessions, caches, rate limits; nothing durable (ADR-020) -----------
valkey:
  enabled: true
  auth:
    enabled: true
    usersExistingSecret: supportx-app
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: valkey-password
  valkeyConfig: |
    maxmemory 256mb
    maxmemory-policy noeviction
  dataStorage: {enabled: false}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 384Mi}
  metrics:
    enabled: true
    exporter:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities: {drop: ["ALL"]}

# --- Centrifugo (realtime gateway, ADR-005) ---------------------------------------------------------
# HA Valkey (WP-014b, ADR-038): three pods, each a Valkey server and a Sentinel, on the official
# image. No pod reclaims the master role by itself: each asks the sentinels at start. values-ha.yaml
# turns it on and the bundled `valkey` chart off (that chart always makes pod 0 the master).
valkeyHa:
  enabled: false
  replicas: 3
  quorum: 2                         # sentinels that must agree the master is down
  # Sentinel promotes only a replica whose link to the master has been down for less than
  # 10 x down-after plus the master's SDOWN age. Losing a node can also stall DNS (a dead CoreDNS
  # endpoint until the node goes NotReady), and the sentinels, which resolve hostnames
  # synchronously, then reach SDOWN late: 77 s after the stop in Cluster run 43148329223, when
  # 5 s (a 50 s allowance) ruled out every replica (-failover-abort-no-good-slave). 10 s gives a
  # 100 s allowance; keep the DNS failover window (about the node-monitor grace period,
  # docs/deployment.md) inside it. Do not lower this without that check.
  downAfterMilliseconds: 10000
  # An aborted failover (e.g. -failover-abort-no-good-slave) is retried only after 2 x this:
  # 30 s gives a retry 60 s later (60 s gave 120 s, with the API unready on Valkey meanwhile).
  failoverTimeoutMilliseconds: 30000
  maxmemory: 256mb
  # TLS only between the app, Centrifugo, the servers and the sentinels (audit row 5), on the
  # same ports, with a certificate from the internal CA (internalTls; cert-manager required).
  # values-ha.yaml turns it on.
  tls:
    enabled: false
    reloadIntervalSeconds: 3600     # how often Valkey checks its certificate files for a renewal
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 384Mi}

# --- Internal TLS (audit row 5; templates/internal-tls.yaml) -----------------------------------------
# cert-manager signs the in-cluster servers' certificates (valkeyHa.tls, NATS) when any of them has
# TLS on. Default: the chart's own CA, a self-signed root kept only in `caSecret`; pods get its
# ca.crt, never its key. On-prem with your own PKI: set `issuerRef` to your cert-manager Issuer or
# ClusterIssuer (CA, Vault, ...) and `caSecret` to a Secret holding its root as `ca.crt`.
internalTls:
  issuerRef: {}                     # e.g. {name: corp-ca, kind: ClusterIssuer}
  caSecret: ""                      # default: <release>-internal-ca
  caDuration: 87600h                # the chart's own root: ten years
  duration: 8760h                   # each server certificate: a year, renewed 30 days before
  renewBefore: 720h

centrifugo:
  replicas: 1                       # more than one needs the Valkey engine: valkeyHa (ADR-038)
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}

# --- Keycloak (identity, ADR-006) ---------------------------------------------------------------------
keycloak:
  replicas: 1
  # base = settings, roles and clients only (production); dev = plus demo users/orgs (never prod).
  realmImport: base
  # Route /auth/admin publicly (gateway mode). Off in production: SupportX manages its users;
  # the dev profile turns it on for the e2e suite. Plain Ingress cannot block it (WP-014b).
  exposeAdmin: false
  # Upgrade step (D-078, branding.md): a Job per revision gives the realm the SupportX login
  # theme when it has none. A theme someone chose (incl. a tenant's own) is never overwritten.
  setLoginTheme: true
  # Upgrade step (WP-039, ADR-036): a Job per revision makes sure the `supportx-identity`
  # service account (least-privileged admin roles) exists with the secret
  # `keycloak-identity-secret`, login events are on and the SSO session fits SupportX's. With
  # `keycloak-realm-secret` it also makes `supportx-realm` (manage-realm only), the account the
  # consumers worker applies the password policy with. With `keycloak-events-client-secret` it
  # makes `supportx-events` (view-events only), which the consumers worker reads login events with.
  setUpIdentityAdmin: true
  # The breached-password list (supportx-breached.txt) comes from this release's backend image.
  # A larger list of your own: a ConfigMap in the release namespace holding a file of that name,
  # named here (kubectl create configmap my-lists --from-file=supportx-breached.txt). A
  # ConfigMap holds at most 1 MiB, like the release itself (lane C, #471).
  passwordBlacklists:
    configMap: ""
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "2", memory: 1536Mi}

# Several tenants share this installation's Keycloak realm (the SaaS cell, WP-014d). A security
# guard (D-098): single sign-on then routes only email domains whose ownership was proved.
# Leave false for single-tenant installations (on-prem).
multiTenant: false

# On-prem directory sign-in (WP-040, D-118; product owner 2026-11-03). On: the keycloak-identity
# Job makes `supportx-federation` (manage-realm only) with the app secret's
# `keycloak-federation-secret`, and only the consumers worker holds it, to write the AD/LDAP
# connection an admin sets up into the realm. Off (the default; never on SaaS): no such account,
# and an existing one is switched off. Refused together with `multiTenant: true`: in a shared
# realm a directory's people would be visible to every tenant.
directory:
  ldap:
    enabled: false

# Outgoing mail (WP-039, D-089 D3, D-099): the one place mail is configured. SupportX sends
# through it, and the keycloak-identity Job writes the same server into Keycloak's realm (password
# and invitation e-mails). Empty host = not configured. The password, if any, is the app secret's
# `mail-smtp-password` key.
mail:
  smtpHost: ""
  smtpPort: 587
  smtpSecurity: starttls            # starttls | tls | none
  smtpUsername: ""
  fromAddress: ""
  fromName: SupportX

# DEV ONLY: a mail catcher (Mailpit, as in the Compose stack) that takes every e-mail and sends
# none, so the e2e suite can read invitations, password links, notifications and scheduled
# reports. Off by default; values-dev.yaml turns it on and points `mail` at it. Never enable it
# in a SaaS or on-prem profile: real mail goes to the customer's own server.
mailCatcher:
  enabled: false
  devNodePort: 0                    # >0: the web UI and API on this NodePort (dev, for the e2e suite)
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

# --- routing (D2: Gateway API, plain Ingress as the supported fallback) ----------------------------
routing:
  mode: gateway                     # gateway | ingress | none
  hostnames: []                     # empty = every host that reaches the gateway
  # HTTPS at the gateway (audit row 5; docs/deployment.md "Transport security"). On by default:
  # browsers carry the session cookie and every password over this hop. Turn it off only where
  # something in front already terminates TLS, or on the local k3d cluster (values-dev.yaml).
  tls:
    enabled: true
    # The kubernetes.io/tls Secret the HTTPS listener serves: your own certificate (on-prem), or
    # where cert-manager writes one when `issuerRef` is set (default name then: <release>-tls).
    # The older routing.gateway.tlsSecret / routing.ingress.tlsSecret still work.
    secretName: ""
    # A cert-manager Issuer or ClusterIssuer (e.g. {name: letsencrypt, kind: ClusterIssuer}):
    # the chart then asks it for a certificate for `hostnames` (or publicUrl's host).
    issuerRef: {}
    # Plain HTTP answers only with a 301 to https (gateway mode). Ingress mode: Traefik serves the
    # app on HTTPS only and ingress-nginx redirects (see routing.ingress.enforcesHttps).
    redirectHttp: true
  gateway:
    create: true                    # false = attach the routes to an existing Gateway
    name: ""                        # default: <release>
    namespace: ""                   # default: release namespace
    className: traefik
    # Plain HTTP: the only listener with routing.tls off, else only the redirect to https.
    listenerName: web
    port: 8000                      # Traefik's web entrypoint inside the cluster
    # HTTPS (routing.tls.enabled).
    tlsListenerName: websecure
    tlsPort: 8443                   # Traefik's websecure entrypoint inside the cluster
    tlsSecret: ""                   # older name of routing.tls.secretName
  ingress:
    className: traefik
    annotations: {}
    # With routing.tls on, the chart keeps the app off plain HTTP for the classes it knows
    # (traefik: websecure only; nginx: redirect to https). Any other class: make it redirect or
    # refuse http yourself, then set this to true, or the chart refuses to render.
    enforcesHttps: false
    tlsSecret: ""                   # older name of routing.tls.secretName

# --- observability ------------------------------------------------------------------------------------
metrics:
  # Every SupportX pod serves /metrics on 9464 (internal only). With the Prometheus Operator CRDs
  # present the chart creates PodMonitors, else it annotates the pods for plain Prometheus.
  podMonitors: auto                 # auto | true | false

networkPolicies:
  enabled: true
  # Where the gateway / ingress controller runs (Traefik is in kube-system on k3s).
  ingressNamespace: kube-system
  # Egress allow-list (WP-014b; templates/networkpolicies-egress.yaml). Off: egress is open.
  # On: DNS and this namespace only, plus the rules below (NetworkPolicy `egress` rules, i.e.
  # `to` with ipBlock CIDRs and `ports`). List here every outside address SupportX must reach.
  egress:
    enabled: false
    extra: []                       # every pod, e.g. a forward proxy: [{to: [{ipBlock: {cidr: 10.0.0.5/32}}], ports: [{protocol: TCP, port: 3128}]}]
    components: {}                  # per component, e.g. {keycloak: [LDAP servers], consumers: [SMTP relay], api: [...]}
    # The database's pods only (CloudNativePG instances carry no component label): an external
    # backup target, e.g. [{to: [{ipBlock: {cidr: 10.0.0.9/32}}], ports: [{protocol: TCP, port: 443}]}].
    database: []
    # The Kubernetes API, for CloudNativePG's pods and the API and worker pods' wait-for-migrate.
    # Empty: read from the default/kubernetes EndpointSlice at install time. `helm template` and
    # GitOps can't read it: set them, e.g. kubeApiCidrs: [10.0.0.10/32], kubeApiPorts: [6443].
    kubeApiCidrs: []
    kubeApiPorts: [6443]
    # More DNS server addresses every pod may reach on port 53, as CIDRs. NodeLocal DNSCache
    # (D-163, deploy/k3s/node-local-dns.sh) answers from the node's own network on a link-local
    # address and on the kube-dns Service address itself, so the kube-dns pod rule above no
    # longer matches its answers' path: values-ha.yaml lists both (k3s's default kube-dns address).
    dnsAddresses: []

# Extra annotations on SupportX's own pods (make deploy-dev sets one per build: dev images keep
# the same tag, so this is what rolls them).
# High availability (WP-014b; values-ha.yaml turns it on). Off: one copy of each component,
# scheduled anywhere, as a single-node install needs.
ha:
  enabled: false
  # "hard": never two copies of a component on one node (3 nodes or more); "soft": prefer not to.
  antiAffinity: hard
  # Kept during a voluntary disruption (a node drain, an upgrade) for every component running
  # more than one copy.
  minAvailable: 1
  # Seconds the single-copy workers (fan-out, custom field indexes) stay on a NotReady or
  # unreachable node before Kubernetes evicts them; 0 = Kubernetes' default (300 s).
  # values-ha.yaml sets it.
  fastEvictionSeconds: 0

podAnnotations: {}

podSecurity:
  runAsUser: 10001
  fsGroup: 10001
