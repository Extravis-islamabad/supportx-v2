# Standard high availability (WP-014b, D-038): three nodes or more, any one of which may be lost.
# Install with your own host and certificate, e.g.
#   helm install supportx deploy/helm/supportx -n supportx \
#     -f deploy/helm/supportx/values-ha.yaml \
#     --set publicUrl=https://supportx.example.com \
#     --set routing.hostnames={supportx.example.com} \
#     --set routing.tls.secretName=supportx-tls
# Copies of a component never share a node (ha.antiAffinity hard), every component with more
# than one copy has a PodDisruptionBudget, and the API scales on CPU. Still to come in WP-014b:
# backups and the restore runbook. Images are INTERNAL/DEV builds (D-038).
#
# Cluster requirements, checked by deploy/k3s/ha-preflight.sh (read-only; warns, never changes):
#   - three or more nodes that take workloads;
#   - cluster DNS: at least two copies on different nodes (k3s ships one). With one, losing its
#     node stops every name lookup for about five minutes and Valkey's sentinels, which find each
#     other by hostname, cannot fail over (Cluster run 43082299609). On k3s run
#     deploy/k3s/cluster-dns-ha.sh once per cluster and after every k3s upgrade: it scales
#     kube-system/coredns to 2 with required pod anti-affinity on kubernetes.io/hostname
#     (k3s's CoreDNS is a plain manifest, so a HelmChartConfig does not reach it). On another
#     distribution, do the same to its DNS deployment (kubeadm, RKE2 and managed clusters
#     usually run two copies already; check they sit on different nodes);
#   - the CloudNativePG operator with two copies on different nodes (deploy/k3d/prereqs.sh);
#   - the ingress: two copies on different nodes. k3s ships one Traefik copy: copy
#     deploy/k3s/traefik-ha.yaml into /var/lib/rancher/k3s/server/manifests/ (a HelmChartConfig,
#     kept through restarts) and check with deploy/k3s/traefik-ha.sh;
#   - object storage: the bundled SeaweedFS (objectStorage.mode seaweedfs) is ONE copy, not HA.
#     Point the chart at your own S3-compatible store (objectStorage.mode external; the preflight
#     warns, advisory only, while the bundled one runs). docs/deployment.md, Profiles, lists what
#     runs how many copies.
# Recommended, not required: node-monitor-grace-period 20 s on kube-controller-manager (k3s:
# deploy/k3s/config-ha.yaml; CI runs it). A lost node's endpoints (CoreDNS, pooler, API) then
# drop in about 20 s instead of 40-50 s; pods still move only after the default 300 s
# toleration. Whatever you set, the DNS failover window (about the grace period) must stay inside
# Sentinel's 10 x valkeyHa.downAfterMilliseconds (100 s): docs/deployment.md, Profiles.

ha:
  enabled: true
  antiAffinity: hard
  minAvailable: 1
  # The fan-out (ADR-023: exactly one copy, its merge windows are in memory) and the custom field
  # index worker (D-088: one builder behind a lock) cannot run a second copy to take over. Without
  # this, a pod on a lost node is evicted only after Kubernetes' default 300 s toleration; live
  # updates stop for those five minutes. 30 s after the node goes NotReady (about 20 s with
  # deploy/k3s/config-ha.yaml) they are evicted and start elsewhere: about 50 s in all. Not
  # shorter: a brief network blip would then move them for nothing. Screens reconcile by refetch
  # when the realtime connection comes back (architecture.md §8.3).
  fastEvictionSeconds: 30

api:
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 6, targetCPUPercent: 70}

web:
  replicas: 2

# Several relays share the outbox (FOR UPDATE SKIP LOCKED); several consumers share each
# durable consumer. The fan-out and the custom field index worker stay single by design
# (ADR-023, D-088): a rollout surges the new copy first.
relay:
  replicas: 2

consumers:
  replicas: 2

slaTimers:
  replicas: 2

# The workflow timers share Temporal's task queue like the SLA timers; a repeated task is a no-op.
workflowTimers:
  replicas: 2

# Infinispan between the copies (the chart switches the cache stack above one replica).
keycloak:
  replicas: 2

# One primary and two standbys; CloudNativePG fails over to a standby by itself.
postgresql:
  cnpg:
    instances: 3
    # PgBouncer is every API request's way to the database: two copies on different nodes, and
    # dead server connections dropped in 10 s (the node-loss test lost the only copy).
    pooler:
      instances: 2
      tcpUserTimeoutMs: "10000"

# A three-server NATS cluster; streams keep three replicas. Required anti-affinity: two servers
# on one node would lose JetStream's quorum (2 of 3) with that node. The upstream chart's own
# pod-template merge (nats 2.15.1, podTemplate.merge, not templated, so its selector labels are
# written out: app.kubernetes.io/name and component are both "nats"; the rule is per namespace).
# TLS (audit row 5) for the clients (the app's tls:// URL) and between the servers (routes,
# always mutual in NATS), with one certificate from the internal CA (internalTls). Its name is
# fixed here because the NATS chart takes it as a plain value: <release>-nats-tls for the release
# name "supportx". The monitoring port (8222: probes, the exporter) stays plain http inside the
# pod network.
nats:
  config:
    nats:
      tls:
        enabled: true
        secretName: supportx-nats-tls
    cluster:
      enabled: true
      replicas: 3
      tls:
        enabled: true
        secretName: supportx-nats-tls
        merge:
          # The peers' certificates are checked against the internal CA (cert-manager writes
          # ca.crt beside the certificate).
          ca_file: /etc/nats-certs/cluster/ca.crt
  podTemplate:
    merge:
      spec:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nats
                    app.kubernetes.io/component: nats

# Valkey with Sentinel (ADR-038): three pods, each a server and a sentinel; the app follows a
# failover by itself. It replaces the bundled single Valkey.
valkey:
  enabled: false
valkeyHa:
  enabled: true
  # TLS only (audit row 5): certificates from the chart's internal CA through cert-manager, a
  # prerequisite of this profile like the CloudNativePG operator (deploy/k3d/prereqs.sh).
  tls:
    enabled: true

# Malware scanning: two clamd copies on different nodes, so uploads keep being scanned when a node
# is lost (files wait as "scanning" while no scanner answers). Each copy pulls its own signatures;
# the chart staggers their freshclam checks so the mirror never takes two at once.
clamav:
  replicas: 2

# Realtime: three copies sharing the Valkey engine through the sentinels.
centrifugo:
  replicas: 3

# Temporal on this cluster, two server pods (their membership shares the work).
temporal:
  bundled:
    enabled: true
    replicas: 2
