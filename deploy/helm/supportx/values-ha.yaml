# Standard high availability (WP-014b, D-038): three nodes or more, any one of which may be lost.
# Install with your own host and certificate, e.g.
#   helm install supportx deploy/helm/supportx -n supportx \
#     -f deploy/helm/supportx/values-ha.yaml \
#     --set publicUrl=https://supportx.example.com \
#     --set routing.hostnames={supportx.example.com} \
#     --set routing.tls.secretName=supportx-tls
# Copies of a component never share a node (ha.antiAffinity hard), every component with more
# than one copy has a PodDisruptionBudget, and the API scales on CPU. Still to come in WP-014b:
# backups and the restore runbook. Images are INTERNAL/DEV builds (D-038).

ha:
  enabled: true
  antiAffinity: hard
  minAvailable: 1

api:
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 6, targetCPUPercent: 70}

web:
  replicas: 2

# Several relays share the outbox (FOR UPDATE SKIP LOCKED); several consumers share each
# durable consumer. The fan-out and the custom field index worker stay single by design
# (ADR-023, D-088): a rollout surges the new copy first.
relay:
  replicas: 2

consumers:
  replicas: 2

slaTimers:
  replicas: 2

# Infinispan between the copies (the chart switches the cache stack above one replica).
keycloak:
  replicas: 2

# One primary and two standbys; CloudNativePG fails over to a standby by itself. Every app
# connection verify-full against the cluster's own CA (audit row 5), through PgBouncer too; set
# here as well as in values.yaml because the HA tests sit on values-dev.yaml, which turns it off.
postgresql:
  tls:
    verify: true
  cnpg:
    instances: 3
    # PgBouncer is every API request's way to the database: two copies on different nodes, and
    # dead server connections dropped in 10 s (the node-loss test lost the only copy).
    pooler:
      instances: 2
      tcpUserTimeoutMs: "10000"

# A three-server NATS cluster; streams keep three replicas. TLS (audit row 5) for the clients
# (the app's tls:// URL) and between the servers (routes, always mutual in NATS), with one
# certificate from the internal CA (internalTls). Its name is fixed here because the NATS chart
# takes it as a plain value: <release>-nats-tls for the release name "supportx". The monitoring
# port (8222: probes, the exporter) stays plain http inside the pod network.
nats:
  config:
    nats:
      tls:
        enabled: true
        secretName: supportx-nats-tls
    cluster:
      enabled: true
      replicas: 3
      tls:
        enabled: true
        secretName: supportx-nats-tls
        merge:
          # The peers' certificates are checked against the internal CA (cert-manager writes
          # ca.crt beside the certificate).
          ca_file: /etc/nats-certs/cluster/ca.crt

# Valkey with Sentinel (ADR-038): three pods, each a server and a sentinel; the app follows a
# failover by itself. It replaces the bundled single Valkey.
valkey:
  enabled: false
valkeyHa:
  enabled: true
  # TLS only (audit row 5): certificates from the chart's internal CA through cert-manager, a
  # prerequisite of this profile like the CloudNativePG operator (deploy/k3d/prereqs.sh).
  tls:
    enabled: true

# Realtime: three copies sharing the Valkey engine through the sentinels.
centrifugo:
  replicas: 3

# Temporal on this cluster, two server pods (their membership shares the work).
temporal:
  bundled:
    enabled: true
    replicas: 2
