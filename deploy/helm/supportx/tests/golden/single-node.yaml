---
# Source: supportx/templates/clamav.yaml
# Malware scanning for files (WP-022, D-082 D3, ADR-028 item 3). clamd answers INSTREAM on 3310 to
# the consumers worker only (network policy); a freshclam sidecar keeps the signatures current from
# the public mirrors or a private one; air-gapped sites load the offline bundle into the volume
# (deploy/scripts/clamav-signatures.sh). Runs as the image's `clamav` user (1000), our own config:
# the image's start script needs root, so it is not used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportx-clamav
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: clamav
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
data:
  clamd.conf: |
    Foreground yes
    TCPSocket 3310
    DatabaseDirectory /var/lib/clamav
    TemporaryDirectory /tmp
    LogTime yes
    # Files up to 100 MB (D-082 D7), with headroom.
    StreamMaxLength 101M
    MaxFileSize 101M
    MaxScanSize 400M
    # New signatures from the sidecar are picked up within 10 minutes; one copy in memory.
    SelfCheck 600
    ConcurrentDatabaseReload no
  freshclam.conf: |
    Foreground yes
    DatabaseDirectory /var/lib/clamav
    Checks 12
    DatabaseMirror database.clamav.net

---
# Source: supportx/templates/configmap-env.yaml
# Non-secret SUPPORTX_* settings shared by the API and the workers (app/core/config.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportx-env
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: config
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
data:
  SUPPORTX_PROFILE: "production"
  SUPPORTX_LOG_LEVEL: "info"
  # The browser's URLs (D3): console at /, portal at /portal.
  SUPPORTX_CONSOLE_URL: "https://supportx.example.com"
  SUPPORTX_PORTAL_URL: "https://supportx.example.com/portal"
  # Keycloak: public issuer for browsers and token checks; the API itself uses the in-cluster
  # address (back channel).
  SUPPORTX_OIDC_ISSUER: "https://supportx.example.com/auth/realms/supportx"
  SUPPORTX_OIDC_INTERNAL_URL: "http://supportx-keycloak:8080/auth/realms/supportx"
  SUPPORTX_CENTRIFUGO_API_URL: "http://supportx-centrifugo:8000"
  SUPPORTX_EVENTS_STREAM_REPLICAS: "1"
  # /metrics (and the workers' /healthz, /readyz) on the internal port (WP-014).
  SUPPORTX_METRICS_EXPORTER: prometheus
  SUPPORTX_METRICS_HOST: "0.0.0.0"
  SUPPORTX_METRICS_PORT: "9464"
  SUPPORTX_ENTITLEMENT_PROVIDER: "subscription"
  # Object storage (S3 API, D-016): the release's SeaweedFS or an external S3 (WP-018).
  SUPPORTX_OBJECT_STORAGE_ENDPOINT: "http://supportx-seaweedfs:8333"
  SUPPORTX_OBJECT_STORAGE_BUCKET: "supportx"
  SUPPORTX_OBJECT_STORAGE_REGION: "us-east-1"
  SUPPORTX_AUDIT_TRUSTED_KEYS: ""
  # Files (WP-022): the release's clamd, and whether files wait for it.
  SUPPORTX_FILES_SCAN_REQUIRED: "true"
  SUPPORTX_FILES_CLAMD_ADDRESS: "supportx-clamav:3310"

