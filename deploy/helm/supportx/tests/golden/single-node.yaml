# Source: supportx/templates/migrate-job.yaml
# One Job per Helm revision (ADR-025): roles + database from tooling/sql, then Alembic. Not a
# Helm hook: a pre-install hook would run before the in-cluster PostgreSQL exists, and a
# post-install hook would deadlock with --wait. The API and workers of this revision wait for it
# in an init container instead (tooling/wait_for_job.py). Re-running is safe; a database already
# migrated by a newer release is left alone (rollback), nothing is ever downgraded.
apiVersion: batch/v1
kind: Job
metadata:
  name: supportx-migrate-1
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: migrate
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supportx
        app.kubernetes.io/instance: supportx
        app.kubernetes.io/component: migrate
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: supportx
        helm.sh/chart: supportx-0.1.0
    spec:
      restartPolicy: Never
      serviceAccountName: supportx-migrate
      automountServiceAccountToken: false
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/devhat-pm/supportx-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python -m tooling.deploy_migrate
          env:
            - name: SUPPORTX_PROFILE
              value: "production"
            - name: SUPPORTX_DEPLOY_DATABASE
              value: "supportx"
            - name: SUPPORTX_SECRET_MIGRATOR_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-app, key: migrator-db-password}}
            - name: SUPPORTX_MIGRATION_DATABASE_URL
              value: "postgresql://supportx_migrator:$(SUPPORTX_SECRET_MIGRATOR_DB_PASSWORD)@supportx-pg-rw:5432/supportx"
            # Superuser only here, only to create roles, the database and extensions.
            - name: SUPPORTX_SECRET_PG_SUPERUSER_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-pg-superuser, key: password}}
            - name: SUPPORTX_DEPLOY_ADMIN_URL
              value: "postgresql://postgres:$(SUPPORTX_SECRET_PG_SUPERUSER_PASSWORD)@supportx-pg-rw:5432/postgres"
            - name: SUPPORTX_DEPLOY_CNPG_POOLER
              value: "1"
            - name: SUPPORTX_DEPLOY_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-app, key: app-db-password}}
            - name: SUPPORTX_DEPLOY_MIGRATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-app, key: migrator-db-password}}
            - name: SUPPORTX_DEPLOY_RELAY_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-app, key: relay-db-password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}

