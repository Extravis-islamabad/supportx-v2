# Source: supportx/templates/postgresql.yaml
# PostgreSQL 16 + pgvector through the CloudNativePG operator (D1, D-037). The bootstrap database
# is Keycloak's; SupportX's own roles and database come from tooling/sql via the migrate Job
# (one source with the dev stack and CI). Backups and replicas: WP-014b.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: supportx-pg
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-202610190958-standard-trixie
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: supportx-db-keycloak
  postgresql:
    parameters:
      effective_cache_size: "6GB"
      max_connections: "200"
      shared_buffers: "2GB"
  storage:
    size: 100Gi
  walStorage:
    size: 20Gi
  resources:
    limits:
      cpu: "3"
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 4Gi

