# Source: supportx/templates/centrifugo.yaml
# Realtime gateway (ADR-005, ADR-023). Same options as the dev stack's config.json; the browser
# reaches it on the public host at /connection and /emulation (D3). Secrets only through env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportx-centrifugo
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: centrifugo
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
data:
  config.json: |
    {
      "client": {
        "allowed_origins": ["https://supportx.example.com"],
        "token": {"audience": "supportx-realtime", "issuer": "supportx-api"},
        "channel_limit": 256
      },
      "channel": {
        "namespace_boundary": "|",
        "without_namespace": {
          "history_size": 100,
          "history_ttl": "300s",
          "force_recovery": true,
          "allow_presence_for_subscriber": true,
          "presence": true
        }
      },
      "sse": {"enabled": true},
      "http_stream": {"enabled": true},
      "http_api": {},
      "prometheus": {"enabled": true},
      "health": {"enabled": true},
      "log": {"level": "info"}
    }

---
# Source: supportx/templates/configmap-env.yaml
# Non-secret SUPPORTX_* settings shared by the API and the workers (app/core/config.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportx-env
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: config
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
data:
  SUPPORTX_PROFILE: "production"
  SUPPORTX_LOG_LEVEL: "info"
  # The browser's URLs (D3): console at /, portal at /portal.
  SUPPORTX_CONSOLE_URL: "https://supportx.example.com"
  SUPPORTX_PORTAL_URL: "https://supportx.example.com/portal"
  # Keycloak: public issuer for browsers and token checks; the API itself uses the in-cluster
  # address (back channel).
  SUPPORTX_OIDC_ISSUER: "https://supportx.example.com/auth/realms/supportx"
  SUPPORTX_OIDC_INTERNAL_URL: "http://supportx-keycloak:8080/auth/realms/supportx"
  SUPPORTX_CENTRIFUGO_API_URL: "http://supportx-centrifugo:8000"
  SUPPORTX_EVENTS_STREAM_REPLICAS: "1"
  # /metrics (and the workers' /healthz, /readyz) on the internal port (WP-014).
  SUPPORTX_METRICS_EXPORTER: prometheus
  SUPPORTX_METRICS_HOST: "0.0.0.0"
  SUPPORTX_METRICS_PORT: "9464"
  SUPPORTX_ENTITLEMENT_PROVIDER: "subscription"
  # Object storage (S3 API, D-016): the release's SeaweedFS or an external S3 (WP-018).
  SUPPORTX_OBJECT_STORAGE_ENDPOINT: "http://supportx-seaweedfs:8333"
  SUPPORTX_OBJECT_STORAGE_BUCKET: "supportx"
  SUPPORTX_OBJECT_STORAGE_REGION: "us-east-1"
  SUPPORTX_AUDIT_TRUSTED_KEYS: ""

---
# Source: supportx/templates/keycloak.yaml
# Keycloak (ADR-006) on the public host at /auth (D3). The API talks to it inside the cluster
# (SUPPORTX_OIDC_INTERNAL_URL); Keycloak keeps the public issuer for browsers and tokens.
# The realm file is imported on first start only; an existing realm is never overwritten.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportx-keycloak-realm
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: keycloak
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
data:
  supportx-realm.json: |
    {
      "realm": "supportx",
      "displayName": "SupportX",
      "enabled": true,
      "organizationsEnabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "rememberMe": false,
      "editUsernameAllowed": false,
      "internationalizationEnabled": true,
      "supportedLocales": [
        "en",
        "ar",
        "ur"
      ],
      "defaultLocale": "en",
      "passwordPolicy": "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername(undefined) and notEmail(undefined) and passwordHistory(3)",
      "bruteForceProtected": true,
      "permanentLockout": false,
      "failureFactor": 5,
      "waitIncrementSeconds": 60,
      "maxFailureWaitSeconds": 900,
      "maxDeltaTimeSeconds": 43200,
      "minimumQuickLoginWaitSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 43200,
      "revokeRefreshToken": false,
      "roles": {
        "realm": [
          {
            "name": "tenant_admin",
            "description": "Administers the tenant's SupportX configuration."
          },
          {
            "name": "technician",
            "description": "Works tickets in the technician console."
          },
          {
            "name": "requester",
            "description": "Raises and follows requests in the self-service portal."
          }
        ]
      },
      "clients": [
        {
          "clientId": "supportx-console",
          "name": "SupportX Console",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${SUPPORTX_KC_CONSOLE_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": false,
          "redirectUris": [
            "${SUPPORTX_KC_CONSOLE_ORIGIN}/api/v1/auth/callback"
          ],
          "webOrigins": [],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "${SUPPORTX_KC_CONSOLE_ORIGIN}/*",
            "backchannel.logout.session.required": "true",
            "use.refresh.tokens": "true"
          },
          "protocolMappers": [
            {
              "name": "organization-membership",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-organization-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "supportx_organizations",
                "jsonType.label": "JSON",
                "multivalued": "true",
                "addOrganizationAttributes": "true",
                "addOrganizationId": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "supportx_roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "supportx-portal",
          "name": "SupportX Portal",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${SUPPORTX_KC_PORTAL_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": false,
          "redirectUris": [
            "${SUPPORTX_KC_PORTAL_ORIGIN}/api/v1/auth/callback"
          ],
          "webOrigins": [],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "${SUPPORTX_KC_PORTAL_ORIGIN}/*",
            "backchannel.logout.session.required": "true",
            "use.refresh.tokens": "true"
          },
          "protocolMappers": [
