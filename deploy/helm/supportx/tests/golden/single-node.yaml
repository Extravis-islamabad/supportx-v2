# Minimal single-node SeaweedFS (S3 API) for on-prem installs (ADR-012, D-076; WP-018). One pod
# runs master, volume, filer and the S3 gateway; data on one volume. HA object storage, backups and
# lifecycle rules come with WP-014b. Credentials: the app Secret's `seaweedfs-s3-config`.
apiVersion: v1
kind: Service
metadata:
  name: supportx-seaweedfs
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: seaweedfs
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
spec:
  selector:
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: seaweedfs
  ports:
    - {name: s3, port: 8333, targetPort: s3}

