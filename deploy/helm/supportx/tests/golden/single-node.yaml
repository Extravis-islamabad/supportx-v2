# Source: supportx/templates/routing.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supportx
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: routing
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
spec:
  parentRefs:
    - name: supportx
      namespace: supportx
      sectionName: websecure
  hostnames:
    - supportx.example.com
  rules:
    # Keycloak's admin console and admin API stay off the public host.
    - matches:
        - path: {type: PathPrefix, value: /auth/admin}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: {type: ReplaceFullPath, replaceFullPath: /}
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: supportx-api
          port: 8000
    - matches:
        - path: {type: PathPrefix, value: /connection}
      backendRefs:
        - name: supportx-centrifugo
          port: 8000
    - matches:
        - path: {type: PathPrefix, value: /emulation}
      backendRefs:
        - name: supportx-centrifugo
          port: 8000
    - matches:
        - path: {type: PathPrefix, value: /auth}
      backendRefs:
        - name: supportx-keycloak
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: supportx-web
          port: 8080

