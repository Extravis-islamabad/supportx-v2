data:
  supportx-realm.json: |
    {
      "realm": "supportx",
      "displayName": "SupportX",
      "loginTheme": "supportx",
      "enabled": true,
      "organizationsEnabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "rememberMe": false,
      "editUsernameAllowed": false,
      "internationalizationEnabled": true,
      "supportedLocales": [
        "en",
        "ar",
        "ur"
      ],
      "defaultLocale": "en",
      "passwordPolicy": "length(12) and maxLength(128) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername and notEmail and passwordHistory(5) and passwordBlacklist(supportx-breached.txt)",
      "bruteForceProtected": true,
      "bruteForceStrategy": "LINEAR",
      "permanentLockout": false,
      "failureFactor": 5,
      "waitIncrementSeconds": 900,
      "maxFailureWaitSeconds": 3600,
      "maxDeltaTimeSeconds": 43200,
      "minimumQuickLoginWaitSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 43200,
      "revokeRefreshToken": false,
      "roles": {
        "realm": [
          {
            "name": "tenant_admin",
            "description": "Administers the tenant's SupportX configuration."
          },
          {
            "name": "technician",
            "description": "Works tickets in the technician console."
          },
          {
            "name": "requester",
            "description": "Raises and follows requests in the self-service portal."
          }
        ]
      },
      "clients": [
        {
          "clientId": "supportx-console",
          "name": "SupportX Console",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${SUPPORTX_KC_CONSOLE_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": false,
          "redirectUris": [
            "${SUPPORTX_KC_CONSOLE_ORIGIN}/api/v1/auth/callback"
          ],
          "webOrigins": [],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "${SUPPORTX_KC_CONSOLE_ORIGIN}/*",
            "backchannel.logout.session.required": "true",
            "use.refresh.tokens": "true"
          },
          "protocolMappers": [
            {
              "name": "organization-membership",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-organization-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "supportx_organizations",
                "jsonType.label": "JSON",
                "multivalued": "true",
                "addOrganizationAttributes": "true",
                "addOrganizationId": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "supportx_roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "supportx-portal",
          "name": "SupportX Portal",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${SUPPORTX_KC_PORTAL_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": false,
          "redirectUris": [
            "${SUPPORTX_KC_PORTAL_ORIGIN}/api/v1/auth/callback"
          ],
          "webOrigins": [],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "${SUPPORTX_KC_PORTAL_ORIGIN}/*",
            "backchannel.logout.session.required": "true",
            "use.refresh.tokens": "true"
          },
          "protocolMappers": [
            {
              "name": "organization-membership",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-organization-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "supportx_organizations",
                "jsonType.label": "JSON",
                "multivalued": "true",
                "addOrganizationAttributes": "true",
                "addOrganizationId": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "supportx_roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true",
                "userinfo.token.claim": "false"
              }
            }
          ]
        }
      ]
    }
    

---
# Source: supportx/templates/keycloak.yaml
# SupportX login theme (docs/architecture/branding.md): text files as data, images as binaryData.
# ConfigMap keys cannot hold "/", so each file's key is its path with "/" as "__" and the volume
# below puts it back at its path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supportx-keycloak-theme
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: keycloak
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
data:
  email__html__executeActions.ftl: |
    <#-- SupportX (WP-039 session 2, D-099): set-password e-mail for invitations and resets, in the
         tenant's brand from attributes SupportX sets before sending (escaped: HTML output). -->
    <#assign kind = (user.attributes.sx_mail_kind)!"reset">
    <#assign brandName = (user.attributes.sx_brand_name)!realmName>
    <#assign brandLogo = (user.attributes.sx_brand_logo)!"">
    <#assign brandColour = (user.attributes.sx_brand_colour)!"#7e40d1">
    <#assign rtl = !(ltr!true)>
    <#assign start = rtl?then("right", "left")>
    <html lang="${locale.language}" dir="${rtl?then('rtl','ltr')}">
    <body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#262626;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;">
    <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;">
    <tr><td style="padding:20px 24px;text-align:${start};">
    <#if brandLogo?has_content><img src="${brandLogo}" alt="${brandName}" height="40" style="display:block;height:40px;width:auto;border:0"><#else><span style="font-size:20px;font-weight:bold;">${brandName}</span></#if>
    </td></tr>
    <tr><td style="height:4px;background:${brandColour};"></td></tr>
    <tr><td style="padding:24px;font-size:15px;line-height:1.6;text-align:${start};">
    <p>${msg("supportx." + kind + ".intro", brandName)}</p>
    <p style="margin:24px 0;"><a href="${link}" style="background:${brandColour};color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block;">${msg("supportx." + kind + ".button")}</a></p>
    <p>${msg("supportx.expiry", linkExpirationFormatter(linkExpiration))}</p>
    <p style="color:#595959;font-size:13px;">${msg("supportx." + kind + ".ignore")}</p>
    </td></tr>
    </table></td></tr></table>
    </body>
    </html>
    
  email__messages__messages_ar.properties: |
    # SupportX e-mail texts (WP-039 session 2, D-099).
    executeActionsSubject=عيّن كلمة المرور
    supportx.invitation.intro=تدعوك {0} إلى مكتب الخدمة الخاص بها. عيّن كلمة مرور لتسجيل الدخول.
    supportx.invitation.button=تعيين كلمة المرور
    supportx.invitation.ignore=إذا لم تكن تتوقع هذه الدعوة فتجاهل هذه الرسالة.
    supportx.reset.intro=طلب أحدهم إعادة تعيين كلمة مرورك لدى {0}.
    supportx.reset.button=اختيار كلمة مرور جديدة
    supportx.reset.ignore=إذا لم تطلب ذلك فتجاهل هذه الرسالة: تبقى كلمة مرورك كما هي.
    supportx.expiry=يعمل الرابط مرة واحدة خلال {0}.
    
  email__messages__messages_en.properties: |
    # SupportX e-mail texts (WP-039 session 2, D-099).
    executeActionsSubject=Set your password
    supportx.invitation.intro={0} invites you to its service desk. Set a password to sign in.
    supportx.invitation.button=Set my password
    supportx.invitation.ignore=If you did not expect this invitation, ignore this message.
    supportx.reset.intro=Someone asked to reset your password for {0}.
    supportx.reset.button=Choose a new password
    supportx.reset.ignore=If you did not ask for this, ignore this message: your password stays as it is.
    supportx.expiry=The link works once, for {0}.
    
  email__messages__messages_ur.properties: |
    # SupportX e-mail texts (WP-039 session 2, D-099).
    executeActionsSubject=اپنا پاس ورڈ مقرر کریں
    supportx.invitation.intro={0} آپ کو اپنے سروس ڈیسک پر مدعو کرتا ہے۔ سائن اِن کے لیے پاس ورڈ مقرر کریں۔
    supportx.invitation.button=میرا پاس ورڈ مقرر کریں
    supportx.invitation.ignore=اگر آپ کو اس دعوت کی توقع نہیں تھی تو یہ پیغام نظرانداز کریں۔
    supportx.reset.intro=کسی نے {0} پر آپ کا پاس ورڈ ری سیٹ کرنے کی درخواست کی۔
    supportx.reset.button=نیا پاس ورڈ منتخب کریں
    supportx.reset.ignore=اگر آپ نے یہ درخواست نہیں کی تو یہ پیغام نظرانداز کریں: آپ کا پاس ورڈ ویسا ہی رہے گا۔
    supportx.expiry=یہ لنک ایک بار، {0} کے اندر کام کرتا ہے۔
    
  email__text__executeActions.ftl: |
    <#ftl output_format="plainText">
    <#assign kind = (user.attributes.sx_mail_kind)!"reset">
    <#assign brandName = (user.attributes.sx_brand_name)!realmName>
    ${msg("supportx." + kind + ".intro", brandName)}
    
    ${link}
    
    ${msg("supportx.expiry", linkExpirationFormatter(linkExpiration))}
    
    ${msg("supportx." + kind + ".ignore")}
    
  email__theme.properties: |
    # SupportX e-mail theme (WP-039 session 2, D-099): Keycloak's password and invitation e-mails in
    # the tenant's brand, matching SupportX's own (app/shared/mail layout). SupportX sets the brand on
    # the person (sx_mail_kind, sx_brand_name, sx_brand_logo, sx_brand_colour) right before it asks
    # Keycloak to send; the person's locale picks the language.
    parent=base
    locales=en,ar,ur
    
  login__field.ftl: |
    <#-- keycloak.v2's login field.ftl from Keycloak 26.8.1, unchanged except the block marked
         "SupportX" (on a Keycloak upgrade, copy the new upstream file and put the block back;
         backend/tests/test_keycloak_theme.py checks it is there). -->
    <#macro group name label error="" required=false>
    
    <div class="${properties.kcFormGroupClass}">
        <div class="${properties.kcFormGroupLabelClass}">
            <label for="${name}" class="${properties.kcFormLabelClass}">
            <span class="${properties.kcFormLabelTextClass}">
                ${label}
            </span>
                <#if required>
                    <span class="${properties.kcInputRequiredClass}" aria-hidden="true">&#42;</span>
                </#if>
            </label>
        </div>
    
        <#nested>
    
        <div id="input-error-container-${name}">
            <#if error?has_content>
                <div class="${properties.kcFormHelperTextClass}" aria-live="polite">
                    <div class="${properties.kcInputHelperTextClass}">
                        <div class="${properties.kcInputHelperTextItemClass} ${properties.kcError}" id="input-error-${name}">
                            <span class="${properties.kcInputErrorMessageClass}">
                                ${error}
                            </span>
                        </div>
                    </div>
                </div>
            </#if>
        </div>
    </div>
    
    </#macro>
    
    <#macro errorIcon error="">
      <#if error?has_content>
        <span class="${properties.kcFormControlUtilClass}">
            <span class="${properties.kcInputErrorIconStatusClass}">
              <i class="${properties.kcInputErrorIconClass}" aria-hidden="true"></i>
            </span>
        </span>
      </#if>
    </#macro>
    
    <#macro input name label value="" required=false autocomplete="off" fieldName=name error=messagesPerField.get(fieldName) autofocus=false>
      <@group name=name label=label error=error required=required>
        <span class="${properties.kcInputClass} <#if error?has_content>${properties.kcError}</#if>">
            <input id="${name}" name="${name}" value="${value}" type="text" autocomplete="${autocomplete}" <#if autofocus>autofocus</#if>
                    <#if autocomplete == "one-time-code">inputmode="numeric"</#if>
                    aria-invalid="<#if error?has_content>true</#if>"/>
            <@errorIcon error=error/>
        </span>
      </@group>
    </#macro>
    
    <#macro password name label value="" required=false forgotPassword=false fieldName=name error=messagesPerField.get(fieldName) autocomplete="off" autofocus=false>
      <@group name=name label=label error=error required=required>
        <div class="${properties.kcInputGroup}">
          <div class="${properties.kcInputGroupItemClass} ${properties.kcFill}">
            <span class="${properties.kcInputClass} <#if error?has_content>${properties.kcError}</#if>">
              <input id="${name}" name="${name}" value="${value}" type="password" autocomplete="${autocomplete}" <#if autofocus>autofocus</#if>
                      aria-invalid="<#if error?has_content>true</#if>"/>
              <@errorIcon error=error/>
            </span>
          </div>
          <div class="${properties.kcInputGroupItemClass}">
            <button class="${properties.kcFormPasswordVisibilityButtonClass}" type="button" aria-label="${msg('showPassword')}"
                    aria-controls="${name}" data-password-toggle
                    data-icon-show="${properties.kcFormPasswordVisibilityIconShow}" data-icon-hide="${properties.kcFormPasswordVisibilityIconHide}"
                    data-label-show="${msg('showPassword')}" data-label-hide="${msg('hidePassword')}" id="${name}-show-password">
                <i class="${properties.kcFormPasswordVisibilityIconShow}" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="${properties.kcFormHelperTextClass}" aria-live="polite">
            <div class="${properties.kcInputHelperTextClass}">
                <#-- Additional helper items -->
                <#nested>
                <#-- SupportX (WP-039 session 2, D-099): "Forgot password?" leads to SupportX's page,
                     which limits requests per address (REQ-SEC-035) and asks Keycloak for its
                     set-password e-mail in the tenant's brand. Keycloak's own reset flow stays off. -->
                <#assign supportxReset = (properties.supportxPasswordResetUrl)!"">
                <#if supportxReset?has_content && name == "password">
                    <div class="${properties.kcInputHelperTextItemClass}">
                      <span class="${properties.kcInputHelperTextItemTextClass}">
                          <a id="supportx-forgot-password" href="${supportxReset}">${msg("doForgotPassword")}</a>
                      </span>
                    </div>
                <#elseif forgotPassword>
                    <div class="${properties.kcInputHelperTextItemClass}">
                      <span class="${properties.kcInputHelperTextItemTextClass}">
                          <a href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a>
                      </span>
                    </div>
                </#if>
                <#-- /SupportX -->
            </div>
        </div>
    
      </@group>
    </#macro>
    
    <#macro clipboard name label ariaLabel=label value="" readonly=true>
      <@group name=name label=label>
        <div class="${properties.kcCodeClipboardCopyClass}" id="kc-${name}-clipboard">
          <div class="${properties.kcCodeClipboardCopyGroupClass}">
            <div class="${properties.kcInputGroup}">
              <div class="${properties.kcInputGroupItemClass}">
                <button 
                  class="${properties.kcFormPasswordVisibilityButtonClass}" 
                  type="button" 
                  aria-label="${msg("code-clipboard-label")}"
                  aria-expanded="false"
                  aria-controls="kc-${name}-content"
                  data-icon-expanded-class="${properties.kcAngleDownIconClass}"
                  data-icon-collapsed-class="${properties.kcAngleRightIconClass}"
                  data-expanded-class="${properties.kcExpandedClass}"
                  id="kc-${name}-toggle"
                >
                  <i id="kc-${name}-toggle-icon" class="${properties.kcAngleRightIconClass}" aria-hidden="true"></i>
                </button>
              </div>
              <div class="${properties.kcInputGroupItemClass} ${properties.kcFill}">
                <span class="${properties.kcInputClass} <#if readonly>${properties.kcFormReadOnlyClass}</#if>">
                  <input
                    id="${name}"
                    name="${name}"
                    value="${value}"
                    type="text"
                    <#if readonly>readonly</#if>
                    aria-label="${ariaLabel}"
                  />
                </span>
              </div>
              <div class="${properties.kcInputGroupItemClass}">
                <button
                  class="${properties.kcFormPasswordVisibilityButtonClass}"
                  type="button"
                  aria-label="${msg("code-copy-label")}"
                  data-icon-success="${properties.kcCheckIconClass}"
                  data-icon-failure="${properties.kcInputErrorIconClass}"
                  data-success-label="${msg("code-copy-success")}"
                  data-failure-label="${msg("code-copy-failure")}"
                  id="kc-${name}-copy-button"
                >
                  <i id="kc-${name}-copy-icon" class="${properties.kcCopyIconClass}" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="${properties.kcCodeClipboardCopyContentClass}" id="kc-${name}-content" hidden>
            <pre><code aria-label="${ariaLabel}">${value}</code></pre>
          </div>
        </div>
      </@group>
    </#macro>
    
    <#macro checkbox name label value=false required=false>
      <div class="${properties.kcCheckboxClass}">
        <label for="${name}" class="${properties.kcCheckboxClass}">
          <input
            class="${properties.kcCheckboxInputClass}"
            type="checkbox"
            id="${name}"
            name="${name}"
            <#if value>checked</#if>
          />
          <span class="${properties.kcCheckboxLabelClass}">${label}</span>
          <#if required>
            <span class="${properties.kcCheckboxLabelRequiredClass}" aria-hidden="true">&#42;</span>
          </#if>
        </label>
      </div>
    </#macro>
  login__messages__messages_ar.properties: |
    # SupportX sign-in texts that differ from Keycloak's (WP-039 session 2, REQ-SEC-005 AC3).
    invalidPasswordBlacklistedMessage=كلمة المرور هذه شائعة جدًا أو ظهرت في تسريب بيانات. اختر غيرها.
    # One text for every failed sign-in, locked or not, known account or not (REQ-SEC-005 AC2, D-104).
    invalidUserMessage=اسم المستخدم أو كلمة المرور غير صحيحة. بعد عدة محاولات فاشلة يتوقف تسجيل الدخول مؤقتًا: انتظر 15 دقيقة على الأقل ثم حاول مجددًا.
    accountTemporarilyDisabledMessage=اسم المستخدم أو كلمة المرور غير صحيحة. بعد عدة محاولات فاشلة يتوقف تسجيل الدخول مؤقتًا: انتظر 15 دقيقة على الأقل ثم حاول مجددًا.
    accountPermanentlyDisabledMessage=اسم المستخدم أو كلمة المرور غير صحيحة. بعد عدة محاولات فاشلة يتوقف تسجيل الدخول مؤقتًا: انتظر 15 دقيقة على الأقل ثم حاول مجددًا.
    
  login__messages__messages_en.properties: |
    # SupportX sign-in texts that differ from Keycloak's (WP-039 session 2, REQ-SEC-005 AC3).
    invalidPasswordBlacklistedMessage=This password is too common or has appeared in a data breach. Choose another.
    # One text for every failed sign-in, locked or not, known account or not (REQ-SEC-005 AC2,
    # D-104): it says when to try again and never whether the account exists or is locked.
    invalidUserMessage=Invalid username or password. After several failed attempts, sign-in pauses: wait at least 15 minutes, then try again.
    accountTemporarilyDisabledMessage=Invalid username or password. After several failed attempts, sign-in pauses: wait at least 15 minutes, then try again.
    accountPermanentlyDisabledMessage=Invalid username or password. After several failed attempts, sign-in pauses: wait at least 15 minutes, then try again.
    
  login__messages__messages_ur.properties: |
    # SupportX sign-in texts in Urdu (WP-039 session 2, REQ-SEC-005 AC1, AC3). Keycloak ships no
    # Urdu: these are the password rules' messages; other texts fall back to English.
    invalidPasswordMessage=غلط پاس ورڈ۔
    invalidPasswordBlacklistedMessage=یہ پاس ورڈ بہت عام ہے یا کسی ڈیٹا لیک میں آ چکا ہے۔ کوئی اور منتخب کریں۔
    invalidPasswordConfirmMessage=پاس ورڈ کی تصدیق میل نہیں کھاتی۔
    invalidPasswordMinLengthMessage=غلط پاس ورڈ: کم از کم {0} حروف ہوں۔
    invalidPasswordMaxLengthMessage=غلط پاس ورڈ: زیادہ سے زیادہ {0} حروف ہوں۔
    invalidPasswordMinDigitsMessage=غلط پاس ورڈ: کم از کم {0} ہندسے ہوں۔
    invalidPasswordMinLowerCaseCharsMessage=غلط پاس ورڈ: کم از کم {0} چھوٹے حروف ہوں۔
    invalidPasswordMinUpperCaseCharsMessage=غلط پاس ورڈ: کم از کم {0} بڑے حروف ہوں۔
    invalidPasswordMinSpecialCharsMessage=غلط پاس ورڈ: کم از کم {0} خاص علامتیں ہوں۔
    invalidPasswordNotUsernameMessage=غلط پاس ورڈ: یوزر نیم جیسا نہیں ہونا چاہیے۔
    invalidPasswordNotEmailMessage=غلط پاس ورڈ: ای میل جیسا نہیں ہونا چاہیے۔
    invalidPasswordHistoryMessage=غلط پاس ورڈ: پچھلے {0} پاس ورڈز میں سے کوئی نہیں ہونا چاہیے۔
    invalidPasswordGenericMessage=غلط پاس ورڈ: نیا پاس ورڈ پالیسی پر پورا نہیں اترتا۔
    # One text for every failed sign-in, locked or not, known account or not (REQ-SEC-005 AC2, D-104).
    invalidUserMessage=یوزر نیم یا پاس ورڈ غلط ہے۔ کئی ناکام کوششوں کے بعد سائن اِن عارضی طور پر رک جاتا ہے: کم از کم 15 منٹ انتظار کریں، پھر دوبارہ کوشش کریں۔
    accountTemporarilyDisabledMessage=یوزر نیم یا پاس ورڈ غلط ہے۔ کئی ناکام کوششوں کے بعد سائن اِن عارضی طور پر رک جاتا ہے: کم از کم 15 منٹ انتظار کریں، پھر دوبارہ کوشش کریں۔
    accountPermanentlyDisabledMessage=یوزر نیم یا پاس ورڈ غلط ہے۔ کئی ناکام کوششوں کے بعد سائن اِن عارضی طور پر رک جاتا ہے: کم از کم 15 منٹ انتظار کریں، پھر دوبارہ کوشش کریں۔
    
  login__resources__css__supportx.css: |
    /* Generated by backend/tooling/brand_assets.py from frontend/packages/ui/src/brand/palette.json.
       Do not edit: run `make brand-assets`. SupportX colours and logo on the keycloak.v2 login page
       (light, dark through keycloak.v2's own dark-mode class, and high contrast). */
    :root {
      --keycloak-card-top-color: #7e40d1;
      --pf-v5-global--primary-color--100: #7e40d1;
      --pf-v5-global--primary-color--200: #6f38b8;
      --pf-v5-global--link--Color: #7e40d1;
      --pf-v5-global--link--Color--hover: #6f38b8;
      --supportx-button: #7e40d1;
      --supportx-button-hover: #6f38b8;
      --supportx-card-top: linear-gradient(90deg, #6060de, #951ab6);
      --supportx-logo-url: url("../img/logo-dark-text.png");
    }
    :root.pf-v5-theme-dark {
      --pf-v5-global--primary-color--100: #7e40d1;
      --pf-v5-global--primary-color--200: #6f38b8;
      --pf-v5-global--link--Color: #bea0e8;
      --pf-v5-global--link--Color--hover: #bea0e8;
      --supportx-logo-url: url("../img/logo-white-text.png");
    }
    /* High contrast on a light page: the one-colour logo and the darker primary. A dark page keeps
       the dark settings above (its link colour is already above 7:1). */
    @media (prefers-contrast: more) {
      :root:not(.pf-v5-theme-dark) {
        --pf-v5-global--primary-color--100: #522a88;
        --pf-v5-global--primary-color--200: #000000;
        --pf-v5-global--link--Color: #522a88;
        --pf-v5-global--link--Color--hover: #000000;
        --supportx-button: #522a88;
        --supportx-button-hover: #000000;
        --supportx-card-top: linear-gradient(#000000, #000000);
        --supportx-logo-url: url("../img/logo-high-contrast.png");
      }
    }
    .login-pf body {
      background: #f5f5f5;
    }
    :root.pf-v5-theme-dark.login-pf body {
      background: #141414;
    }
    .pf-v5-c-login__main-header {
      border-top: 4px solid;
      border-image: var(--supportx-card-top) 1;
    }
    .pf-v5-c-button.pf-m-primary {
      --pf-v5-c-button--m-primary--BackgroundColor: var(--supportx-button);
      --pf-v5-c-button--m-primary--hover--BackgroundColor: var(--supportx-button-hover);
      --pf-v5-c-button--m-primary--focus--BackgroundColor: var(--supportx-button-hover);
      --pf-v5-c-button--m-primary--active--BackgroundColor: var(--supportx-button-hover);
      --pf-v5-c-button--m-primary--Color: #ffffff;
      --pf-v5-c-button--m-primary--hover--Color: #ffffff;
      --pf-v5-c-button--m-primary--focus--Color: #ffffff;
      --pf-v5-c-button--m-primary--active--Color: #ffffff;
    }
    /* The realm name stays in the page for screen readers; the logo is drawn behind it. */
    #kc-header-wrapper {
      background: var(--supportx-logo-url) center / contain no-repeat;
      height: 48px;
      color: transparent !important;
      overflow: hidden;
    }
    /* The organization's name under the logo (REQ-SEC-003), when Keycloak knows it: AA and more on
       the light (#f5f5f5), dark (#141414) and high-contrast page. */
    .supportx-org-name {
      margin: 8px 0 12px;
      text-align: center;
      font-size: 1.125rem;
      font-weight: 600;
      color: #262626;
      overflow-wrap: anywhere;
    }
    :root.pf-v5-theme-dark .supportx-org-name {
      color: #e6e6e6;
    }
    @media (prefers-contrast: more) {
      :root:not(.pf-v5-theme-dark) .supportx-org-name {
        color: #000000;
      }
    }
    
  login__template.ftl: |
    <#-- keycloak.v2's login template.ftl from Keycloak 26.8.1, unchanged except the blocks marked
         "SupportX" (docs/architecture/branding.md: on a Keycloak upgrade, copy the new upstream file
         and put the blocks back; backend/tests/test_keycloak_theme.py checks they are there). -->
    <#import "field.ftl" as field>
    <#import "footer.ftl" as loginFooter>
    <#import "theme-resources.ftl" as themeResourceTags>
    <#macro username>
      <#assign label>
        <#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
      </#assign>
      <@field.group name="username" label=label>
        <div class="${properties.kcInputGroup}">
          <div class="${properties.kcInputGroupItemClass} ${properties.kcFill}">
            <span class="${properties.kcInputClass} ${properties.kcFormReadOnlyClass}">
              <input id="kc-attempted-username" value="${auth.attemptedUsername}" readonly>
            </span>
          </div>
          <div class="${properties.kcInputGroupItemClass}">
            <button id="reset-login" class="${properties.kcFormPasswordVisibilityButtonClass} kc-login-tooltip" type="button" 
                  aria-label="${msg('restartLoginTooltip')}" onclick="location.href='${url.loginRestartFlowUrl}'">
                <i class="fa-sync-alt fas" aria-hidden="true"></i>
                <span class="kc-tooltip-text">${msg("restartLoginTooltip")}</span>
            </button>
          </div>
        </div>
      </@field.group>
    </#macro>
    
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false>
    <!DOCTYPE html>
    <#-- Keycloak does not count Urdu as right to left; SupportX does (CLAUDE.md rule d). -->
    <html class="${properties.kcHtmlClass!}" lang="${lang}"<#if realm.internationalizationEnabled> dir="${(locale.rtl || lang == 'ur')?then('rtl','ltr')}"</#if>>
    
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="color-scheme" content="light${darkMode?then(' dark', '')}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    
        <#if properties.meta?has_content>
            <#list properties.meta?split(' ') as meta>
                <meta name="${meta?split('==')[0]}" content="${meta?split('==')[1]}"/>
            </#list>
        </#if>
        <title>${title!}</title>
        <#if themeResources?? && themeResources.favicons?has_content>
            <@themeResourceTags.renderFavicons themeResources.favicons url.resourcesPath />
        <#else>
            <link rel="icon" href="${url.resourcesPath}/img/favicon.ico" />
        </#if>
        <#if themeResources?? && themeResources.stylesCommon?has_content>
            <@themeResourceTags.renderStyles themeResources.stylesCommon url.resourcesCommonPath />
        <#elseif properties.stylesCommon?has_content>
            <#list properties.stylesCommon?split(' ') as style>
                <link href="${url.resourcesCommonPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>
        <#if themeResources?? && themeResources.styles?has_content>
            <@themeResourceTags.renderStyles themeResources.styles url.resourcesPath />
        <#elseif properties.styles?has_content>
            <#list properties.styles?split(' ') as style>
                <link href="${url.resourcesPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>
        <#-- SupportX (WP-017, REQ-SEC-003): the tenant's colours and logo. Keycloak knows the
             organization when SupportX asked for it (scope organization:<alias>, from the tenant's
             address) or once the email's domain names it. The stylesheet comes from the SupportX API
             (public, cached), keyed by the organization's tenant_id attribute (an unguessable ID, so
             tenants cannot be listed or probed); without it the SupportX default above stays. -->
        <#if org?? && org.attributes?? && org.attributes.tenant_id?? && properties.supportxBrandingUrl?has_content>
            <link href="${properties.supportxBrandingUrl}/${org.attributes.tenant_id[0]?url('UTF-8')}/login.css" rel="stylesheet" />
        </#if>
        <#-- /SupportX -->
        <script type="importmap">
            {
                "imports": {
                    "rfc4648": "${url.resourcesCommonPath}/vendor/rfc4648/rfc4648.js"
                }
            }
        </script>
        <#if darkMode>
          <script type="module" async blocking="render">
              <#outputformat "JavaScript">
              const DARK_MODE_CLASS = ${properties.kcDarkModeClass?c};
              const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
    
              updateDarkMode(mediaQuery.matches);
              mediaQuery.addEventListener("change", (event) => updateDarkMode(event.matches));
    
              function updateDarkMode(isEnabled) {
                const { classList } = document.documentElement;
    
                if (isEnabled) {
                  classList.add(DARK_MODE_CLASS);
                } else {
                  classList.remove(DARK_MODE_CLASS);
                }
              }
              </#outputformat>
          </script>
        </#if>
        <#if themeResources?? && themeResources.scripts?has_content>
            <@themeResourceTags.renderScripts themeResources.scripts url.resourcesPath "text/javascript" />
        <#elseif properties.scripts?has_content>
            <#list properties.scripts?split(' ') as script>
                <script src="${url.resourcesPath}/${script}" type="text/javascript"></script>
            </#list>
        </#if>
        <#if scripts??>
            <#list scripts as script>
                <script src="${script}" type="text/javascript"></script>
            </#list>
        </#if>
        <script type="module" src="${url.resourcesPath}/js/passwordVisibility.js"></script>
        <script type="module">
            <#outputformat "JavaScript">
            import { startSessionPolling } from ${(url.resourcesPath + "/js/authChecker.js")?c};
    
            startSessionPolling(
                ${url.ssoLoginInOtherTabsUrl?c}
            );
            </#outputformat>
        </script>
        <script type="module">
            document.addEventListener("click", (event) => {
                const link = event.target.closest("a[data-once-link]");
    
                if (!link) {
                    return;
                }
    
                if (link.getAttribute("aria-disabled") === "true") {
                    event.preventDefault();
                    return;
                }
    
                const { disabledClass } = link.dataset;
    
                if (disabledClass) {
                    link.classList.add(...disabledClass.trim().split(/\s+/));
                }
    
                link.setAttribute("role", "link");
                link.setAttribute("aria-disabled", "true");
            });
        </script>
        <#if authenticationSession??>
            <script type="module">
                 <#outputformat "JavaScript">
                import { checkAuthSession } from ${(url.resourcesPath + "/js/authChecker.js")?c};
    
                checkAuthSession(
                    ${authenticationSession.authSessionIdHash?c}
                );
                </#outputformat>
            </script>
        </#if>
        <script>
          // Workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=1404468
          const isFirefox = true;
        </script>
    </head>
    
    <body id="keycloak-bg" class="${properties.kcBodyClass!}" data-page-id="login-${pageId}">
    <div class="${properties.kcLogin!}">
      <div class="${properties.kcLoginContainer!}">
        <header id="kc-header" class="pf-v5-c-login__header">
          <div id="kc-header-wrapper"
                  class="pf-v5-c-brand">${kcSanitize(msg("loginTitleHtml",(realm.displayNameHtml!'')))?no_esc}</div>
          <#-- SupportX (WP-017-FIX BUG-08, REQ-SEC-003): the organization's name under the logo, when
               Keycloak knows the organization (as for the stylesheet above). Plain text: HTML
               auto-escaping applies, never ?no_esc. -->
          <#if org?? && org.name?has_content>
          <p id="supportx-org-name" class="supportx-org-name">${org.name}</p>
          </#if>
          <#-- /SupportX -->
        </header>
        <main class="${properties.kcLoginMain!}">
          <div class="${properties.kcLoginMainHeader!}">
            <h1 class="${properties.kcLoginMainTitle!}" id="kc-page-title"><#nested "header"></h1>
            <#if realm.internationalizationEnabled  && locale.supported?size gt 1>
            <div class="${properties.kcLoginMainHeaderUtilities!}">
              <div class="${properties.kcInputClass!}">
                <select
                  aria-label="${msg("languages")}"
                  id="login-select-toggle"
                  onchange="if (this.value) window.location.href=this.value"
                >
                  <#list locale.supported?sort_by("label") as l>
                    <option
                      value="${l.url}"
                      ${(l.languageTag == locale.currentLanguageTag)?then('selected','')}
                    >
                      ${l.label}
                    </option>
                  </#list>
                </select>
                <span class="${properties.kcFormControlUtilClass}">
                  <span class="${properties.kcFormControlToggleIcon!}">
                    <svg
                      class="pf-v5-svg"
                      viewBox="0 0 320 512"
                      fill="currentColor"
                      aria-hidden="true"
                      role="img"
                      width="1em"
                      height="1em"
                    >
                      <path
                        d="M31.3 192h257.3c17.8 0 26.7 21.5 14.1 34.1L174.1 354.8c-7.8 7.8-20.5 7.8-28.3 0L17.2 226.1C4.6 213.5 13.5 192 31.3 192z"
                      >
                      </path>
                    </svg>
                  </span>
                </span>
              </div>
            </div>
            </#if>
          </div>
          <div class="${properties.kcLoginMainBody!}">
            <#if !(auth?has_content && auth.showUsername() && !auth.showResetCredentials())>
                <#if displayRequiredFields>
                    <div class="${properties.kcContentWrapperClass!}">
                        <div class="${properties.kcLabelWrapperClass!} subtitle">
                            <span class="${properties.kcInputHelperTextItemTextClass!}">
                              <span class="${properties.kcInputRequiredClass!}">*</span> ${msg("requiredFields")}
                            </span>
                        </div>
                    </div>
                </#if>
            <#else>
                <#if displayRequiredFields>
                    <div class="${properties.kcContentWrapperClass!}">
                        <div class="${properties.kcLabelWrapperClass!} subtitle">
                            <span class="${properties.kcInputHelperTextItemTextClass!}">
                              <span class="${properties.kcInputRequiredClass!}">*</span> ${msg("requiredFields")}
                            </span>
                        </div>
                        <div class="${properties.kcFormClass} ${properties.kcContentWrapperClass}">
                            <#nested "show-username">
                            <@username />
                        </div>
                    </div>
                <#else>
                    <div class="${properties.kcFormClass} ${properties.kcContentWrapperClass}">
                      <#nested "show-username">
                      <@username />
                    </div>
                </#if>
            </#if>
    
            <#-- App-initiated actions should not see warning messages about the need to complete the action -->
            <#-- during login.                                                                               -->
            <#if displayMessage && message?has_content && (message.type != 'warning' || !isAppInitiatedAction??)>
                <div class="${properties.kcAlertClass!} pf-m-${(message.type = 'error')?then('danger', message.type)}">
                    <div class="${properties.kcAlertIconClass!}">
                        <#if message.type = 'success'><span class="${properties.kcFeedbackSuccessIcon!}"></span></#if>
                        <#if message.type = 'warning'><span class="${properties.kcFeedbackWarningIcon!}"></span></#if>
                        <#if message.type = 'error'><span class="${properties.kcFeedbackErrorIcon!}"></span></#if>
                        <#if message.type = 'info'><span class="${properties.kcFeedbackInfoIcon!}"></span></#if>
                    </div>
                    <span class="${properties.kcAlertTitleClass!} kc-feedback-text">${message.summary}</span>
                </div>
            </#if>
    
            <#nested "form">
    
            <#if auth?has_content && auth.showTryAnotherWayLink()>
              <form id="kc-select-try-another-way-form" action="${url.loginAction}" method="post" novalidate="novalidate">
                  <input type="hidden" name="tryAnotherWay" value="on"/>
                  <a id="try-another-way" href="javascript:document.forms['kc-select-try-another-way-form'].requestSubmit()"
                      class="${properties.kcButtonSecondaryClass} ${properties.kcButtonBlockClass} ${properties.kcMarginTopClass}">
                        ${msg("doTryAnotherWay")}
                  </a>
              </form>
            </#if>
    
            <#if switchOrganizationEnabled?? && switchOrganizationEnabled>
              <form id="kc-switch-organization-form" action="${url.loginAction}" method="post" novalidate="novalidate">
                  <input type="hidden" name="switchOrganization" value="true"/>
                  <a id="switch-organization" href="javascript:document.forms['kc-switch-organization-form'].requestSubmit()"
                      class="${properties.kcButtonSecondaryClass} ${properties.kcButtonBlockClass} ${properties.kcMarginTopClass}">
                        ${msg("doSwitchOrganization")}
                  </a>
              </form>
            </#if>
    
              <div class="${properties.kcLoginMainFooter!}">
                  <#nested "socialProviders">
    
                  <#if displayInfo>
                      <div id="kc-info" class="${properties.kcLoginMainFooterBand!} ${properties.kcFormClass}">
                          <div id="kc-info-wrapper" class="${properties.kcLoginMainFooterBandItem!}">
                              <#nested "info">
                          </div>
                      </div>
                  </#if>
              </div>
          </div>
    
            <div class="${properties.kcLoginMainFooter!}">
                <@loginFooter.content/>
            </div>
        </main>
      </div>
    </div>
    </body>
    </html>
    </#macro>
    
  login__theme.properties: |
    # SupportX login theme (docs/architecture/branding.md): Keycloak's own keycloak.v2 pages with the
    # SupportX logo, favicon and colours. resources/ is generated by `make brand-assets`.
    parent=keycloak.v2
    import=common/keycloak
    styles=css/styles.css css/supportx.css
    darkMode=true
    # Where the tenant's sign-in stylesheet comes from (WP-017): the public branding route of the
    # SupportX API. Kubernetes serves Keycloak and the API on one host (D-038), so the default path
    # works there; Compose points it at the console's dev server, which proxies /api.
    supportxBrandingUrl=${env.SUPPORTX_BRANDING_URL:/api/v1/public/branding}
    
    # Where "Forgot password?" leads (WP-039, D-099): SupportX's reset page; empty = Keycloak's own.
    supportxPasswordResetUrl=${env.SUPPORTX_PASSWORD_RESET_URL:}
    
