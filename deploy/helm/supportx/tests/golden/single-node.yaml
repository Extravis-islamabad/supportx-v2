apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: supportx-pg-pooler
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/version: "0.1.0"
