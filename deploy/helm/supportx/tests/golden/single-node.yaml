apiVersion: apps/v1
kind: Deployment
metadata:
  name: supportx-keycloak
  labels:
    app.kubernetes.io/name: supportx
    app.kubernetes.io/instance: supportx
    app.kubernetes.io/component: keycloak
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: supportx
    helm.sh/chart: supportx-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: supportx
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supportx
        app.kubernetes.io/instance: supportx
        app.kubernetes.io/component: keycloak
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: supportx
        helm.sh/chart: supportx-0.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      
      securityContext:
        runAsNonRoot: true
        # The upstream image's user. Plain `start` builds the server at boot: its build output
        # and temp files go to the emptyDirs below; the rest of the filesystem is read-only.
        # An optimized image with our themes (`start --optimized`) comes with WP-014b / WP-017.
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The build directory starts as the image's own copy; `start` rebuilds into it.
        - name: copy-build
          image: quay.io/keycloak/keycloak:26.8.1
          command: ["/bin/sh", "-c", "cp -R /opt/keycloak/lib/quarkus/. /build/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: build, mountPath: /build}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start", "--import-realm"]
          env:
            - {name: KC_DB, value: postgres}
            - name: KC_DB_URL
              value: "jdbc:postgresql://supportx-pg-rw:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: supportx-db-keycloak, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-db-keycloak, key: password}}
            # TLS ends at the gateway; Keycloak trusts its X-Forwarded-* headers.
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            - {name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: /}
            - name: KC_HOSTNAME
              value: "https://supportx.example.com/auth"
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - name: KC_CACHE
              value: local
            - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25"}
            # Temporary bootstrap admin (Keycloak replaces it with real admins later).
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: supportx-app, key: keycloak-admin-password}}
            # Placeholders in the realm file.
            - name: SUPPORTX_KC_CONSOLE_SECRET
              valueFrom: {secretKeyRef: {name: supportx-app, key: oidc-console-secret}}
            - name: SUPPORTX_KC_PORTAL_SECRET
              valueFrom: {secretKeyRef: {name: supportx-app, key: oidc-portal-secret}}
            - {name: SUPPORTX_KC_CONSOLE_ORIGIN, value: "https://supportx.example.com"}
            - {name: SUPPORTX_KC_PORTAL_ORIGIN, value: "https://supportx.example.com"}
            # "Forgot password?" on the sign-in page: the portal's reset page (WP-039, D-099).
            - {name: SUPPORTX_PASSWORD_RESET_URL, value: "https://supportx.example.com/portal/password-reset"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "2"
              memory: 1536Mi
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: theme, mountPath: /opt/keycloak/themes/supportx, readOnly: true}
            - {name: password-blacklists, mountPath: /opt/keycloak/data/password-blacklists, readOnly: true}
            - {name: build, mountPath: /opt/keycloak/lib/quarkus}
            - {name: data-tmp, mountPath: /opt/keycloak/data/tmp}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: realm
          configMap: {name: supportx-keycloak-realm}
        - name: theme
          configMap:
            name: supportx-keycloak-theme
            items:
              - {key: email__html__executeActions.ftl, path: email/html/executeActions.ftl}
              - {key: email__messages__messages_ar.properties, path: email/messages/messages_ar.properties}
              - {key: email__messages__messages_en.properties, path: email/messages/messages_en.properties}
              - {key: email__messages__messages_ur.properties, path: email/messages/messages_ur.properties}
              - {key: email__text__executeActions.ftl, path: email/text/executeActions.ftl}
              - {key: email__theme.properties, path: email/theme.properties}
              - {key: login__field.ftl, path: login/field.ftl}
              - {key: login__messages__messages_ar.properties, path: login/messages/messages_ar.properties}
              - {key: login__messages__messages_en.properties, path: login/messages/messages_en.properties}
              - {key: login__messages__messages_ur.properties, path: login/messages/messages_ur.properties}
              - {key: login__resources__css__supportx.css, path: login/resources/css/supportx.css}
              - {key: login__resources__img__favicon.ico, path: login/resources/img/favicon.ico}
              - {key: login__resources__img__logo-dark-text.png, path: login/resources/img/logo-dark-text.png}
              - {key: login__resources__img__logo-high-contrast.png, path: login/resources/img/logo-high-contrast.png}
              - {key: login__resources__img__logo-white-text.png, path: login/resources/img/logo-white-text.png}
              - {key: login__template.ftl, path: login/template.ftl}
              - {key: login__theme.properties, path: login/theme.properties}
        - name: password-blacklists
          configMap: {name: supportx-keycloak-password-blacklists}
        - name: build
          emptyDir: {}
        - name: data-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}

