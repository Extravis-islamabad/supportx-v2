          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 1Gi
          volumeMounts:
            - {name: signatures, mountPath: /var/lib/clamav}
            - {name: config, mountPath: /etc/clamav-sx, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: clamd
          image: clamav/clamav:1.5.4-debian
          command: ["clamd", "--foreground", "--config-file=/etc/clamav-sx/clamd.conf"]
          ports:
            - {name: clamd, containerPort: 3310}
          startupProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 5
            failureThreshold: 60      # loading the signatures takes a minute or two
          readinessProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 1Gi
          volumeMounts:
            - {name: signatures, mountPath: /var/lib/clamav, readOnly: true}
            - {name: config, mountPath: /etc/clamav-sx, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: freshclam
          image: clamav/clamav:1.5.4-debian
          command: ["freshclam", "--daemon", "--foreground", "--config-file=/etc/clamav-sx/freshclam.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
