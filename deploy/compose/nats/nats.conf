# NATS server for local development: JetStream on, monitoring on 8222 (healthz, jsz, varz).
# DEV ONLY: no auth, no TLS. The in-cluster config (WP-014) is separate.
server_name: supportx-dev-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  # Kept small so the stack fits on a laptop; raise if local tests need more.
  max_memory_store: 256MB
  max_file_store: 2GB
}
