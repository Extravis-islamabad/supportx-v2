# Installed by `make setup`. Python and frontend hooks run the project's own pinned tools
# (uv / pnpm lockfiles) instead of separate hook environments, so versions never drift.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff (format)
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: eslint
        name: eslint
        # Run from frontend/: Corepack picks the pnpm pinned there (`packageManager`). From the
        # repo root it took the newest pnpm, which then refused the pinned version (2026-10-28).
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && pnpm format:check'
        language: system
        files: ^(frontend/|\.prettierrc\.json$|tsconfig\.base\.json$)
        pass_filenames: false
